name: NR Codex Engineering Runner Smoke

on:
  push:
    branches:
      - engineering/codex-runner-smoke-20261123
    paths:
      - .github/workflows/codex-runner-smoke.yml

permissions:
  contents: read

concurrency:
  group: nr-codex-runner-smoke
  cancel-in-progress: false

jobs:
  codex-readonly-smoke:
    name: Verify user-scoped Codex authentication
    runs-on: [self-hosted, Windows, X64, codex, engineering]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify runner identity and Codex login
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = (whoami).Trim()
          Write-Host "RUNNER_IDENTITY=$identity"
          if ($identity -ne 'desktop-tg85gf4\deniz') {
            throw "Unexpected runner identity; expected the authenticated interactive Windows account."
          }

          $codex = 'C:\ProgramData\NR\Codex\node_modules\.bin\codex.cmd'
          if (-not (Test-Path -LiteralPath $codex)) {
            throw "Codex CLI not found at the expected installation path."
          }

          & $codex --version
          if ($LASTEXITCODE -ne 0) { throw "Codex version check failed." }

          # Windows PowerShell 5.1 promotes native stderr to ErrorRecord.
          # Codex prints its successful login message on stderr, so capture it
          # with Continue and evaluate the native exit code explicitly.
          $previousPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $loginOutput = & $codex login status 2>&1 | ForEach-Object { "$_" }
          $loginExitCode = $LASTEXITCODE
          $ErrorActionPreference = $previousPreference
          $login = $loginOutput -join "`n"
          Write-Host $login
          if ($loginExitCode -ne 0 -or $login -notmatch 'Logged in using ChatGPT') {
            throw "Codex is not authenticated in this runner process (exit=$loginExitCode)."
          }

      - name: Run read-only repository audit with Codex
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $codex = 'C:\ProgramData\NR\Codex\node_modules\.bin\codex.cmd'
          # Feed the reviewed source directly to Codex. The Codex Windows
          # sandbox currently blocks child-process reads, even in read-only mode.
          # This keeps the agent read-only without granting broader shell access.
          $contextFiles = @(
            'AGENTS.md',
            'docs/GCN8_GFX8_ARTIFACT_44739871394.md',
            'platform/ps4/gcn8/host/resource_table_contract.h',
            'platform/ps4/gcn8/host/resource_table_contract.cpp',
            'tests/test_gcn8_resource_table.cpp'
          )
          $context = foreach ($path in $contextFiles) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required audit context file missing: $path"
            }
            "===== FILE: $path ====="
            Get-Content -Raw -LiteralPath $path
          }
          $prompt = @"
          Execute uma auditoria técnica somente de leitura dos Gates A, B, C e D do Neural Rendering.
          IMPORTANTE: o contexto integral dos arquivos-fonte revisados está abaixo. Use EXCLUSIVAMENTE esse contexto; não invoque ferramentas, shell, PowerShell, Git, rede ou outras leituras. Não altere arquivos nem crie commits.
          O documento docs/GCN8_GNM_COMPUTE_READINESS.md NÃO existe neste checkout; não invente seu conteúdo. Use o relatório GFX8 e os fontes/testes fornecidos.
          Diferencie claramente compilação/artefato host de ABI GNM, dispatch, sincronização, readback e execução real no PS4 Pro. Liste evidências concretas com caminhos, o que está provado, o que não está provado e os próximos passos mínimos.
          CONTEXTO:
          $($context -join "`n")
          "@
          $previousPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $auditOutput = $prompt | & $codex exec --skip-git-repo-check --sandbox read-only 2>&1 | ForEach-Object { "$_" }
          $auditExitCode = $LASTEXITCODE
          $ErrorActionPreference = $previousPreference
          $auditOutput | ForEach-Object { Write-Host $_ }
          if ($auditExitCode -ne 0) { throw "Codex read-only audit failed with exit code $auditExitCode." }
          if (-not ($auditOutput -join "`n")) { throw "Codex read-only audit returned no output." }
