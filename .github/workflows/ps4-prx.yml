name: PS4 PRX and PKG build

# Trigger a fresh artifact for the configured PS4 Windows bridge.
# Feature-branch bridge maintenance archives existing Neural Rendering PKGs under /data/pkg/old.

concurrency:
  # Keep a reproducible PRX/PKG build running while later commits queue.
  group: ps4-prx-pkg-build-sony-patch-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [main, feature/gcn8-numeric-kernels]
    paths:
      - "src/**"
      - "include/**"
      - "platform/ps4/**"
      - "tests/gcn8_gnm_api_smoke.cpp"
      - "installer/**"
      - "assets/**"
      - "tools/**"
      - "PKG_BUILD_NUMBER"
      - "docs/PKG_INSTALLER.md"
      - ".github/workflows/ps4-prx.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "platform/ps4/**"
      - "installer/**"
      - "assets/**"
      - "tools/**"
      - "PKG_BUILD_NUMBER"
      - "docs/PKG_INSTALLER.md"
      - ".github/workflows/ps4-prx.yml"

permissions:
  contents: read
  actions: read

jobs:
  build-prx-and-pkg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact approved Neural Rendering icon
        run: |
          test -f assets/neural-rendering-icon-source.png
          echo "7fe6a11ad7b4d37e5741c77822730a82487237dbed4a3eca529e995a29421ae4  assets/neural-rendering-icon-source.png" | sha256sum -c -
          file assets/neural-rendering-icon-source.png
      - name: Install LLVM and SVG rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 make libc6-dev python3-pil
          echo "$(dirname "$(readlink -f "$(command -v clang-18)")")" >> "$GITHUB_PATH"
          sudo ln -sf "$(command -v clang-18)" /usr/local/bin/clang
          sudo ln -sf "$(command -v clang++-18)" /usr/local/bin/clang++
          sudo ln -sf "$(command -v ld.lld-18)" /usr/local/bin/ld.lld
      - name: Install legacy LibOrbisPkg runtime dependency
        run: |
          echo "deb [arch=amd64] https://archive.ubuntu.com/ubuntu focal-updates main" | sudo tee /etc/apt/sources.list.d/focal-updates.list
          sudo apt-get update
          sudo apt-get install -y libssl1.1=1.1.1f-1ubuntu2.24 libicu66=66.1-2ubuntu2.1
      - name: Download pinned OpenOrbis toolchain
        run: |
          curl -fL --retry 3 -o /tmp/openorbis.tar.gz https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  /tmp/openorbis.tar.gz" | sha256sum -c -
          tar -xzf /tmp/openorbis.tar.gz -C "$GITHUB_WORKSPACE"
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"

      - name: Preserve exact OpenOrbis GNM import stub for forensic audit
        run: |
          set -euo pipefail
          mkdir -p dist/gcn8-smoke/openorbis-import-audit
          audit="dist/gcn8-smoke/openorbis-import-audit"
          mapfile -d '' libs < <(find -L "$OO_PS4_TOOLCHAIN/lib" -maxdepth 1 -type f -iname '*GnmDriver*' -print0)
          if [[ ${#libs[@]} -eq 0 ]]; then
            echo "No GnmDriver import library found in $OO_PS4_TOOLCHAIN/lib" | tee "$audit/RESULT.txt"
            exit 1
          fi
          : > "$audit/RESULT.txt"
          for lib in "${libs[@]}"; do
            base="$(basename "$lib")"
            cp -L "$lib" "$audit/$base"
            {
              echo "=== FILE: $lib ==="
              file "$lib"
              echo "--- SHA256 ---"
              sha256sum "$lib"
              echo "--- ARCHIVE MEMBERS (if archive) ---"
              ar t "$lib" 2>&1 || true
              echo "--- SYMBOLS ---"
              nm -A "$lib" 2>&1 || true
              echo "--- ELF HEADERS / SECTIONS / DYNAMIC / RELOCS ---"
              readelf -W -h -S -d -r -s "$lib" 2>&1 || true
              echo "--- RELEVANT STRINGS ---"
              strings -a "$lib" | grep -Ei 'sceGnmSubmitDone|yvZ73uQUqrk|CAF67BDEE414AAB9|libSceGnmDriver' || true
            } >> "$audit/RESULT.txt"
          done
          echo "OPENORBIS_GNM_IMPORT_STUB_AUDIT=CAPTURED"
      - name: Checkout and patch pinned LibOrbisPkg builder
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/LibOrbisPkg
          ref: 92a4e7f8e5914cb06b52ba3ae6b0675da438a051
          path: LibOrbisPkg-src
      - name: Build patched PkgTool.Core preserving PUBTOOLINFO storage type
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compile patched PkgTool.Core
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("LibOrbisPkg-src/LibOrbisPkg/PKG/PkgBuilder.cs")
          s = p.read_text(encoding="utf-8-sig")
          old = 'sfo["PUBTOOLINFO"] = new SFO.Utf8Value("PUBTOOLINFO", date+time+sizeInfo, 0x200);'
          new = 'sfo["PUBTOOLINFO"] = new SFO.Utf8Value("PUBTOOLINFO", date+time+sizeInfo+",st_type=digital50", 0x200);'
          copy_before = '        pkg.ParamSfo = new SfoEntry(sfo);'
          copy_after = '        pkg.ParamSfo = new SfoEntry(sfo);'
          if s.count(old) != 1 or s.count(copy_before) != 1:
              raise SystemExit("Expected unique upstream SFO metadata/copy anchors were not found; refusing an ambiguous patch.")
          s = s.replace(old, new)
          s = s.replace(copy_before + "\n", "", 1)
          marker = '        sfo["PUBTOOLVER"] = new SFO.IntegerValue("PUBTOOLVER", 0x02890000);'
          if s.count(marker) != 1:
              raise SystemExit("Expected unique PUBTOOLVER finalization anchor was not found.")
          s = s.replace(marker, marker + "\n" + copy_after, 1)
          p.write_text(s, encoding="utf-8")
          check = p.read_text(encoding="utf-8")
          if new not in check or check.count(copy_after) != 1:
              raise SystemExit("Final SFO must contain one post-metadata copy operation.")
          if check.index(copy_after) < check.index(marker):
              raise SystemExit("SFO copy still occurs before PUBTOOLVER finalization.")
          print("PKG_BUILDER_PATCH=verified; final SFO copy now occurs after PUBTOOLINFO/PUBTOOLVER updates")
          PY
          dotnet publish LibOrbisPkg-src/PkgTool.Core/PkgTool.Core.csproj -c Release -r linux-x64 --self-contained false -o "$RUNNER_TEMP/pkgtool-patched"
          test -x "$RUNNER_TEMP/pkgtool-patched/PkgTool.Core"
          mkdir -p "$OO_PS4_TOOLCHAIN/bin/linux/pkgtool-patched"
          cp -a "$RUNNER_TEMP/pkgtool-patched/." "$OO_PS4_TOOLCHAIN/bin/linux/pkgtool-patched/"
          echo "PKGTOOL_CORE=$OO_PS4_TOOLCHAIN/bin/linux/pkgtool-patched/PkgTool.Core" >> "$GITHUB_ENV"
          "$OO_PS4_TOOLCHAIN/bin/linux/pkgtool-patched/PkgTool.Core" 2>&1 | head -n 8 || true

      - name: Checkout pinned GoldHEN plugin SDK
        uses: actions/checkout@v4
        with:
          repository: GoldHEN/GoldHEN_Plugins_SDK
          ref: bcea3c7ef01dac6d7f9f49ebf9e90fe66d86f5f7
          path: GoldHEN_Plugins_SDK
      - name: Build and verify pinned GoldHEN SDK PRX CRT object
        run: |
          # Do not call the upstream `crt` Make target here: at pinned SDK
          # bcea3c7 its recipe uses plain "mkdir build", which fails because
          # checkout/build tooling may already have created that directory.
          # Mirror the exact upstream compile recipe, but make directory setup idempotent.
          SDK="$GITHUB_WORKSPACE/GoldHEN_Plugins_SDK"
          CRT="$SDK/build/crtprx.o"
          mkdir -p "$SDK/build"
          clang -target x86_64-pc-linux-gnu -ffreestanding -nostdlib -fno-builtin -fPIC \
            -isysroot "$OO_PS4_TOOLCHAIN" \
            -isystem "$OO_PS4_TOOLCHAIN/include" \
            -c "$SDK/crt/crtprx.c" -o "$CRT"
          test -s "$CRT"
          file "$CRT"
          readelf -h "$CRT" | grep -Eq 'Class:[[:space:]]+ELF64'
          readelf -h "$CRT" | grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64'
          sha256sum "$CRT"
          echo "GOLDHEN_CRT=PASS; source=crt/crtprx.c; upstream flags preserved; idempotent mkdir"
      - name: Checkout pinned OpenGNM API headers
        uses: actions/checkout@v4
        with:
          repository: PS4-OpenGNM/opengnm
          ref: 4b295ca54c82c83acf308d1c646a2dfa9ae57350
          path: OpenGNM
      - name: Build OpenOrbis Startup-Only diagnostic PKG (no GNM import)
        env:
          GCN8_SMOKE_MODE: startup
          OPEN_GNM_INCLUDE: ${{ github.workspace }}/OpenGNM/include
        run: |
          bash -n tools/build_compute_smoke_pkg.sh
          bash tools/build_compute_smoke_pkg.sh
          test -s "dist/gcn8-smoke/${GITHUB_RUN_ID}/startup/SMOKE_PKG_MANIFEST.txt"
          test -s "dist/gcn8-smoke/${GITHUB_RUN_ID}/startup/smoke.elf"
          test -s "dist/gcn8-smoke/${GITHUB_RUN_ID}/startup/smoke.map"
      - name: Build OpenOrbis GNM-Load-Only diagnostic PKG (no console execution)
        env:
          GCN8_SMOKE_MODE: gnm-load
          OPEN_GNM_INCLUDE: ${{ github.workspace }}/OpenGNM/include
        run: |
          bash -n tools/build_compute_smoke_pkg.sh
          bash tools/build_compute_smoke_pkg.sh
          test -s "dist/gcn8-smoke/${GITHUB_RUN_ID}/gnm-load/SMOKE_PKG_MANIFEST.txt"
          test -s "dist/gcn8-smoke/${GITHUB_RUN_ID}/gnm-load/smoke.elf"
          test -s "dist/gcn8-smoke/${GITHUB_RUN_ID}/gnm-load/smoke.map"
      - name: Compile GCN8 GNM API and ABI smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/gcnm-smoke"
          clang++ --target=x86_64-pc-freebsd12-elf -std=c++17 -fPIC -fno-exceptions -fno-rtti -DOPENGNM_REQUIRE_ABI=1 -isysroot "$OO_PS4_TOOLCHAIN" -isystem "$OO_PS4_TOOLCHAIN/include" -isystem /usr/include/x86_64-linux-gnu -isystem "$OO_PS4_TOOLCHAIN/include/c++/v1" -IOpenGNM/include -c tests/gcn8_gnm_api_smoke.cpp -o "$RUNNER_TEMP/gcnm-smoke/gcn8_gnm_api_smoke.o"
          clang++ --target=x86_64-pc-freebsd12-elf -std=c++17 -fPIC -fno-exceptions -fno-rtti -DOPENGNM_REQUIRE_ABI=1 -isysroot "$OO_PS4_TOOLCHAIN" -isystem "$OO_PS4_TOOLCHAIN/include" -isystem /usr/include/x86_64-linux-gnu -isystem "$OO_PS4_TOOLCHAIN/include/c++/v1" -IOpenGNM/include -c platform/ps4/gcn8/gnm_resource_binding.cpp -o "$RUNNER_TEMP/gcnm-smoke/gnm_resource_binding.o"
          clang++ --target=x86_64-pc-freebsd12-elf -std=c++17 -fPIC -fno-exceptions -fno-rtti -isysroot "$OO_PS4_TOOLCHAIN" -isystem "$OO_PS4_TOOLCHAIN/include" -isystem /usr/include/x86_64-linux-gnu -isystem "$OO_PS4_TOOLCHAIN/include/c++/v1" -Iplatform/ps4/gcn8/host -c platform/ps4/gcn8/host/resource_table_contract.cpp -o "$RUNNER_TEMP/gcnm-smoke/resource_table_contract.o"
          test -s "$RUNNER_TEMP/gcnm-smoke/gcn8_gnm_api_smoke.o"
          test -s "$RUNNER_TEMP/gcnm-smoke/gnm_resource_binding.o"
          test -s "$RUNNER_TEMP/gcnm-smoke/resource_table_contract.o"
          echo "GCN8_GNM_API_SMOKE=compiled; no firmware calls or GPU dispatch executed"
      - name: Link GCN8 OpenOrbis GNM stub (link-only; not a Sony import)
        run: |
          ld.lld -m elf_x86_64 -pie --script "$OO_PS4_TOOLCHAIN/link.x" -e _init --eh-frame-hdr -L"$OO_PS4_TOOLCHAIN/lib" "$GITHUB_WORKSPACE/GoldHEN_Plugins_SDK/build/crtprx.o" "$RUNNER_TEMP/gcnm-smoke/gcn8_gnm_api_smoke.o" "$RUNNER_TEMP/gcnm-smoke/gnm_resource_binding.o" "$RUNNER_TEMP/gcnm-smoke/resource_table_contract.o" -o "$RUNNER_TEMP/gcnm-smoke/gcn8_gnm_link_smoke.elf" -lSceLibcInternal -lSceGnmDriver -lkernel
          test -s "$RUNNER_TEMP/gcnm-smoke/gcn8_gnm_link_smoke.elf"
          readelf -h "$RUNNER_TEMP/gcnm-smoke/gcn8_gnm_link_smoke.elf" | grep -Eq 'Entry point address:[[:space:]]+0x[1-9a-fA-F]'
          echo "OPENORBIS_GNM_LINK_STUB=LINKED; SONY_RUNTIME_IMPORT=NOT_VALIDATED; no firmware calls or GPU dispatch executed"
      - name: Build GoldHEN hook library
        run: |
          sed -i 's|-isystem $(TOOLCHAIN)/include|-isystem $(TOOLCHAIN)/include -isystem /usr/include/x86_64-linux-gnu|' GoldHEN_Plugins_SDK/Makefile
          make -C GoldHEN_Plugins_SDK PRINTF=1 DEBUGFLAGS=1
      - name: Build PS4 PRX
        run: make -C platform/ps4/goldhen/plugin
      - name: Audit Sony GNM import metadata in PRX
        run: |
          python3 tools/audit_ps4_self_imports.py \
            --input dist/ps4/ps4_neural_engine.prx \
            --require-import libSceGnmDriver:libSceGnmDriver:xbxNatawohc
      - name: Download legacy GNM-Link artifact for one-time OELF re-audit
        if: contains(github.event.head_commit.message, 'AUDIT_LEGACY_GNM_LINK')
        uses: actions/download-artifact@v4
        with:
          name: ps4-neural-engine-build
          run-id: 44873622760
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/legacy-gnm-link
      - name: Re-audit legacy GNM-Link eboot Sony imports
        if: contains(github.event.head_commit.message, 'AUDIT_LEGACY_GNM_LINK')
        run: |
          legacy_pkg="$RUNNER_TEMP/legacy-gnm-link/gcn8-smoke/44873622760/gnm-link/PS4-Neural-Rendering-GCN8-gnm-link-44873622760.pkg"
          test -s "$legacy_pkg"
          "$PKGTOOL_CORE" pkg_extract --verbose "$legacy_pkg" "$RUNNER_TEMP/legacy-gnm-link/extracted"
          legacy_eboot="$RUNNER_TEMP/legacy-gnm-link/extracted/uroot/eboot.bin"
          test -s "$legacy_eboot"
          python3 tools/audit_ps4_self_imports.py \
            --input "$legacy_eboot" \
            --require-import libSceGnmDriver:libSceGnmDriver:yvZ73uQUqrk
      - name: Build GoldHEN Plugin Source archive
        run: python3 tools/build_goldhen_plugin_archive.py
      - name: Build installable PKG
        run: bash tools/build_pkg.sh
      - name: Preserve GP4 and release metadata for independent QA
        run: |
          mkdir -p dist/pkg/audit
          PKG_NUMBER="$(cat PKG_BUILD_NUMBER | tr -d '[:space:]')"
          cp build/pkg-stage/package.gp4 "dist/pkg/audit/PS4-Neural-Engine-${PKG_NUMBER}.gp4"
          cp build/pkg-stage/sce_sys/param.sfo dist/pkg/audit/param.sfo
          cp build/pkg-stage/pne-release.ini dist/pkg/audit/pne-release.ini
          test -s "dist/pkg/audit/PS4-Neural-Engine-${PKG_NUMBER}.gp4"
          test -s dist/pkg/audit/param.sfo
          test -s dist/pkg/audit/pne-release.ini
      - name: Upload PRX and PKG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps4-neural-engine-build
          path: |
            dist/ps4/ps4_neural_engine.prx
            dist/ps4/ps4_neural_engine.elf
            dist/pkg/*.pkg
            dist/pkg/audit/*
            dist/goldhen/*.zip
            dist/goldhen/*.sha256
            dist/gcn8-smoke/**
          if-no-files-found: error

  independent-pkg-qa:
    name: independent-pkg-qa
    needs: build-prx-and-pkg
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout pinned independent PKG inspector
        uses: actions/checkout@v4
        with:
          repository: pearlxcore/OrbisPkgTool
          ref: 3de6da849b64a8ad0d5ba00dd4e8919934b868b0
          path: OrbisPkgTool-src
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download exact build artifact
        uses: actions/download-artifact@v4
        with:
          name: ps4-neural-engine-build
          path: build-artifact
      - name: Build independent inspector
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet build OrbisPkgTool-src/OrbisPkgTool/OrbisPkgTool.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Independent PKG inspector build failed." }
          $tool = "OrbisPkgTool-src/OrbisPkgTool/bin/Release/net10.0-windows/OrbisPkgTool.dll"
          if (-not (Test-Path $tool)) { throw "Inspector DLL missing." }
          "TOOL=$tool" | Out-File "$env:RUNNER_TEMP\pkg-independent-tool.txt"
      - name: Independently validate GP4, PKG, SFO, manifest and payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tool = (Get-Content "$env:RUNNER_TEMP\pkg-independent-tool.txt" | Select-Object -First 1).Substring(5)
          $artifact = Join-Path $env:GITHUB_WORKSPACE "build-artifact"
          $manifest = Join-Path $artifact "pkg/audit/pne-release.ini"
          if (-not (Test-Path $manifest)) { throw "Release manifest missing." }
          $manifestLines = Get-Content $manifest
          $releaseNumber = (($manifestLines | Where-Object { $_ -like "release_number=*" } | Select-Object -First 1) -replace "release_number=","")
          $appVersion = (($manifestLines | Where-Object { $_ -like "app_version=*" } | Select-Object -First 1) -replace "app_version=","")
          if ($releaseNumber -notmatch "^[0-9]{3,}$" -or $appVersion -notmatch "^[0-9]{2}\.[0-9]{2}$") { throw "Invalid release number or app version in manifest." }
          $pkg = Join-Path $artifact "pkg/PS4-Neural-Engine-$releaseNumber.pkg"
          $gp4 = Join-Path $artifact "pkg/audit/PS4-Neural-Engine-$releaseNumber.gp4"
          $sfo = Join-Path $artifact "pkg/audit/param.sfo"
          $sourcePrx = Join-Path $artifact "ps4/ps4_neural_engine.prx"
          foreach ($file in @($pkg,$gp4,$manifest,$sfo,$sourcePrx)) {
            if (-not (Test-Path $file)) { throw "Required audit input missing: $file" }
          }
          New-Item -ItemType Directory -Force -Path qa-output | Out-Null
          $pkgHash = (Get-FileHash -Algorithm SHA256 $pkg).Hash.ToLowerInvariant()
          $gp4Hash = (Get-FileHash -Algorithm SHA256 $gp4).Hash.ToLowerInvariant()
          $sourcePrxHash = (Get-FileHash -Algorithm SHA256 $sourcePrx).Hash.ToLowerInvariant()
          $gp4Text = Get-Content $gp4 -Raw
          if ($gp4Text -notmatch "IV0000-PNEU00001_00-PS4NEURALENG0000") { throw "GP4 CONTENT_ID mismatch." }
          foreach ($entry in @("eboot.bin","ps4_neural_engine.prx","pne-release.ini","sce_sys/param.sfo")) {
            if ($gp4Text -notmatch [regex]::Escape($entry)) { throw "GP4 file association missing: $entry" }
          }
          $manifestText = Get-Content $manifest -Raw
          foreach ($required in @("schema=1","release_number=$releaseNumber","title_id=PNEU00001","content_id=IV0000-PNEU00001_00-PS4NEURALENG0000","abi_status=unverified","hardware_status=not_tested","prx_sha256=$sourcePrxHash")) {
            if ($manifestText -notmatch [regex]::Escape($required)) { throw "Release manifest mismatch: $required" }
          }
          dotnet "$tool" validate "$pkg" 2>&1 | Tee-Object qa-output/pkg-validation.txt
          if ($LASTEXITCODE -ne 0) { throw "Independent PKG validation failed." }
          $out = Join-Path $env:RUNNER_TEMP "pkg-independent-extracted"
          dotnet "$tool" extract "$pkg" "$out" --verbose 2>&1 | Tee-Object qa-output/pkg-extract.txt
          if ($LASTEXITCODE -ne 0) { throw "Independent PKG extraction failed." }
          $embeddedSfo = Get-ChildItem $out -Recurse -File -Filter param.sfo | Select-Object -First 1
          if (-not $embeddedSfo) { throw "Embedded PARAM.SFO missing." }
          $stagedSfoHash = (Get-FileHash -Algorithm SHA256 $sfo).Hash.ToLowerInvariant()
          $embeddedSfoHash = (Get-FileHash -Algorithm SHA256 $embeddedSfo.FullName).Hash.ToLowerInvariant()
          Copy-Item $sfo qa-output/staged-param.sfo
          Copy-Item $embeddedSfo.FullName qa-output/embedded-param.sfo
          $stagedSfoText = (dotnet "$tool" sfo read "$sfo" 2>&1) -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0) { throw "Staged GP4 SFO read failed." }
          $embeddedSfoText = (dotnet "$tool" sfo read "$($embeddedSfo.FullName)" 2>&1) -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0) { throw "Embedded SFO read failed." }
          $stagedSfoText | Out-File qa-output/staged-param-sfo.txt
          $embeddedSfoText | Out-File qa-output/embedded-param-sfo.txt
          foreach ($required in @("CATEGORY = gde","APP_VER = $appVersion","VERSION = $appVersion","TITLE_ID = PNEU00001","CONTENT_ID = IV0000-PNEU00001_00-PS4NEURALENG0000","st_type=digital50")) {
            if ($stagedSfoText -notmatch [regex]::Escape($required)) { throw "Staged GP4 SFO missing expected field: $required" }
            if ($embeddedSfoText -notmatch [regex]::Escape($required)) { throw "Embedded SFO missing expected field: $required" }
          }
          $eboot = Get-ChildItem $out -Recurse -File | Where-Object { $_.Name -eq "eboot.bin" } | Select-Object -First 1
          $prx = Get-ChildItem $out -Recurse -File | Where-Object { $_.Name -eq "ps4_neural_engine.prx" } | Select-Object -First 1
          $embeddedManifest = Get-ChildItem $out -Recurse -File | Where-Object { $_.Name -eq "pne-release.ini" } | Select-Object -First 1
          if (-not $eboot -or $eboot.Length -le 0) { throw "Fresh installer eboot.bin missing." }
          if (-not $prx -or $prx.Length -le 0) { throw "Packaged PRX missing." }
          if (-not $embeddedManifest) { throw "Packaged release manifest missing." }
          $embeddedPrxHash = (Get-FileHash -Algorithm SHA256 $prx.FullName).Hash.ToLowerInvariant()
          if ($embeddedPrxHash -ne $sourcePrxHash) { throw "Packaged PRX differs from standalone build PRX." }
          if ((Get-Content $embeddedManifest.FullName -Raw) -ne $manifestText) { throw "Packaged manifest differs from staged release manifest." }
          "PKG_KIND=FULL_BASE_APPLICATION_NOT_PATCH" | Out-File qa-output/qa-report.txt
          "PKG_BYTES=$((Get-Item $pkg).Length)" | Out-File qa-output/qa-report.txt -Append
          "PKG_SHA256=$pkgHash" | Out-File qa-output/qa-report.txt -Append
          "GP4_SHA256=$gp4Hash" | Out-File qa-output/qa-report.txt -Append
          "STAGED_PARAM_SFO_SHA256=$stagedSfoHash" | Out-File qa-output/qa-report.txt -Append
          "EMBEDDED_PARAM_SFO_SHA256=$embeddedSfoHash" | Out-File qa-output/qa-report.txt -Append
          "PARAM_SFO_SEMANTIC_FIELDS=PASS" | Out-File qa-output/qa-report.txt -Append
          "PRX_SHA256=$embeddedPrxHash" | Out-File qa-output/qa-report.txt -Append
          "EBOOT_BYTES=$($eboot.Length)" | Out-File qa-output/qa-report.txt -Append
          "CATEGORY=gde; APP_VER=$appVersion; VERSION=$appVersion; STORAGE=digital50" | Out-File qa-output/qa-report.txt -Append
          "QA_STATUS=PASS_PC_ONLY_NOT_HARDWARE_TESTED" | Out-File qa-output/qa-report.txt -Append
          Get-Content qa-output/qa-report.txt | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - name: Independently validate Startup-Only diagnostic PKG
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tool = (Get-Content "$env:RUNNER_TEMP\pkg-independent-tool.txt" | Select-Object -First 1).Substring(5)
          $artifact = Join-Path $env:GITHUB_WORKSPACE "build-artifact"
          $startupPkg = Get-ChildItem $artifact -Recurse -File -Filter "PS4-Neural-Rendering-GCN8-startup-*.pkg" | Select-Object -First 1
          $manifest = Get-ChildItem $artifact -Recurse -File -Filter "SMOKE_PKG_MANIFEST.txt" | Where-Object { (Get-Content $_.FullName -Raw) -match "mode=startup" } | Select-Object -First 1
          $elf = Get-ChildItem $artifact -Recurse -File -Filter smoke.elf | Where-Object { $_.DirectoryName -like "*startup*" } | Select-Object -First 1
          $map = Get-ChildItem $artifact -Recurse -File -Filter smoke.map | Where-Object { $_.DirectoryName -like "*startup*" } | Select-Object -First 1
          foreach ($item in @($startupPkg,$manifest,$elf,$map)) { if (-not $item) { throw "Startup-only artifact file missing." } }
          $manifestText = Get-Content $manifest.FullName -Raw
          $pkgHash = (Get-FileHash $startupPkg.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $elfHash = (Get-FileHash $elf.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $mapHash = (Get-FileHash $map.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          foreach ($required in @("mode=startup","title_id=PNEU00003","content_id=IV0000-PNEU00003_00-GCN8STARTUP00000","gnm_import_probe=none","gnm_function_calls=none","elf_sha256=$elfHash","map_sha256=$mapHash","hardware_status=not_run")) {
            if ($manifestText -notmatch [regex]::Escape($required)) { throw "Startup-only manifest mismatch: $required" }
          }
          dotnet "$tool" validate "$($startupPkg.FullName)" 2>&1 | Tee-Object qa-output/startup-pkg-validation.txt
          if ($LASTEXITCODE -ne 0) { throw "Independent Startup-only PKG validation failed." }
          $out = Join-Path $env:RUNNER_TEMP "startup-independent-extracted"
          dotnet "$tool" extract "$($startupPkg.FullName)" "$out" --verbose 2>&1 | Tee-Object qa-output/startup-pkg-extract.txt
          if ($LASTEXITCODE -ne 0) { throw "Independent Startup-only PKG extraction failed." }
          $sfo = Get-ChildItem $out -Recurse -File -Filter param.sfo | Select-Object -First 1
          if (-not $sfo) { throw "Startup-only embedded PARAM.SFO missing." }
          $sfoText = (dotnet "$tool" sfo read "$($sfo.FullName)" 2>&1) -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0) { throw "Startup-only SFO read failed." }
          foreach ($required in @("CATEGORY = gde","APP_VER = 01.00","VERSION = 01.00","TITLE_ID = PNEU00003","CONTENT_ID = IV0000-PNEU00003_00-GCN8STARTUP00000")) {
            if ($sfoText -notmatch [regex]::Escape($required)) { throw "Startup-only SFO missing: $required" }
          }
          $eboot = Get-ChildItem $out -Recurse -File -Filter eboot.bin | Select-Object -First 1
          $shader = Get-ChildItem $out -Recurse -File -Filter compute_smoke_add.sb | Select-Object -First 1
          if (-not $eboot -or $eboot.Length -le 0) { throw "Startup-only eboot missing." }
          if ($shader) { throw "Startup-only PKG unexpectedly contains compute shader." }
          "STARTUP_PKG_SHA256=$pkgHash" | Out-File qa-output/startup-qa-report.txt
          "STARTUP_ELF_SHA256=$elfHash" | Out-File qa-output/startup-qa-report.txt -Append
          "STARTUP_MAP_SHA256=$mapHash" | Out-File qa-output/startup-qa-report.txt -Append
          "STARTUP_SFO=PASS; GNM_IMPORT=ABSENT; COMPUTE_SHADER=ABSENT" | Out-File qa-output/startup-qa-report.txt -Append
          "STARTUP_QA_STATUS=PASS_PC_ONLY_NOT_HARDWARE_TESTED" | Out-File qa-output/startup-qa-report.txt -Append
          Get-Content qa-output/startup-qa-report.txt | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - name: Independently validate GNM-Load-Only diagnostic PKG
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tool = (Get-Content "$env:RUNNER_TEMP\\pkg-independent-tool.txt" | Select-Object -First 1).Substring(5)
          $artifact = Join-Path $env:GITHUB_WORKSPACE "build-artifact"
          $gnmPkg = Get-ChildItem $artifact -Recurse -File -Filter "PS4-Neural-Rendering-GCN8-gnm-load-*.pkg" | Select-Object -First 1
          $manifest = Get-ChildItem $artifact -Recurse -File -Filter "SMOKE_PKG_MANIFEST.txt" | Where-Object { (Get-Content $_.FullName -Raw) -match "mode=gnm-load" } | Select-Object -First 1
          $elf = Get-ChildItem $artifact -Recurse -File -Filter smoke.elf | Where-Object { $_.DirectoryName -like "*gnm-load*" } | Select-Object -First 1
          $oelf = Get-ChildItem $artifact -Recurse -File -Filter smoke.oelf | Where-Object { $_.DirectoryName -like "*gnm-load*" } | Select-Object -First 1
          $map = Get-ChildItem $artifact -Recurse -File -Filter smoke.map | Where-Object { $_.DirectoryName -like "*gnm-load*" } | Select-Object -First 1
          foreach ($item in @($gnmPkg,$manifest,$elf,$oelf,$map)) { if (-not $item) { throw "GNM-Load-only artifact file missing." } }
          $manifestText = Get-Content $manifest.FullName -Raw
          $pkgHash = (Get-FileHash $gnmPkg.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $elfHash = (Get-FileHash $elf.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $oelfHash = (Get-FileHash $oelf.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $mapHash = (Get-FileHash $map.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          foreach ($required in @("mode=gnm-load","title_id=PNEU00004","content_id=IV0000-PNEU00004_00-GCN8LINK00000000","gnm_import_probe=none","gnm_load_probe=sceKernelLoadStartModule_then_sceKernelDlsym_no_gnm_call","gnm_function_calls=none","elf_sha256=$elfHash","oelf_sha256=$oelfHash","map_sha256=$mapHash","hardware_status=not_run")) {
            if ($manifestText -notmatch [regex]::Escape($required)) { throw "GNM-Load manifest mismatch: $required" }
          }
          $oelfStrings = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($oelf.FullName))
          if ($oelfStrings.Contains("libSceGnmDriver.prx") -or $oelfStrings.Contains("yvZ73uQUqrk#C#C")) { throw "GNM-Load OELF unexpectedly has a static GNM import." }
          dotnet "$tool" validate "$($gnmPkg.FullName)" 2>&1 | Tee-Object qa-output/gnm-load-pkg-validation.txt
          if ($LASTEXITCODE -ne 0) { throw "Independent GNM-Load PKG validation failed." }
          $out = Join-Path $env:RUNNER_TEMP "gnm-load-independent-extracted"
          dotnet "$tool" extract "$($gnmPkg.FullName)" "$out" --verbose 2>&1 | Tee-Object qa-output/gnm-load-pkg-extract.txt
          if ($LASTEXITCODE -ne 0) { throw "Independent GNM-Load PKG extraction failed." }
          $sfo = Get-ChildItem $out -Recurse -File -Filter param.sfo | Select-Object -First 1
          if (-not $sfo) { throw "GNM-Load embedded PARAM.SFO missing." }
          $sfoText = (dotnet "$tool" sfo read "$($sfo.FullName)" 2>&1) -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0) { throw "GNM-Load SFO read failed." }
          foreach ($required in @("CATEGORY = gde","APP_VER = 01.00","VERSION = 01.00","TITLE_ID = PNEU00004","CONTENT_ID = IV0000-PNEU00004_00-GCN8LINK00000000")) {
            if ($sfoText -notmatch [regex]::Escape($required)) { throw "GNM-Load SFO missing: $required" }
          }
          $eboot = Get-ChildItem $out -Recurse -File -Filter eboot.bin | Select-Object -First 1
          $shader = Get-ChildItem $out -Recurse -File -Filter compute_smoke_add.sb | Select-Object -First 1
          if (-not $eboot -or $eboot.Length -le 0) { throw "GNM-Load eboot missing." }
          if ($shader) { throw "GNM-Load PKG unexpectedly contains compute shader." }
          New-Item -ItemType Directory -Force -Path qa-output | Out-Null
          "GNM_LOAD_PKG_SHA256=$pkgHash" | Out-File qa-output/gnm-load-qa-report.txt
          "GNM_LOAD_ELF_SHA256=$elfHash" | Out-File qa-output/gnm-load-qa-report.txt -Append
          "GNM_LOAD_OELF_SHA256=$oelfHash" | Out-File qa-output/gnm-load-qa-report.txt -Append
          "GNM_LOAD_MAP_SHA256=$mapHash" | Out-File qa-output/gnm-load-qa-report.txt -Append
          "GNM_LOAD_SFO=PASS; STATIC_GNM_IMPORT=ABSENT; COMPUTE_SHADER=ABSENT" | Out-File qa-output/gnm-load-qa-report.txt -Append
          "GNM_LOAD_QA_STATUS=PASS_PC_ONLY_NOT_HARDWARE_TESTED" | Out-File qa-output/gnm-load-qa-report.txt -Append
          Get-Content qa-output/gnm-load-qa-report.txt | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - name: Upload independent QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Neural-Engine-independent-QA
          path: qa-output/*
          if-no-files-found: warn
          retention-days: 30

  build-patch:
    name: build-associated-patch-against-installed-010
    needs: [build-prx-and-pkg, independent-pkg-qa]
    if: false # NR policy: only Full/Base PKGs unless explicitly requested
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download exact installed release 010 base artifact
        uses: actions/download-artifact@v4
        with:
          name: ps4-neural-engine-build
          path: base-artifact
          repository: ${{ github.repository }}
          run-id: 44851147057
          github-token: ${{ github.token }}
      - name: Download current release 011 artifact
        uses: actions/download-artifact@v4
        with:
          name: ps4-neural-engine-build
          path: update-artifact
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Checkout pinned independent PKG inspector
        uses: actions/checkout@v4
        with:
          repository: pearlxcore/OrbisPkgTool
          ref: 3de6da849b64a8ad0d5ba00dd4e8919934b868b0
          path: OrbisPkgTool-src
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build independent PKG inspector
        shell: pwsh
        run: |
          dotnet build OrbisPkgTool-src/OrbisPkgTool/OrbisPkgTool.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "OrbisPkgTool build failed." }
          $tool = "OrbisPkgTool-src/OrbisPkgTool/bin/Release/net10.0-windows/OrbisPkgTool.dll"
          if (-not (Test-Path $tool)) { throw "OrbisPkgTool DLL missing." }
          "TOOL=$tool" | Out-File "$env:RUNNER_TEMP\patch-tool.txt"
      - name: Download pinned Fake PKG Tools v7
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/CyB1K/PS4-Fake-PKG-Tools-3.87/releases/download/v7/PS4_Fake_PKG_Tools_3.87_V7.rar"
          $archive = Join-Path $env:RUNNER_TEMP "fake-pkg-tools-v7.rar"
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-Item $archive).Length -ne 6674278) { throw "Unexpected Fake PKG Tools archive size." }
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash
          if ($hash -ne "206FF9CD1199AE3943944FE61FB9247EC0B398B079AB125543FB1AD115E76ED7") { throw "Fake PKG Tools archive SHA mismatch." }
          $dest = Join-Path $env:RUNNER_TEMP "fake-pkg-tools"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          & "$env:ProgramFiles\7-Zip\7z.exe" x $archive "-o$dest" -y
          if ($LASTEXITCODE -ne 0) { throw "Fake PKG Tools extraction failed." }
          $cmd = Get-ChildItem $dest -Recurse -File -Filter "orbis-pub-cmd.exe" | Select-Object -First 1
          if (-not $cmd) { throw "orbis-pub-cmd.exe missing." }
          $toolHash = (Get-FileHash $cmd.FullName -Algorithm SHA256).Hash
          if ($toolHash -ne "9D136A27A0739555329E46B61208B7105D4C5AEA5644CBF8052BFED4250D0E1B") { throw "orbis-pub-cmd.exe SHA mismatch." }
          "PUBCMD=$($cmd.FullName)" | Out-File "$env:RUNNER_TEMP\patch-tool.txt" -Append
      - name: Build Sony-associated patch from exact installed base
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tool = "OrbisPkgTool-src/OrbisPkgTool/bin/Release/net10.0-windows/OrbisPkgTool.dll"
          $pubCmd = (Get-Content "$env:RUNNER_TEMP\patch-tool.txt" | Where-Object { $_ -like "PUBCMD=*" } | Select-Object -First 1).Substring(7)
          $basePkg = (Resolve-Path "base-artifact/pkg/PS4-Neural-Engine-010.pkg").Path
          $updatePkg = (Resolve-Path "update-artifact/pkg/PS4-Neural-Engine-011.pkg").Path
          $updatePrx = (Resolve-Path "update-artifact/ps4/ps4_neural_engine.prx").Path
          $updateManifest = (Resolve-Path "update-artifact/pkg/audit/pne-release.ini").Path
          $expectedBase = "015c9e2c266561fda005c15766fe4833412c658d9a8d0b7334fd2cfe3fec8ae2"
          if ((Get-FileHash $basePkg -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedBase) { throw "Base PKG is not the exact installed release 010." }
          foreach ($p in @($updatePkg,$updatePrx,$updateManifest)) { if (-not (Test-Path $p)) { throw "Update payload missing: $p" } }
          $work = Join-Path $env:RUNNER_TEMP "patch-011"
          $extract = Join-Path $work "base-extracted"
          $image = Join-Path $extract "Image0"
          $out = Join-Path $env:GITHUB_WORKSPACE "dist/patch"
          New-Item -ItemType Directory -Force -Path $work,$out | Out-Null
          dotnet "$tool" validate "$basePkg"
          if ($LASTEXITCODE -ne 0) { throw "Exact base PKG validation failed." }
          dotnet "$tool" extract "$basePkg" "$extract" --verbose
          if ($LASTEXITCODE -ne 0) { throw "Base PKG extraction failed." }
          dotnet "$tool" restructure "$extract" --verbose
          if ($LASTEXITCODE -ne 0) { throw "Base PKG restructure failed." }
          $baseSfo = Join-Path $image "sce_sys/param.sfo"
          if (-not (Test-Path $baseSfo)) { throw "Base Image0 PARAM.SFO missing." }
          foreach ($pair in @(@("CATEGORY","gde"),@("APP_VER","01.00"),@("VERSION","01.06"),@("FORMAT","obs"))) {
            dotnet "$tool" sfo set "$baseSfo" $pair[0] $pair[1]
            if ($LASTEXITCODE -ne 0) { throw "Base SFO normalization failed: $($pair[0])" }
          }
          dotnet "$tool" sfo set "$baseSfo" PUBTOOLINFO "c_date=20261120,img0_l0_size=7,img0_l1_size=0,img0_sc_ksize=512,img0_pc_ksize=832,st_type=digital50"
          if ($LASTEXITCODE -ne 0) { throw "Base digital50 PUBTOOLINFO update failed." }
          $baseSfoText = (dotnet "$tool" sfo read "$baseSfo" 2>&1) -join "\`n"
          foreach ($required in @("CATEGORY = gde","APP_VER = 01.00","VERSION = 01.06","FORMAT = obs","st_type=digital50")) {
            if ($baseSfoText -notmatch [regex]::Escape($required)) { throw "Rebuilt base SFO missing $required" }
          }
          $about = Join-Path $image "sce_sys/about"
          if (Test-Path $about) { Remove-Item $about -Recurse -Force }
          foreach ($f in @("sce_sys/license.dat","sce_sys/license.info","sce_sys/psreserved.dat","sce_sys/playgo-chunk.dat","sce_sys/playgo-chunk.sha","sce_sys/playgo-manifest.xml")) {
            $p = Join-Path $image $f
            if (Test-Path $p) { Remove-Item $p -Force }
          }
          $zero = "00000000000000000000000000000000"
          $baseGp4 = Join-Path $work "PS4-Neural-Engine-Installed-Base.gp4"
          $baseRebuilt = Join-Path $work "PS4-Neural-Engine-Installed-Base.pkg"
          & $pubCmd gp4_proj_create --volume_type pkg_ps4_app --content_id IV0000-PNEU00001_00-PS4NEURALENG0000 --passcode $zero --entitlement_key $zero --storage_type digital50 $baseGp4
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $baseGp4)) { throw "Sony association base GP4 creation failed." }
          $baseFiles = @(Get-ChildItem $image -Recurse -File | Sort-Object FullName)
          if ($baseFiles.Count -lt 4) { throw "Rebuilt base payload incomplete." }
          foreach ($file in $baseFiles) {
            $target = $file.FullName.Substring($image.TrimEnd('\').Length + 1).Replace('\','/')
            & $pubCmd gp4_file_add --force --pfs_compression enable $file.FullName $target $baseGp4
            if ($LASTEXITCODE -ne 0) { throw "Adding base file failed: $target" }
          }
          & $pubCmd img_create --no_progress_bar $baseGp4 $baseRebuilt
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $baseRebuilt)) { throw "Sony association base PKG build failed." }
          dotnet "$tool" validate "$baseRebuilt"
          if ($LASTEXITCODE -ne 0) { throw "Rebuilt association base validation failed." }
          Copy-Item $baseRebuilt "$out/PS4-Neural-Engine-Installed-Base.pkg"
          Copy-Item $basePkg "$out/PS4-Neural-Engine-Installed-Original.pkg"
          $baseRebuiltHash = (Get-FileHash $baseRebuilt -Algorithm SHA256).Hash.ToLowerInvariant()
          $baseHash = (Get-FileHash $basePkg -Algorithm SHA256).Hash.ToLowerInvariant()
          $eboot = Join-Path $image "eboot.bin"
          if (-not (Test-Path $eboot)) { throw "Base eboot missing." }
          $newEboot = Join-Path (Split-Path $updatePkg -Parent) "eboot.bin"
          $updateExtract = Join-Path $work "update-extracted"
          dotnet "$tool" extract "$updatePkg" "$updateExtract" --verbose
          if ($LASTEXITCODE -ne 0) { throw "Update PKG extraction failed." }
          $newEbootFound = Get-ChildItem $updateExtract -Recurse -File -Filter eboot.bin | Select-Object -First 1
          if (-not $newEbootFound) { throw "Release 011 eboot missing." }
          $newEboot = $newEbootFound.FullName
          $patchSfo = Join-Path $work "patch-param.sfo"
          Copy-Item $baseSfo $patchSfo
          foreach ($pair in @(@("CATEGORY","gpe"),@("APP_VER","01.07"),@("VERSION","01.07"),@("ATTRIBUTE","8388610"))) {
            dotnet "$tool" sfo set "$patchSfo" $pair[0] $pair[1]
            if ($LASTEXITCODE -ne 0) { throw "Patch SFO update failed: $($pair[0])" }
          }
          dotnet "$tool" sfo set "$patchSfo" PUBTOOLINFO "c_date=20261120,img0_l0_size=7,img0_l1_size=0,img0_sc_ksize=512,img0_pc_ksize=832,st_type=digital25"
          if ($LASTEXITCODE -ne 0) { throw "Patch digital25 PUBTOOLINFO update failed." }
          $patchSfoText = (dotnet "$tool" sfo read "$patchSfo" 2>&1) -join "\`n"
          foreach ($required in @("CATEGORY = gpe","APP_VER = 01.07","VERSION = 01.07","FORMAT = obs","st_type=digital25")) {
            if ($patchSfoText -notmatch [regex]::Escape($required)) { throw "Patch SFO missing $required" }
          }
          $changeDir = Join-Path $work "changeinfo"
          New-Item -ItemType Directory -Force -Path $changeDir | Out-Null
          $changeInfo = Join-Path $changeDir "changeinfo.xml"
          $changeXml = '<?xml version="1.0" encoding="UTF-8"?>' + "\`n" + '<changeinfo><changes app_ver="01.07"><![CDATA[Neural Rendering update 01.07]]></changes></changeinfo>'
          [IO.File]::WriteAllText($changeInfo,$changeXml,[Text.UTF8Encoding]::new($false))
          $patchGp4 = Join-Path $work "PS4-Neural-Engine-011-PATCH.gp4"
          $patchPkg = Join-Path $out "PS4-Neural-Engine-011-PATCH.pkg"
          & $pubCmd gp4_proj_create --volume_type pkg_ps4_patch --content_id IV0000-PNEU00001_00-PS4NEURALENG0000 --passcode $zero --entitlement_key $zero --storage_type digital25 --app_path $baseRebuilt $patchGp4
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $patchGp4)) { throw "Associated patch GP4 creation failed." }
          foreach ($item in @(@($newEboot,"eboot.bin"),@($updatePrx,"ps4_neural_engine.prx"),@($updateManifest,"pne-release.ini"),@($patchSfo,"sce_sys/param.sfo"),@($changeInfo,"sce_sys/changeinfo/changeinfo.xml"))) {
            & $pubCmd gp4_file_add --force --pfs_compression enable $item[0] $item[1] $patchGp4
            if ($LASTEXITCODE -ne 0) { throw "Adding patch payload failed: $($item[1])" }
          }
          [xml]$gp4Xml = Get-Content $patchGp4
          if ($gp4Xml.psproject.volume.volume_type -ne "pkg_ps4_patch") { throw "Patch GP4 volume_type invalid." }
          if ([IO.Path]::GetFileName($gp4Xml.psproject.volume.package.app_path) -ne "PS4-Neural-Engine-Installed-Base.pkg") { throw "Patch GP4 app_path does not associate the rebuilt base." }
          if ($gp4Xml.psproject.files.file.Count -lt 4) { throw "Patch GP4 payload incomplete." }
          & $pubCmd img_create --no_progress_bar $patchGp4 $patchPkg
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $patchPkg)) { throw "Patch PKG build failed." }
          dotnet "$tool" validate "$patchPkg"
          if ($LASTEXITCODE -ne 0) { throw "Independent patch PKG validation failed." }
          dotnet "$tool" extract "$patchPkg" (Join-Path $work "patch-verify") --verbose
          if ($LASTEXITCODE -ne 0) { throw "Patch PKG extraction failed." }
          $verifySfo = Get-ChildItem (Join-Path $work "patch-verify") -Recurse -File -Filter param.sfo | Select-Object -First 1
          if (-not $verifySfo) { throw "Patch PARAM.SFO missing." }
          $verifyText = (dotnet "$tool" sfo read "$($verifySfo.FullName)" 2>&1) -join "\`n"
          foreach ($required in @("CATEGORY = gpe","APP_VER = 01.07","VERSION = 01.07","st_type=digital25")) {
            if ($verifyText -notmatch [regex]::Escape($required)) { throw "Built patch PARAM.SFO mismatch: $required" }
          }
          $prxHash = (Get-FileHash $updatePrx -Algorithm SHA256).Hash.ToLowerInvariant()
          $ebootHash = (Get-FileHash $newEboot -Algorithm SHA256).Hash.ToLowerInvariant()
          $patchHash = (Get-FileHash $patchPkg -Algorithm SHA256).Hash.ToLowerInvariant()
          $report = @(
            "PATCH_KIND=PACKAGE_MANAGER_PATCH"
            "PATCH_BASE_VERSION=01.06"
            "PATCH_APP_VERSION=01.07"
            "PATCH_ORIGINAL_BASE_SHA256=$baseHash"
            "PATCH_ASSOCIATION_BASE_SHA256=$baseRebuiltHash"
            "PATCH_PRX_SHA256=$prxHash"
            "PATCH_EBOOT_SHA256=$ebootHash"
            "PATCH_BYTES=$((Get-Item $patchPkg).Length)"
            "PATCH_SHA256=$patchHash"
            "PATCH_QA_STATUS=BUILT_STRUCTURALLY_VALIDATED_PC_ONLY_NOT_HARDWARE_TESTED"
          )
          $report | Out-File "$out/BUILD_REPORT.txt"
          New-Item -ItemType Directory -Force -Path "$out/audit" | Out-Null
          Copy-Item $patchGp4 "$out/audit/PS4-Neural-Engine-011-PATCH.gp4"
          Copy-Item $baseGp4 "$out/audit/PS4-Neural-Engine-Installed-Base.gp4"
      - name: Upload patch candidate and audit inputs
        uses: actions/upload-artifact@v4
        with:
          name: ps4-neural-engine-patch-candidate
          path: dist/patch/**
          if-no-files-found: error

  independent-patch-qa:
    name: independent-patch-qa
    needs: build-patch
    if: false # NR policy: patch QA is disabled with patch generation
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout pinned independent PKG inspector
        uses: actions/checkout@v4
        with:
          repository: pearlxcore/OrbisPkgTool
          ref: 3de6da849b64a8ad0d5ba00dd4e8919934b868b0
          path: OrbisPkgTool-src
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download patch candidate
        uses: actions/download-artifact@v4
        with:
          name: ps4-neural-engine-patch-candidate
          path: patch-artifact
      - name: Download installed base 010
        uses: actions/download-artifact@v4
        with:
          name: ps4-neural-engine-build
          path: base-artifact
          repository: ${{ github.repository }}
          run-id: 44851147057
          github-token: ${{ github.token }}
      - name: Download current update artifact
        uses: actions/download-artifact@v4
        with:
          name: ps4-neural-engine-build
          path: update-artifact
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Build independent inspector
        shell: pwsh
        run: |
          dotnet build OrbisPkgTool-src/OrbisPkgTool/OrbisPkgTool.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Independent inspector build failed." }
      - name: Verify patch type, base identity, SFO and payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tool = "OrbisPkgTool-src/OrbisPkgTool/bin/Release/net10.0-windows/OrbisPkgTool.dll"
          $pkg = (Resolve-Path "patch-artifact/PS4-Neural-Engine-011-PATCH.pkg").Path
          $gp4Path = "patch-artifact/audit/PS4-Neural-Engine-011-PATCH.gp4"
          [xml]$gp4 = Get-Content $gp4Path
          if ($gp4.psproject.volume.volume_type -ne "pkg_ps4_patch") { throw "GP4 is not a patch volume." }
          if ($gp4.psproject.volume.package.storage_type -ne "digital25") { throw "GP4 storage type is not digital25." }
          if ($gp4.psproject.volume.package.content_id -ne "IV0000-PNEU00001_00-PS4NEURALENG0000") { throw "GP4 CONTENT_ID mismatch." }
          if ([IO.Path]::GetFileName($gp4.psproject.volume.package.app_path) -ne "PS4-Neural-Engine-Installed-Base.pkg") { throw "Patch GP4 does not associate the rebuilt base PKG." }
          if ($gp4.psproject.files.file.Count -lt 5) { throw "Patch GP4 payload incomplete." }
          $associationBase = "patch-artifact/PS4-Neural-Engine-Installed-Base.pkg"
          if (-not (Test-Path $associationBase)) { throw "Sony-associated base package missing." }
          $buildReport = Get-Content "patch-artifact/BUILD_REPORT.txt" -Raw
          $reportedAssociationHash = [regex]::Match($buildReport,"PATCH_ASSOCIATION_BASE_SHA256=([A-Fa-f0-9]{64})").Groups[1].Value.ToLowerInvariant()
          $actualAssociationHash = (Get-FileHash $associationBase -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $reportedAssociationHash -or $actualAssociationHash -ne $reportedAssociationHash) { throw "Sony-associated base digest does not match build report." }
          dotnet "$tool" validate $associationBase
          if ($LASTEXITCODE -ne 0) { throw "Associated base package validation failed." }
          $associationInfo = (dotnet "$tool" info $associationBase 2>&1) -join "`n"
          Write-Host "Associated base package parsed; version is verified from its extracted PARAM.SFO below."
          $associationExtract = Join-Path $env:RUNNER_TEMP "associated-base-extracted"
          dotnet "$tool" extract $associationBase $associationExtract
          if ($LASTEXITCODE -ne 0) { throw "Associated base extraction failed." }
          $associationSfo = Get-ChildItem $associationExtract -Recurse -File -Filter param.sfo | Select-Object -First 1
          if (-not $associationSfo) { throw "Associated base PARAM.SFO missing." }
          $associationSfoText = (dotnet "$tool" sfo read "$($associationSfo.FullName)" 2>&1) -join "`n"
          foreach ($required in @("CATEGORY = gde","APP_VER = 01.00","VERSION = 01.06","st_type=digital50")) {
            if ($associationSfoText -notmatch [regex]::Escape($required)) { throw "Associated base SFO missing $required" }
          }
          dotnet "$tool" validate "$pkg"
          if ($LASTEXITCODE -ne 0) { throw "Independent patch PKG validation failed." }
          $info = (dotnet "$tool" info "$pkg" 2>&1) -join "\`n"
          $info | Out-File "patch-artifact/audit/patch-info.txt"
          if ($info -notmatch 'PNEU00001' -or $info -notmatch '01.07') { throw "Independent parser identity/version mismatch: $info" }
          $out = Join-Path $env:RUNNER_TEMP "patch-extracted"
          dotnet "$tool" extract "$pkg" "$out"
          if ($LASTEXITCODE -ne 0) { throw "Patch extraction failed." }
          $sfo = Get-ChildItem $out -Recurse -File -Filter param.sfo | Select-Object -First 1
          if (-not $sfo) { throw "Patch PARAM.SFO missing." }
          $sfoText = (dotnet "$tool" sfo read "$($sfo.FullName)" 2>&1) -join "\`n"
          $sfoText | Out-File "patch-artifact/audit/embedded-param-sfo.txt"
          foreach ($required in @("CATEGORY = gpe","APP_VER = 01.07","VERSION = 01.07","TITLE_ID = PNEU00001","CONTENT_ID = IV0000-PNEU00001_00-PS4NEURALENG0000","st_type=digital25")) {
            if ($sfoText -notmatch [regex]::Escape($required)) { throw "Patch SFO missing: $required" }
          }
          $basePkg = "base-artifact/pkg/PS4-Neural-Engine-010.pkg"
          $baseHash = (Get-FileHash $basePkg -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($baseHash -ne "015c9e2c266561fda005c15766fe4833412c658d9a8d0b7334fd2cfe3fec8ae2") { throw "Base package is not the exact installed release 010." }
          $baseInfo = (dotnet "$tool" info $basePkg 2>&1) -join "`n"
          Write-Host "Original base package identity is verified by SHA-256 and audited PARAM.SFO."
          $baseSfo = (dotnet "$tool" sfo read "base-artifact/pkg/audit/param.sfo" 2>&1) -join "\`n"
          if ($baseSfo -notmatch 'CATEGORY = gde' -or $baseSfo -notmatch 'APP_VER = 01.06') { throw "Base SFO mismatch." }
          $eboot = Get-ChildItem $out -Recurse -File | Where-Object Name -eq "eboot.bin" | Select-Object -First 1
          $prx = Get-ChildItem $out -Recurse -File | Where-Object Name -eq "ps4_neural_engine.prx" | Select-Object -First 1
          $manifest = Get-ChildItem $out -Recurse -File | Where-Object Name -eq "pne-release.ini" | Select-Object -First 1
          if (-not $eboot -or -not $prx -or -not $manifest) { throw "Patch payload incomplete." }
          $updateExtract = Join-Path $env:RUNNER_TEMP "update-011-extracted"
          dotnet "$tool" extract "update-artifact/pkg/PS4-Neural-Engine-011.pkg" $updateExtract
          if ($LASTEXITCODE -ne 0) { throw "Release 011 source PKG extraction failed." }
          $sourceEboot = Get-ChildItem $updateExtract -Recurse -File -Filter eboot.bin | Select-Object -First 1
          if (-not $sourceEboot) { throw "Release 011 source eboot missing." }
          if ((Get-FileHash $sourceEboot.FullName -Algorithm SHA256).Hash -ne (Get-FileHash $eboot.FullName -Algorithm SHA256).Hash) { throw "Patch eboot does not match release 011." }
          $expectedPrx = (Get-FileHash "update-artifact/ps4/ps4_neural_engine.prx" -Algorithm SHA256).Hash
          $actualPrx = (Get-FileHash $prx.FullName -Algorithm SHA256).Hash
          if ($actualPrx -ne $expectedPrx) { throw "Patch PRX digest mismatch." }
          $manifestText = Get-Content $manifest.FullName -Raw
          if ($manifestText -notmatch 'release_number=011' -or $manifestText -notmatch 'app_version=01.07' -or $manifestText -notmatch "prx_sha256=$($expectedPrx.ToLowerInvariant())") { throw "Patch release manifest does not match release 011 payload." }
          $patchHash = (Get-FileHash $pkg -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "PATCH_KIND=PACKAGE_MANAGER_PATCH"
            "PATCH_BASE_VERSION=01.06"
            "PATCH_APP_VERSION=01.07"
            "PATCH_BASE_SHA256=$baseHash"
            "PATCH_ASSOCIATION_BASE_SHA256=$((Get-FileHash $associationBase -Algorithm SHA256).Hash.ToLowerInvariant())"
            "PATCH_BYTES=$((Get-Item $pkg).Length)"
            "PATCH_SHA256=$patchHash"
            "PATCH_PRX_SHA256=$actualPrx"
            "PATCH_QA_STATUS=PASS_PC_ONLY_NOT_HARDWARE_TESTED"
          ) | Out-File "patch-artifact/audit/QA_STATUS.txt"
      - name: Upload independent patch QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Neural-Engine-independent-patch-QA
          path: patch-artifact/audit/*
          if-no-files-found: warn
          retention-days: 30
