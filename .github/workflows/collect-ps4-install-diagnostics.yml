name: Collect PS4 Neural Rendering install diagnostics

on:
  push:
    branches: [main]
    paths: [".github/workflows/collect-ps4-install-diagnostics.yml"]

permissions:
  contents: read

jobs:
  collect:
    runs-on: [self-hosted, Windows, X64, ps4-lan]
    steps:
      - name: Read PS4 logs and package directory without modifying console
        shell: powershell
        env:
          PS4_IP: ${{ vars.PS4_IP }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:PS4_IP) { throw "PS4_IP is missing." }
          $root = Join-Path $env:RUNNER_TEMP "pne-install-diagnostics"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $credentials = New-Object System.Net.NetworkCredential("anonymous", "anonymous@example.com")

          function New-Request([string]$path, [string]$method) {
            $r = [System.Net.FtpWebRequest]::Create("ftp://$($env:PS4_IP):2121$path")
            $r.Method = $method
            $r.Credentials = $credentials
            $r.UsePassive = $true
            $r.UseBinary = $true
            $r.KeepAlive = $false
            $r.Timeout = 60000
            $r.ReadWriteTimeout = 60000
            return $r
          }

          function Get-Listing([string]$path) {
            $r = New-Request $path ([System.Net.WebRequestMethods+Ftp]::ListDirectory)
            $response = $r.GetResponse()
            try {
              $reader = New-Object System.IO.StreamReader($response.GetResponseStream())
              try {
                $items = @()
                while (-not $reader.EndOfStream) {
                  $line = $reader.ReadLine()
                  if ($line) { $items += $line.Trim() }
                }
                return $items
              } finally { $reader.Dispose() }
            } finally { $response.Dispose() }
          }

          function Save-RemoteFile([string]$remote, [string]$local) {
            $r = New-Request $remote ([System.Net.WebRequestMethods+Ftp]::DownloadFile)
            $response = $r.GetResponse()
            try {
              $inputStream = $response.GetResponseStream()
              $output = [System.IO.File]::Create($local)
              try { $inputStream.CopyTo($output) } finally { $output.Dispose(); $inputStream.Dispose() }
            } finally { $response.Dispose() }
            $item = Get-Item -LiteralPath $local
            Write-Host "DOWNLOADED=$remote SIZE=$($item.Length) SHA256=$((Get-FileHash $local -Algorithm SHA256).Hash.ToLowerInvariant())"
          }

          $listingLog = Join-Path $root "remote-directory-listings.txt"
          foreach ($dir in @("/data/pkg/","/data/pkg/old/","/data/GoldHEN/","/data/GoldHEN/plugins/","/data/sce_logs/","/data/sce_coredumps/")) {
            Add-Content -LiteralPath $listingLog -Value "===== $dir ====="
            try {
              $items = @(Get-Listing $dir)
              $items | ForEach-Object { Add-Content -LiteralPath $listingLog -Value $_; Write-Host "REMOTE[$dir] $_" }
            } catch {
              Add-Content -LiteralPath $listingLog -Value "LIST_ERROR=$($_.Exception.Message)"
              Write-Host "LIST_ERROR[$dir]=$($_.Exception.Message)"
            }
          }

          $candidates = @(
            "/data/GoldHEN/ps4_neural_engine_install.log",
            "/data/GoldHEN/plugins.ini",
            "/data/sce_logs/log.bin",
            "/data/sce_logs/console.log",
            "/data/sce_logs/system.log"
          )
          foreach ($remote in $candidates) {
            $name = ($remote -replace '^/','' -replace '[\\/]','_')
            try { Save-RemoteFile $remote (Join-Path $root $name) }
            catch { Write-Host "FILE_UNAVAILABLE=$remote ERROR=$($_.Exception.Message)" }
          }

          foreach ($dir in @("/data/sce_logs/","/data/sce_coredumps/","/data/GoldHEN/")) {
            try {
              foreach ($name in @(Get-Listing $dir)) {
                if ($name -match '(^|\\.)(log|dmp|core|txt|bin)$|crash|dump|pne|neural|installer' -or $dir -eq "/data/sce_coredumps/") {
                  if ($name -match '[/\\]' -or [string]::IsNullOrWhiteSpace($name)) { continue }
                  $remote = $dir + $name
                  $safe = (($dir.Trim('/') + '_' + $name) -replace '[\\/]','_')
                  $local = Join-Path $root $safe
                  if (-not (Test-Path -LiteralPath $local)) {
                    try { Save-RemoteFile $remote $local } catch { Write-Host "FILE_UNAVAILABLE=$remote ERROR=$($_.Exception.Message)" }
                  }
                }
              }
            } catch { Write-Host "ENUMERATION_ERROR=$dir $($_.Exception.Message)" }
          }

          $manifest = Get-ChildItem -LiteralPath $root -File | ForEach-Object {
            "$($_.Name)|$($_.Length)|$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
          }
          $manifest | Set-Content -LiteralPath (Join-Path $root "SHA256SUMS.txt")
          Write-Host "DIAGNOSTIC_FILES=$((Get-ChildItem -LiteralPath $root -File).Count)"
      - name: Upload collected read-only diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ps4-neural-rendering-install-diagnostics
          path: ${{ runner.temp }}/pne-install-diagnostics/
          if-no-files-found: error
          retention-days: 14
