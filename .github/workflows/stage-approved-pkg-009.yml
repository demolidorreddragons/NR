name: Stage approved Neural Rendering PKG 009 on PS4

on:
  push:
    branches: [feature/gcn8-numeric-kernels]
    paths:
      - ".github/workflows/stage-approved-pkg-009.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: stage-approved-neural-rendering-pkg-009
  cancel-in-progress: false

jobs:
  archive-and-stage:
    runs-on: [self-hosted, Windows, X64, ps4-lan]
    steps:
      - name: Download exact independently audited build artifact
        uses: actions/download-artifact@v4
        with:
          name: ps4-neural-engine-build
          path: transfer
          repository: demolidorreddragons/NR
          run-id: 44849066524
          github-token: ${{ github.token }}


      - name: Download independent QA evidence for the exact build run
        uses: actions/download-artifact@v4
        with:
          name: PS4-Neural-Engine-009-independent-QA
          path: qa
          repository: demolidorreddragons/NR
          run-id: 44849066524
          github-token: ${{ github.token }}

      - name: Verify independent QA evidence before any PS4 changes
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          EXPECTED_SHA256: 242e032dc19ae9fc22cdd0b977241bd9ef8edf93bc5eb31777063575430699ba
        run: |
          $ErrorActionPreference = "Stop"
          $reportPath = Join-Path $env:GITHUB_WORKSPACE "qa/qa-report.txt"
          $sfoPath = Join-Path $env:GITHUB_WORKSPACE "qa/embedded-param-sfo.txt"
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw "Independent QA report missing." }
          if (-not (Test-Path -LiteralPath $sfoPath -PathType Leaf)) { throw "Embedded PARAM.SFO QA evidence missing." }
          $report = Get-Content -LiteralPath $reportPath -Raw
          foreach ($required in @("PKG_KIND=FULL_BASE_APPLICATION_NOT_PATCH","PKG_SHA256=$($env:EXPECTED_SHA256)","PARAM_SFO_SEMANTIC_FIELDS=PASS","QA_STATUS=PASS_PC_ONLY_NOT_HARDWARE_TESTED")) {
            if ($report -notmatch [regex]::Escape($required)) { throw "Independent QA evidence missing or mismatched: $required" }
          }
          $sfo = Get-Content -LiteralPath $sfoPath -Raw
          foreach ($required in @("CATEGORY = gde","APP_VER = 01.05","VERSION = 01.05","TITLE_ID = PNEU00001","CONTENT_ID = IV0000-PNEU00001_00-PS4NEURALENG0000","st_type=digital50")) {
            if ($sfo -notmatch [regex]::Escape($required)) { throw "Independent embedded SFO evidence mismatch: $required" }
          }
          Write-Host "INDEPENDENT_QA_EVIDENCE_VERIFIED=TRUE"
          "INDEPENDENT_QA=PASS_PC_ONLY_NOT_HARDWARE_TESTED" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Verify exact approved release artifact
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          EXPECTED_SHA256: 242e032dc19ae9fc22cdd0b977241bd9ef8edf93bc5eb31777063575430699ba
          EXPECTED_COMMIT: 930487a0ec0a378da3713adb3d4d667a084d9fde
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = Join-Path $env:GITHUB_WORKSPACE "transfer/pkg/PS4-Neural-Engine-009.pkg"
          if (-not (Test-Path -LiteralPath $pkg -PathType Leaf)) { throw "Approved PKG is missing from the exact build artifact." }
          $hash = (Get-FileHash -LiteralPath $pkg -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $pkg).Length
          if ($hash -ne $env:EXPECTED_SHA256) { throw "PKG SHA-256 mismatch: $hash" }
          if ($size -le 0) { throw "PKG is empty." }
          "SOURCE_RUN_ID=44849066524" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "SOURCE_COMMIT=$env:EXPECTED_COMMIT" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "PKG_FILE=PS4-Neural-Engine-009.pkg" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "PKG_BYTES=$size" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "PKG_SHA256=$hash" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          Write-Host "APPROVED_ARTIFACT_VERIFIED"

      - name: Archive older Neural Rendering packages and stage release 009
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          PS4_IP: ${{ vars.PS4_IP }}
          EXPECTED_SHA256: 242e032dc19ae9fc22cdd0b977241bd9ef8edf93bc5eb31777063575430699ba
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:PS4_IP) { throw "PS4_IP Actions variable is missing." }
          $credentials = New-Object System.Net.NetworkCredential("anonymous", "anonymous@example.com")
          $base = "ftp://$($env:PS4_IP):2121"

          function New-FtpRequest([string]$path, [string]$method) {
            $request = [System.Net.FtpWebRequest]::Create("$base$path")
            $request.Method = $method
            $request.Credentials = $credentials
            $request.UsePassive = $true
            $request.UseBinary = $true
            $request.KeepAlive = $false
            $request.Timeout = 120000
            $request.ReadWriteTimeout = 120000
            return $request
          }
          function Get-FtpNames([string]$path) {
            $variants = @($path)
            if ($path.EndsWith("/")) { $variants += $path.TrimEnd("/") }
            else { $variants += "$path/" }
            $lastError = $null
            foreach ($candidate in $variants) {
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                $response = $null
                $reader = $null
                try {
                  $request = New-FtpRequest $candidate ([System.Net.WebRequestMethods+Ftp]::ListDirectory)
                  $request.Timeout = 30000
                  $request.ReadWriteTimeout = 30000
                  $response = $request.GetResponse()
                  $reader = New-Object System.IO.StreamReader($response.GetResponseStream())
                  $items = @()
                  while (-not $reader.EndOfStream) {
                    $line = $reader.ReadLine()
                    if ($line) { foreach ($token in ($line.Trim() -split '\s+')) { if ($token) { $items += $token } } }
                  }
                  Write-Host "FTP_LIST_OK path=$candidate entries=$($items.Count)"
                  return $items
                } catch {
                  $lastError = $_
                  Write-Host "FTP_LIST_RETRY path=$candidate attempt=$attempt error=$($_.Exception.Message)"
                  Start-Sleep -Milliseconds 700
                } finally {
                  if ($reader) { $reader.Dispose() }
                  if ($response) { $response.Dispose() }
                }
              }
            }
            throw "Unable to list FTP directory $path after retries: $($lastError.Exception.Message)"
          }
          function Get-RemoteHash([string]$path, [string]$localPath) {
            $request = New-FtpRequest $path ([System.Net.WebRequestMethods+Ftp]::DownloadFile)
            $response = $request.GetResponse()
            try {
              $stream = $response.GetResponseStream()
              try {
                $output = [System.IO.File]::Create($localPath)
                try { $stream.CopyTo($output) } finally { $output.Dispose() }
              } finally { $stream.Dispose() }
            } finally { $response.Dispose() }
            return (Get-FileHash -LiteralPath $localPath -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          function Move-VerifiedRemoteFile([string]$sourcePath, [string]$targetDirectory, [string]$sourceName) {
            $temp = Join-Path $env:RUNNER_TEMP ("ps4-archive-" + [guid]::NewGuid().ToString("N") + ".pkg")
            try {
              Write-Host "ARCHIVE_SOURCE_CHECK path=$sourcePath"
              $beforeHash = Get-RemoteHash $sourcePath $temp
              $beforeSize = (Get-Item -LiteralPath $temp).Length
              $targetName = $sourceName
              $targetPath = "$targetDirectory/$targetName"
              $existingNames = @(Get-FtpNames "$targetDirectory/")
              if ($existingNames -contains $targetName) {
                $stem = [System.IO.Path]::GetFileNameWithoutExtension($sourceName)
                $ext = [System.IO.Path]::GetExtension($sourceName)
                $stamp = (Get-Date).ToUniversalTime().ToString("yyyyMMddTHHmmssZ")
                $n = 1
                do {
                  $targetName = "$stem.archive-$stamp-$n$ext"
                  $targetPath = "$targetDirectory/$targetName"
                  $n++
                } while ($existingNames -contains $targetName)
              }
              $request = New-FtpRequest $sourcePath ([System.Net.WebRequestMethods+Ftp]::Rename)
              $request.RenameTo = $targetPath
              $response = $request.GetResponse()
              try { Write-Host "ARCHIVE_MOVE: $sourcePath -> $targetPath; $($response.StatusDescription.Trim())" }
              finally { $response.Dispose() }

              $afterHash = Get-RemoteHash $targetPath $temp
              $afterSize = (Get-Item -LiteralPath $temp).Length
              if ($afterHash -ne $beforeHash -or $afterSize -ne $beforeSize) {
                throw "Archive read-back mismatch for $targetPath"
              }
              Write-Host "ARCHIVE_VERIFIED: $targetPath; bytes=$afterSize; sha256=$afterHash"
            } finally {
              Remove-Item -LiteralPath $temp -Force -ErrorAction SilentlyContinue
            }
          }

          # Confirm the live destination and create the requested archive directory.
          $rootNames = @(Get-FtpNames "/data/pkg/")
          if (-not $rootNames) { Write-Host "PS4_PKG_ROOT_LISTED_EMPTY" }
          $oldNames = @()
          if ($rootNames -notcontains "old") {
            try {
              $request = New-FtpRequest "/data/pkg/old/" ([System.Net.WebRequestMethods+Ftp]::MakeDirectory)
              $response = $request.GetResponse(); $response.Dispose()
              Write-Host "CREATED_DIRECTORY=/data/pkg/old/"
            } catch {
              $oldNames = @(Get-FtpNames "/data/pkg/old/")
              Write-Host "ARCHIVE_DIRECTORY_ALREADY_EXISTS=/data/pkg/old/"
            }
          } else {
            $oldNames = @(Get-FtpNames "/data/pkg/old/")
          }
          if (-not $oldNames) { $oldNames = @(Get-FtpNames "/data/pkg/old/") }

          # Move only Neural Rendering PKGs; third-party packages are never selected.
          $rootNames = @(Get-FtpNames "/data/pkg/")
          foreach ($entry in $rootNames) { Write-Host "PKG_ROOT_ENTRY=[$entry]" }
          $archiveCandidates = @($rootNames | Where-Object {
            ($_ -match '^PS4-Neural-(Engine|Rendering)-.*\.pkg$' -or $_ -match '^IV0000-NRE.*\.pkg$') -and $_ -ne "PS4-Neural-Engine-009.pkg"
          })
          foreach ($candidate in $archiveCandidates) { Write-Host "ARCHIVE_CANDIDATE=[$candidate]" }
          foreach ($name in $archiveCandidates) {
            Move-VerifiedRemoteFile "/data/pkg/$name" "/data/pkg/old" $name
          }

          # If an old_versions folder exists, consolidate only Neural Rendering PKGs into old/.
          try {
            $legacyNames = @(Get-FtpNames "/data/pkg/old_versions/")
            foreach ($name in @($legacyNames | Where-Object { $_ -match '^PS4-Neural-(Engine|Rendering)-.*\.pkg$' -or $_ -match '^IV0000-NRE.*\.pkg$' })) {
              Move-VerifiedRemoteFile "/data/pkg/old_versions/$name" "/data/pkg/old" $name
            }
          } catch {
            Write-Host "NO_READABLE_OLD_VERSIONS_DIRECTORY: $($_.Exception.Message)"
          }

          # A conflicting release-009 file is archived, never overwritten.
          $rootNames = @(Get-FtpNames "/data/pkg/")
          $alreadyStaged = $false
          if ($rootNames -contains "PS4-Neural-Engine-009.pkg") {
            $check = Join-Path $env:RUNNER_TEMP "ps4-existing-009.pkg"
            try {
              $existingHash = Get-RemoteHash "/data/pkg/PS4-Neural-Engine-009.pkg" $check
              if ($existingHash -ne $env:EXPECTED_SHA256) {
                Move-VerifiedRemoteFile "/data/pkg/PS4-Neural-Engine-009.pkg" "/data/pkg/old" "PS4-Neural-Engine-009.pkg"
              } else {
                $alreadyStaged = $true
                Write-Host "APPROVED_009_ALREADY_PRESENT_WITH_MATCHING_HASH"
              }
            } finally { Remove-Item -LiteralPath $check -Force -ErrorAction SilentlyContinue }
          }

          # Upload to a unique temporary name, read it back, then rename to the canonical filename.
          $pkg = Join-Path $env:GITHUB_WORKSPACE "transfer/pkg/PS4-Neural-Engine-009.pkg"
          $localSize = (Get-Item -LiteralPath $pkg).Length
          $tempRemote = "/data/pkg/PS4-Neural-Engine-009.$([guid]::NewGuid().ToString('N')).uploading"
          $finalRemote = "/data/pkg/PS4-Neural-Engine-009.pkg"
          if (-not $alreadyStaged) {
            $tempRequest = New-FtpRequest $tempRemote ([System.Net.WebRequestMethods+Ftp]::UploadFile)
            $tempRequest.ContentLength = $localSize
            $requestStream = $tempRequest.GetRequestStream()
            try {
              $input = [System.IO.File]::OpenRead($pkg)
              try { $input.CopyTo($requestStream) } finally { $input.Dispose() }
            } finally { $requestStream.Dispose() }
            $uploadResponse = $tempRequest.GetResponse()
            $uploadResponse.Dispose()

            $verify = Join-Path $env:RUNNER_TEMP "ps4-uploaded-009.pkg"
            try {
              $remoteHash = Get-RemoteHash $tempRemote $verify
              $remoteSize = (Get-Item -LiteralPath $verify).Length
              if ($remoteHash -ne $env:EXPECTED_SHA256 -or $remoteSize -ne $localSize) {
                throw "Uploaded temporary PKG failed read-back integrity verification."
              }
              Write-Host "TEMP_UPLOAD_VERIFIED: bytes=$remoteSize; sha256=$remoteHash"
            } finally { Remove-Item -LiteralPath $verify -Force -ErrorAction SilentlyContinue }

            $rename = New-FtpRequest $tempRemote ([System.Net.WebRequestMethods+Ftp]::Rename)
            $rename.RenameTo = $finalRemote
            $renameResponse = $rename.GetResponse()
            $renameResponse.Dispose()
          }
          $verifyFinal = Join-Path $env:RUNNER_TEMP "ps4-final-009.pkg"
          try {
            $finalHash = Get-RemoteHash $finalRemote $verifyFinal
            $finalSize = (Get-Item -LiteralPath $verifyFinal).Length
            if ($finalHash -ne $env:EXPECTED_SHA256 -or $finalSize -ne $localSize) {
              throw "Final /data/pkg/PS4-Neural-Engine-009.pkg failed read-back integrity verification."
            }
            Write-Host "FINAL_PKG_VERIFIED: path=$finalRemote; bytes=$finalSize; sha256=$finalHash"
          } finally { Remove-Item -LiteralPath $verifyFinal -Force -ErrorAction SilentlyContinue }

          $finalRoot = @(Get-FtpNames "/data/pkg/")
          $nrRoot = @($finalRoot | Where-Object { $_ -match '^PS4-Neural-(Engine|Rendering)-.*\.pkg$' -or $_ -match '^IV0000-NRE.*\.pkg$' })
          if ($nrRoot.Count -ne 1 -or $nrRoot[0] -ne "PS4-Neural-Engine-009.pkg") {
            throw "Unexpected Neural Rendering PKGs remain in /data/pkg/: $($nrRoot -join ', ')"
          }
          $archiveFinal = @(Get-FtpNames "/data/pkg/old/")
          Write-Host "ROOT_NEURAL_RENDERING_PKGS=$($nrRoot -join ',')"
          Write-Host "ARCHIVED_NEURAL_RENDERING_PKGS=$($archiveFinal -join ',')"
          Write-Host "THIRD_PARTY_ROOT_FILES_PRESERVED=TRUE"
          Write-Host "INSTALLATION_PERFORMED=FALSE"
          "STAGING_STATUS=PASS_NOT_INSTALLED" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "REMOTE_PATH=$finalRemote" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "REMOTE_BYTES=$finalSize" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "REMOTE_SHA256=$finalHash" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "INSTALLATION_PERFORMED=FALSE" | Out-File $env:GITHUB_STEP_SUMMARY -Append

# Retry marker: trigger a fresh inspection after FTP listing hardening.

# Diagnostic retry marker.

# Trigger final archive parser verification.
