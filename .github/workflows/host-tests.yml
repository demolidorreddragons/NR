name: host-tests
on:
  push:
    branches: [main, feature/gcn8-numeric-kernels]
  pull_request:
  workflow_dispatch:
jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer newline escapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('installer/main.c').read_text()
          assert r'\\n' not in source, 'installer contains double-escaped newline sequences'
          assert r'\\r' not in source, 'installer contains double-escaped carriage-return sequences'
          print('Installer C escape sequences are valid')
          installer = Path('installer/main.c').read_text()
          assert 'fstat(' not in installer, 'installer must not trust PS4 fstat size values'
          assert 'PRX read-back verification failed' in installer, 'installer must verify copied PRX bytes'
          assert 'static ssize_t read_retry' in installer, 'installer must retry EINTR independently for each read'
          assert 'static ssize_t read_block' in installer, 'verification must accumulate short reads'
          assert 'read_block(verify_src' in installer and 'read_block(verify_dst' in installer, 'both streams must use full-block reads'
          assert 'DEST_BACKUP' in installer and 'CONFIG_BACKUP' in installer, 'transaction must retain recovery backups'
          assert 'static int commit_install' in installer, 'PRX/config commit transaction missing'
          assert 'rollback:' in installer and 'rollback incomplete' in installer and 'previous files restored' in installer, 'transaction rollback path and outcome reporting missing'
          assert 'rename(DEST_TMP, DEST_PRX)' in installer, 'staged PRX must be committed only in transaction'
          assert 'rename(CONFIG_TMP, CONFIG)' in installer, 'staged plugins.ini must be committed only in transaction'
          assert 'if (found_entry)' in installer and 'fopen_staged_file(CONFIG_TMP)' in installer, 'existing loader entry must still stage config'
          assert 'O_CREAT | O_EXCL' in installer, 'staging files must be created exclusively'
          assert 'O_TRUNC' not in installer, 'installer must never truncate a pre-existing staging path'
          assert 'fdopen(fd, "wb")' in installer, 'staged config must wrap the exclusively-created descriptor'
          build_script = Path('tools/build_pkg.sh').read_text()
          assert 'PRX_SHA256=' in build_script, 'PKG build must calculate the staged PRX SHA-256'
          assert 'pne-release.ini' in build_script, 'PKG must include the release manifest'
          assert 'manifest and PRX SHA-256 match' in build_script, 'PKG extraction must verify manifest against PRX'
          assert 'abi_status=unverified' in build_script and 'hardware_status=not_tested' in build_script, 'manifest must not claim unproven compatibility'
          print('Installer transaction and release-manifest invariants passed')
          PY
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
