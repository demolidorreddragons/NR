name: host-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pinned OpenGNM compute user-data PM4 patch and test contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/opengnm-pinned"
          git init "$ROOT"
          git -C "$ROOT" remote add origin https://github.com/PS4-OpenGNM/opengnm.git
          git -C "$ROOT" fetch --depth=1 origin 4b295ca54c82c83acf308d1c646a2dfa9ae57350
          git -C "$ROOT" checkout --detach FETCH_HEAD
          git -C "$ROOT" apply --recount --check "$GITHUB_WORKSPACE/patches/opengnm/0001-compute-userdata-set-sh-reg-shader-type.patch"
          git -C "$ROOT" apply --recount "$GITHUB_WORKSPACE/patches/opengnm/0001-compute-userdata-set-sh-reg-shader-type.patch"
          python3 tests/test_opengnm_compute_userdata_pm4.py "$ROOT/src/drawcommandbuffer.c"
          cmake -S "$ROOT" -B "$ROOT/build" -DOPENGNM_PLATFORM=generic -DOPENGNM_BUILD_TESTS=ON -DCMAKE_C_STANDARD_LIBRARIES=-lm
          cmake --build "$ROOT/build" --parallel 2
          ctest --test-dir "$ROOT/build" --output-on-failure
      - name: Validate CDA PKG 015 log-signal extractor contract
        run: python3 tests/test_cda_pkg015_log_extractor_contract.py
      - name: Validate PS4 superseded package archive safety contract
        run: python3 tests/test_ps4_pkg_archive_contract.py
      - name: Parse PS4 archive script with PowerShell AST
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/archive_superseded_nr_pkgs.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw "PS4 archive script syntax validation failed." }
      - name: Validate PS4 control-plane collector safety contract
        run: python3 tests/test_ps4_control_plane_collector_contract.py
      - name: Parse PS4 control-plane collector with PowerShell AST parser
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/ps4-control-plane-preflight.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $details = ($errors | ForEach-Object { $_.Message + " at line " + $_.Extent.StartLineNumber }) -join "`n"
            throw "PowerShell syntax validation failed: $details"
          }
          Write-Host "PS4 control-plane collector PowerShell syntax: PASS"
      - name: Validate installed package offline inspector contract
        run: python3 tests/test_ps4_installed_package_inspector_contract.py
      - name: Parse installed package inspector with PowerShell AST parser
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/inspect_ps4_installed_packages.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $details = ($errors | ForEach-Object { $_.Message + " at line " + $_.Extent.StartLineNumber }) -join "`n"
            throw "Installed package inspector syntax validation failed: $details"
          }
          Write-Host "Installed package inspector PowerShell syntax: PASS"
      - name: Validate installer newline escapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('installer/main.c').read_text()
          assert r'\\n' not in source, 'installer contains double-escaped newline sequences'
          assert r'\\r' not in source, 'installer contains double-escaped carriage-return sequences'
          print('Installer C escape sequences are valid')
          installer = Path('installer/main.c').read_text()
          assert 'fstat(' not in installer, 'installer must not trust PS4 fstat size values'
          assert 'PRX read-back verification failed' in installer, 'installer must verify copied PRX bytes'
          assert 'static ssize_t read_retry' in installer, 'installer must retry EINTR independently for each read'
          assert 'static ssize_t read_block' in installer, 'verification must accumulate short reads'
          assert 'read_block(verify_src' in installer and 'read_block(verify_dst' in installer, 'both streams must use full-block reads'
          print('Installer copy verification checks passed')
          PY
      - name: Model manifest validator tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Validate Windows runner service diagnostics safety contract
        run: python3 tests/test_windows_runner_service_diagnostics_contract.py
      - name: Parse Windows runner service diagnostics PowerShell AST
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/collect_windows_runner_service_diagnostics.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $details = ($errors | ForEach-Object { $_.Message + " at line " + $_.Extent.StartLineNumber }) -join "`n"
            throw "Windows runner diagnostics PowerShell syntax validation failed: $details"
          }
          Write-Host "Windows runner diagnostics PowerShell syntax: PASS"
      - name: Validate PS4 RPI readiness probe safety contract
        run: python3 tests/test_ps4_rpi_readiness_probe_contract.py
      - name: Parse PS4 RPI readiness probe PowerShell AST
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/ps4-rpi-readiness-probe.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $details = ($errors | ForEach-Object { $_.Message + " at line " + $_.Extent.StartLineNumber }) -join [Environment]::NewLine
            throw "RPI readiness probe PowerShell syntax validation failed: $details"
          }
          Write-Host "PS4 RPI readiness probe PowerShell syntax: PASS"
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
