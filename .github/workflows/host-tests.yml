name: host-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CDA PKG 015 log-signal extractor contract
        run: python3 tests/test_cda_pkg015_log_extractor_contract.py
      - name: Validate PS4 control-plane collector safety contract
        run: python3 tests/test_ps4_control_plane_collector_contract.py
      - name: Parse PS4 control-plane collector with PowerShell AST parser
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/ps4-control-plane-preflight.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $details = ($errors | ForEach-Object { $_.Message + " at line " + $_.Extent.StartLineNumber }) -join "`n"
            throw "PowerShell syntax validation failed: $details"
          }
          Write-Host "PS4 control-plane collector PowerShell syntax: PASS"
      - name: Validate installer newline escapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('installer/main.c').read_text()
          assert r'\\n' not in source, 'installer contains double-escaped newline sequences'
          assert r'\\r' not in source, 'installer contains double-escaped carriage-return sequences'
          print('Installer C escape sequences are valid')
          installer = Path('installer/main.c').read_text()
          assert 'fstat(' not in installer, 'installer must not trust PS4 fstat size values'
          assert 'PRX read-back verification failed' in installer, 'installer must verify copied PRX bytes'
          assert 'static ssize_t read_retry' in installer, 'installer must retry EINTR independently for each read'
          assert 'static ssize_t read_block' in installer, 'verification must accumulate short reads'
          assert 'read_block(verify_src' in installer and 'read_block(verify_dst' in installer, 'both streams must use full-block reads'
          print('Installer copy verification checks passed')
          PY
      - name: Model manifest validator tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
