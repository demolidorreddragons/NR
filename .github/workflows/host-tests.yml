name: host-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer newline escapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('installer/main.c').read_text()
          assert r'\\n' not in source, 'installer contains double-escaped newline sequences'
          assert r'\\r' not in source, 'installer contains double-escaped carriage-return sequences'
          print('Installer C escape sequences are valid')
          PY
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
