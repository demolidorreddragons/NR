name: host-tests
on:
  push:
    branches: [main, feature/gcn8-numeric-kernels]
  pull_request:
  workflow_dispatch:
jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer newline escapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('installer/main.c').read_text()
          assert r'\\n' not in source, 'installer contains double-escaped newline sequences'
          assert r'\\r' not in source, 'installer contains double-escaped carriage-return sequences'
          print('Installer C escape sequences are valid')
          installer = Path('installer/main.c').read_text()
          assert 'fstat(' in installer and 'O_NOFOLLOW' in installer, 'managed-path inspection must use opened descriptors and reject symlinks'
          assert 'inspect_managed_path(CONFIG, &config_stat)' in installer, 'plugins.ini inspection must use the same opened-descriptor Orbis-safe path as PRX'
          assert 'lstat(CONFIG' not in installer, 'plugins.ini must not rely on Orbis lstat file-type results'
          assert 'st.st_size' not in installer and 'metadata->st_size' not in installer, 'installer must not trust PS4 stat size values'
          assert 'PRX read-back verification failed' in installer, 'installer must verify copied PRX bytes'
          assert 'static ssize_t read_retry' in installer, 'installer must retry EINTR independently for each read'
          assert 'static ssize_t read_block' in installer, 'verification must accumulate short reads'
          assert 'read_block(verify_src' in installer and 'read_block(verify_dst' in installer, 'both streams must use full-block reads'
          assert 'DEST_BACKUP' in installer and 'CONFIG_BACKUP' in installer, 'transaction must retain recovery backups'
          assert 'static int commit_install' in installer, 'PRX/config commit transaction missing'
          assert 'rollback:' in installer and 'rollback incomplete' in installer and 'previous files restored' in installer, 'transaction rollback path and outcome reporting missing'
          assert 'rename(prx_tmp,DEST_PRX)' in installer, 'staged PRX must be committed only in transaction'
          assert 'rename(config_tmp,CONFIG)' in installer, 'staged plugins.ini must be committed only in transaction'
          assert 'if (entry_count == 1)' in installer and '*changed = 0;' in installer, 'canonical loader entry must remain untouched'
          assert 'O_CREAT | O_EXCL' in installer, 'staging files must be created exclusively'
          assert 'open_unique_staged_file' in installer, 'PRX/config staging must reserve unique paths atomically'
          assert 'fopen_unique_staged_file(CONFIG_TMP' in installer, 'plugins.ini must use a unique temporary path when it changes'
          assert 'rename(prx_tmp,DEST_PRX)' in installer and 'rename(manifest_tmp,INSTALLED_MANIFEST)' in installer, 'transaction must commit PRX and installed manifest'
          assert 'loader_entry_is_canonical' in installer, 'ALREADY_CURRENT must require a canonical loader entry'
          assert 'pne_classify_install_state' in installer and 'PNE_STATE_RECOVERY' in installer and 'PNE_STATE_CONFLICT' in installer, 'hybrid state detection missing'
          assert 'copy_file_to_unique_staged' in installer, 'recovery must preserve the original staged candidate while preparing a commit copy'
          assert 'pne_validate_release_manifest(INSTALLED_MANIFEST,DEST_TMP' in installer, 'recovery candidate must be verified against its installed manifest'
          assert 'pne_recovery_candidate_is_compatible' in installer and 'strcmp(staged_hash,incoming_hash)==0' in installer, 'recovery must use the tested release-order and exact-hash predicate'
          state_source = Path('installer/hybrid_state.c').read_text()
          assert 'pne_recovery_candidate_is_compatible' in state_source, 'pure recovery eligibility predicate missing'
          assert 'RECOVERY_CANDIDATE:' in installer and 'RECOVERY_COMMIT:' in installer, 'recovery path must be explicitly logged'
          assert 'STARTED: installer entered main' in installer, 'installer must emit a fresh startup log marker before validation'

          assert 'ALREADY_CURRENT' in installer and 'downgrade refused' in installer, 'hash idempotency and downgrade protection missing'
          assert 'TRANSACTION_MARKER' in installer and 'INSTALLED_MANIFEST' in installer, 'recovery marker/installed manifest missing'
          assert 'path_is_regular_file' in installer and 'inspect_managed_path' in installer, 'managed destination regular-file and symlink protection missing'
          assert 'for (unsigned index = 0; index < 10000; ++index)' in installer, 'staging collision retry loop missing'
          assert 'if (errno != EEXIST) return 0;' in installer, 'staging retry must only continue on EEXIST'
          assert 'O_TRUNC' not in installer, 'installer must never truncate a pre-existing staging path'
          assert 'fdopen(fd, "wb")' in installer, 'staged config must wrap the exclusively-created descriptor'
          assert 'pne_validate_release_manifest(RELEASE_MANIFEST,SOURCE_PRX' in installer, 'installer must verify release identity and PRX hash'
          assert installer.index('pne_validate_release_manifest(RELEASE_MANIFEST,SOURCE_PRX') < installer.index('mkdir("/data/GoldHEN"'), 'manifest/hash validation must precede destination writes'
          assert 'RELEASE_MANIFEST "/app0/pne-release.ini"' in installer, 'installer manifest path missing'
          build_script = Path('tools/build_pkg.sh').read_text()
          assert 'installer/sha256.c' in build_script and 'installer/release_manifest.c' in build_script, 'installer integrity objects must be linked'
          assert 'PRX_SHA256=' in build_script, 'PKG build must calculate the staged PRX SHA-256'
          assert 'pne-release.ini' in build_script, 'PKG must include the release manifest'
          assert 'manifest and PRX SHA-256 match' in build_script, 'PKG extraction must verify manifest against PRX'
          assert 'abi_status=unverified' in build_script and 'hardware_status=not_tested' in build_script, 'manifest must not claim unproven compatibility'
          print('Installer transaction and release-manifest invariants passed')
          PY
      - name: Validate GCN8 diagnostic build modes
        run: |
          bash -n tools/build_compute_smoke_pkg.sh
          python3 tests/test_gcn8_diagnostic_modes.py
      - name: Test hybrid installer state machine
        run: |
          mkdir -p "$RUNNER_TEMP/pne-installer-test"
          cc -std=c11 -Wall -Wextra -Werror -Iinstaller installer/hybrid_state.c tests/test_hybrid_state.c -o "$RUNNER_TEMP/pne-installer-test/test_hybrid_state"
          "$RUNNER_TEMP/pne-installer-test/test_hybrid_state"
      - name: Test installer release manifest and SHA-256
        run: |
          mkdir -p "$RUNNER_TEMP/pne-installer-test"
          cc -std=c11 -Wall -Wextra -Werror -Iinstaller installer/sha256.c installer/release_manifest.c tests/test_release_manifest.c -o "$RUNNER_TEMP/pne-installer-test/test_release_manifest"
          "$RUNNER_TEMP/pne-installer-test/test_release_manifest"
      - name: Test GCN8 stage logger
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iplatform/ps4/gcn8 platform/ps4/gcn8/stage_log.c tests/test_stage_log.c -o "$RUNNER_TEMP/test_stage_log"
          "$RUNNER_TEMP/test_stage_log"
          cc -std=c11 -Wall -Wextra -Werror -DSTAGE_LOG_UDP -Iplatform/ps4/gcn8 platform/ps4/gcn8/stage_log.c tests/test_stage_log.c -o "$RUNNER_TEMP/test_stage_log_udp"
          "$RUNNER_TEMP/test_stage_log_udp"
      - name: Validate GCN8 numeric reference and tiled mapping
        run: python3 tools/test_gcn8_numeric.py
      - name: Validate GNM input-usage offset arithmetic
        run: python3 tools/test_gnm_slot_offsets.py
      - name: Validate DLSS-NR 71-block tensor layout formulas
        run: python3 tests/test_dlssnr_layout_formulas.py
      - name: Validate model input intake verifier
        run: python3 tests/test_verify_model_inputs.py
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  retrieve-ps4-crash-log:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/gcn8-numeric-kernels'
    runs-on: [self-hosted, Windows, X64, ps4-lan]
    timeout-minutes: 5
    steps:
      - name: Retrieve logger file over read-only FTP
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:RUNNER_TEMP 'ps4-crash-evidence'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $base = 'ftp://192.168.0.17:2121'
          $credential = New-Object System.Net.NetworkCredential('anonymous', 'anonymous@')
          $found = $false

          foreach ($dir in @('/user/data/', '/data/')) {
            $safeName = ($dir.Trim('/') -replace '/', '_')
            $listPath = Join-Path $outDir ("listing-" + $safeName + ".txt")
            try {
              $listReq = [System.Net.FtpWebRequest]::Create($base + $dir)
              $listReq.Method = [System.Net.WebRequestMethods+Ftp]::ListDirectoryDetails
              $listReq.Credentials = $credential
              $listReq.UsePassive = $true
              $listReq.UseBinary = $true
              $listReq.KeepAlive = $false
              $listReq.Timeout = 15000
              $listResp = $listReq.GetResponse()
              $reader = New-Object System.IO.StreamReader($listResp.GetResponseStream())
              $listing = $reader.ReadToEnd()
              $reader.Dispose()
              $listResp.Dispose()
              Set-Content -Path $listPath -Value $listing -Encoding UTF8
              Write-Host "FTP_LIST_OK $dir"
            } catch {
              Set-Content -Path $listPath -Value ("LIST_ERROR: " + $_.Exception.Message) -Encoding UTF8
              Write-Host "FTP_LIST_UNAVAILABLE $dir"
            }
          }

          foreach ($remote in @('/user/data/pne.log', '/data/pne.log')) {
            $dest = Join-Path $outDir (($remote.Trim('/') -replace '/', '_'))
            try {
              $req = [System.Net.FtpWebRequest]::Create($base + $remote)
              $req.Method = [System.Net.WebRequestMethods+Ftp]::DownloadFile
              $req.Credentials = $credential
              $req.UsePassive = $true
              $req.UseBinary = $true
              $req.KeepAlive = $false
              $req.Timeout = 20000
              $resp = $req.GetResponse()
              $inputStream = $resp.GetResponseStream()
              $file = [System.IO.File]::Create($dest)
              $inputStream.CopyTo($file)
              $file.Dispose()
              $inputStream.Dispose()
              $resp.Dispose()
              $hash = (Get-FileHash -Algorithm SHA256 -Path $dest).Hash.ToLowerInvariant()
              Write-Host "LOGGER_DOWNLOADED path=$remote bytes=$((Get-Item $dest).Length) sha256=$hash"
              $found = $true
            } catch {
              Write-Host "LOGGER_NOT_FOUND path=$remote detail=$($_.Exception.Message)"
            }
          }


          $legacyLog = '/data/pne_gcn8_compute_smoke_44873622760.log'
          $legacyDest = Join-Path $outDir 'pne_gcn8_compute_smoke_44873622760.log'
          try {
            $req = [System.Net.FtpWebRequest]::Create($base + $legacyLog)
            $req.Method = [System.Net.WebRequestMethods+Ftp]::DownloadFile
            $req.Credentials = $credential
            $req.UsePassive = $true
            $req.UseBinary = $true
            $req.KeepAlive = $false
            $req.Timeout = 20000
            $resp = $req.GetResponse()
            $inputStream = $resp.GetResponseStream()
            $file = [System.IO.File]::Create($legacyDest)
            $inputStream.CopyTo($file)
            $file.Dispose()
            $inputStream.Dispose()
            $resp.Dispose()
            $hash = (Get-FileHash -Algorithm SHA256 -Path $legacyDest).Hash.ToLowerInvariant()
            Write-Host "LEGACY_LOG_DOWNLOADED bytes=$((Get-Item $legacyDest).Length) sha256=$hash"
            $found = $true
          } catch {
            Write-Host "LEGACY_LOG_NOT_FOUND detail=$($_.Exception.Message)"
          }

          foreach ($dir in @('/data/sce_coredumps/', '/data/sce_logs/')) {
            $name = ($dir.Trim('/') -replace '/', '_')
            $dest = Join-Path $outDir ("listing-" + $name + ".txt")
            try {
              $req = [System.Net.FtpWebRequest]::Create($base + $dir)
              $req.Method = [System.Net.WebRequestMethods+Ftp]::ListDirectoryDetails
              $req.Credentials = $credential
              $req.UsePassive = $true
              $req.UseBinary = $true
              $req.KeepAlive = $false
              $req.Timeout = 15000
              $resp = $req.GetResponse()
              $reader = New-Object System.IO.StreamReader($resp.GetResponseStream())
              $listing = $reader.ReadToEnd()
              $reader.Dispose()
              $resp.Dispose()
              Set-Content -Path $dest -Value $listing -Encoding UTF8
              Write-Host "FTP_LIST_OK $dir"
            } catch {
              Set-Content -Path $dest -Value ("LIST_ERROR: " + $_.Exception.Message) -Encoding UTF8
              Write-Host "FTP_LIST_UNAVAILABLE $dir"
            }
          }


          $sceLog = '/data/sce_logs/log.bin'
          $sceDest = Join-Path $outDir 'sce_logs-log.bin'
          try {
            $req = [System.Net.FtpWebRequest]::Create($base + $sceLog)
            $req.Method = [System.Net.WebRequestMethods+Ftp]::DownloadFile
            $req.Credentials = $credential
            $req.UsePassive = $true
            $req.UseBinary = $true
            $req.KeepAlive = $false
            $req.Timeout = 60000
            $req.ReadWriteTimeout = 60000
            $resp = $req.GetResponse()
            $inputStream = $resp.GetResponseStream()
            $file = [System.IO.File]::Create($sceDest)
            $inputStream.CopyTo($file)
            $file.Dispose()
            $inputStream.Dispose()
            $resp.Dispose()
            $hash = (Get-FileHash -Algorithm SHA256 -Path $sceDest).Hash.ToLowerInvariant()
            Write-Host "SCE_LOG_DOWNLOADED bytes=$((Get-Item $sceDest).Length) sha256=$hash"
            $found = $true
          } catch {
            Write-Host "SCE_LOG_NOT_FOUND detail=$($_.Exception.Message)"
          }


          foreach ($remote in @('/data/Loader_Logs.txt', '/data/memory.log')) {
            $dest = Join-Path $outDir (($remote.Trim('/') -replace '/', '_'))
            try {
              $req = [System.Net.FtpWebRequest]::Create($base + $remote)
              $req.Method = [System.Net.WebRequestMethods+Ftp]::DownloadFile
              $req.Credentials = $credential
              $req.UsePassive = $true
              $req.UseBinary = $true
              $req.KeepAlive = $false
              $req.Timeout = 20000
              $resp = $req.GetResponse()
              $inputStream = $resp.GetResponseStream()
              $file = [System.IO.File]::Create($dest)
              $inputStream.CopyTo($file)
              $file.Dispose()
              $inputStream.Dispose()
              $resp.Dispose()
              $hash = (Get-FileHash -Algorithm SHA256 -Path $dest).Hash.ToLowerInvariant()
              Write-Host "AUX_LOG_DOWNLOADED path=$remote bytes=$((Get-Item $dest).Length) sha256=$hash"
              $found = $true
            } catch {
              Write-Host "AUX_LOG_NOT_FOUND path=$remote detail=$($_.Exception.Message)"
            }
          }

          if ($found) {
            "LOGGER_FOUND=true" | Set-Content (Join-Path $outDir 'result.txt')
          } else {
            "LOGGER_FOUND=false; inspect directory listings and confirm the console is online and the logger ran." | Set-Content (Join-Path $outDir 'result.txt')
          }
      - name: Upload retrieved evidence
        uses: actions/upload-artifact@v4
        with:
          name: ps4-crash-logger-evidence
          path: ${{ runner.temp }}/ps4-crash-evidence/
          if-no-files-found: error
          retention-days: 7
