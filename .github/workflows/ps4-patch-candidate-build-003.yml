name: PS4 Patch Candidate Build 003

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ps4-patch-candidate-build-003.yml"

permissions:
  actions: read
  contents: read

jobs:
  build-candidate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # Disposable hosted Windows runner only; never execute third-party tools on the PS4 bridge.
    # The QA workflow checks executable deltas and the exact bundled base/patch pair.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Neural Engine
        uses: actions/checkout@v4

      - name: Checkout OrbisPkgTool validator
        uses: actions/checkout@v4
        with:
          repository: pearlxcore/OrbisPkgTool
          ref: master
          path: OrbisPkgTool-src

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build independent PKG validator
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $builderPath = "OrbisPkgTool-src/OrbisPkgTool/Pkg/PkgBuilder.cs"
          $builder = Get-Content $builderPath -Raw
          $categoryOld = 'project.VolumeType == VolumeType.PkgPs4Patch ? "gp" : "gd"'
          $categoryNew = 'project.VolumeType == VolumeType.PkgPs4Patch ? "gp" : "gd"'
          if (-not $builder.Contains($categoryOld)) { throw "PkgBuilder category mapping anchor not found." }
          $builder = $builder.Replace($categoryOld, $categoryNew)
          if (-not $builder.Contains("img0_pc_ksize=832")) { throw "PkgBuilder PUBTOOLINFO anchor not found." }
          $builder = $builder.Replace("img0_pc_ksize=832", "img0_pc_ksize=832,st_type=digital50")
          [IO.File]::WriteAllText($builderPath, $builder, [Text.UTF8Encoding]::new($false))
          $builderCheck = [IO.File]::ReadAllText($builderPath)
          $storageTagCount = [regex]::Matches($builderCheck, "img0_pc_ksize=832,st_type=digital50").Count
          if ($storageTagCount -lt 3) { throw "PkgBuilder storage metadata patch not persisted; count=$storageTagCount" }
          "PKGBUILDER_ST_TYPE_PATCH_COUNT=$storageTagCount" | Out-File $env:GITHUB_STEP_SUMMARY -Append

          # Extend sfo set with an explicit max length so FORMAT=obs uses
          # Sony's 4-byte SFO field allocation (the required patch schema).
          $programPath = "OrbisPkgTool-src/OrbisPkgTool/Program.cs"
          $program = Get-Content $programPath -Raw
          $setOld = @'
                          string? outFile = null;
                          for (int i = 4; i < args.Length; i++)
                              if (args[i] == "--out" && i + 1 < args.Length) outFile = args[++i];
                          var sfo = OrbisPkgTool.Sfo.ParamSfo.Parse(File.ReadAllBytes(file));
                          var existing = sfo[key];
                          if (int.TryParse(value, out int iv) && existing is { Format: 0x0404 })
                              sfo.SetInt(key, iv);
                          else if (existing != null)
                              sfo.SetString(key, value, existing.MaxLength); // preserve the field's max length
                          else
                              sfo.SetString(key, value);
          '@
          $setNew = @'
                          string? outFile = null;
                          int? requestedMaxLength = null;
                          for (int i = 4; i < args.Length; i++) {
                              if (args[i] == "--out" && i + 1 < args.Length) outFile = args[++i];
                              else if (args[i] == "--max-length" && i + 1 < args.Length) requestedMaxLength = int.Parse(args[++i]);
                          }
                          var sfo = OrbisPkgTool.Sfo.ParamSfo.Parse(File.ReadAllBytes(file));
                          var existing = sfo[key];
                          if (int.TryParse(value, out int iv) && existing is { Format: 0x0404 })
                              sfo.SetInt(key, iv);
                          else if (existing != null)
                              sfo.SetString(key, value, existing.MaxLength);
                          else
                              sfo.SetString(key, value, requestedMaxLength ?? 0x400);
          '@
          if (-not $program.Contains($setOld)) { throw "SFO set max-length insertion anchor not found." }
          $program = $program.Replace($setOld, $setNew)
          [IO.File]::WriteAllText($programPath, $program, [Text.UTF8Encoding]::new($false))
          if (-not ([IO.File]::ReadAllText($programPath).Contains('requestedMaxLength ?? 0x400'))) { throw "SFO set max-length patch was not persisted." }
          dotnet build OrbisPkgTool-src/OrbisPkgTool/OrbisPkgTool.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "OrbisPkgTool build failed." }
          $tool = "OrbisPkgTool-src/OrbisPkgTool/bin/Release/net10.0-windows/OrbisPkgTool.dll"
          if (-not (Test-Path $tool)) { throw "OrbisPkgTool DLL missing: $tool" }

      - name: Download exact installed app PKG from PS4 audit
        uses: actions/download-artifact@v4
        with:
          name: installed-app-files-readonly
          path: base-artifact
          repository: demolidorreddragons/NR
          run-id: 44657934789
          github-token: ${{ github.token }}

      - name: Download current PRX payload for the patch delta
        uses: actions/download-artifact@v4
        with:
          name: ps4-neural-engine-build
          path: current-prx-artifact
          repository: demolidorreddragons/NR
          run-id: 44656276566
          github-token: ${{ github.token }}

      - name: Download pinned Fake PKG Tools v7
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/CyB1K/PS4-Fake-PKG-Tools-3.87/releases/download/v7/PS4_Fake_PKG_Tools_3.87_V7.rar"
          $archive = Join-Path $env:RUNNER_TEMP "fake-pkg-tools-v7.rar"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = "206FF9CD1199AE3943944FE61FB9247EC0B398B079AB125543FB1AD115E76ED7"
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash
          if ($actual -ne $expected) { throw "Fake PKG Tools archive SHA-256 mismatch: $actual" }
          if ((Get-Item $archive).Length -ne 6674278) { throw "Unexpected release archive size." }
          $dest = Join-Path $env:RUNNER_TEMP "fake-pkg-tools"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          & "$env:ProgramFiles\7-Zip\7z.exe" x $archive "-o$dest" -y
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed." }
          $cmd = Get-ChildItem $dest -Recurse -File -Filter "orbis-pub-cmd.exe" | Select-Object -First 1
          if (-not $cmd) { throw "orbis-pub-cmd.exe missing." }
          $toolHash = (Get-FileHash -Algorithm SHA256 $cmd.FullName).Hash
          if ($toolHash -ne "9D136A27A0739555329E46B61208B7105D4C5AEA5644CBF8052BFED4250D0E1B") { throw "orbis-pub-cmd hash mismatch." }
          "ORBiS_PUB_CMD=$($cmd.FullName)" | Out-File "$env:RUNNER_TEMP\tool-path.txt"
          "ORBiS_PUB_CMD_SHA256=$toolHash" | Out-File "$env:RUNNER_TEMP\tool-path.txt" -Append

      - name: "Build and validate associated non-game patch candidate 003"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $basePkg = Join-Path $env:GITHUB_WORKSPACE "base-artifact/installed-app.pkg"
          if (-not (Test-Path $basePkg)) { throw "Exact installed app.pkg not found: $basePkg" }
          $tool = "OrbisPkgTool-src/OrbisPkgTool/bin/Release/net10.0-windows/OrbisPkgTool.dll"
          $pubCmd = Get-Content "$env:RUNNER_TEMP\tool-path.txt" | Where-Object { $_ -like "ORBiS_PUB_CMD=*" } | ForEach-Object { $_.Substring(14) }
          if (-not (Test-Path $pubCmd)) { throw "orbis-pub-cmd path invalid." }
          $basePkg = (Resolve-Path $basePkg).Path
          $work = Join-Path $env:RUNNER_TEMP "patch-003"
          New-Item -ItemType Directory -Force -Path "candidate-output" | Out-Null
          $zeroKey = "00000000000000000000000000000000"

          # The patch baseline is the previously validated PKG 002 artifact.
          # The current build's PRX is kept separate and added only to the patch.
          "SOURCE_BASE_PKG_MODE=EXACT_INSTALLED_PKG_FROM_PS4_READONLY_AUDIT_RUN_44657934789" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          $extract = Join-Path $work "base-extracted"
          $gp4 = Join-Path $work "PS4-Neural-Engine-003.gp4"
          $pkg = Join-Path $work "PS4-Neural-Engine-003-CANDIDATE.pkg"
          $verify = Join-Path $work "verify"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          "BASE_PKG_ABSOLUTE_PATH=$basePkg" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append

          "=== BASE PACKAGE: EXACT INSTALLED APP.PKG ===" | Tee-Object -FilePath "candidate-output/build-report.txt"
          dotnet "$tool" info "$basePkg" 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw "Base PKG info failed." }

          "=== EXTRACT BASE ===" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          dotnet "$tool" extract "$basePkg" "$extract" --verbose 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw "Base PKG extraction failed." }

          "=== AUDIT ORIGINAL BASE PARAM.SFO BEFORE RESTRUCTURE ===" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          $baseSfo = Get-ChildItem $extract -Recurse -File -Filter "param.sfo" | Select-Object -First 1
          if (-not $baseSfo) { throw "Original base param.sfo missing after extraction." }
          $baseSfoText = dotnet "$tool" sfo read "$($baseSfo.FullName)" 2>&1
          $baseSfoText | Tee-Object -FilePath "candidate-output/base-param-sfo.txt"
          $baseSfoText | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw "Original base SFO readback failed." }
          $baseStorage = ($baseSfoText -join "`n") -match "PUBTOOLINFO.*st_type="
          "BASE_SFO_HAS_STORAGE_TYPE=$baseStorage" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if (-not $baseStorage) {
            dotnet "$tool" sfo set "$($baseSfo.FullName)" PUBTOOLINFO "c_date=20261120,img0_l0_size=7,img0_l1_size=0,img0_sc_ksize=512,img0_pc_ksize=832,st_type=digital50" 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
            if ($LASTEXITCODE -ne 0) { throw "Could not add Sony digital50 publisher metadata to the disposable base copy." }
            $baseSfoText = dotnet "$tool" sfo read "$($baseSfo.FullName)" 2>&1
            if (($baseSfoText -join "`n") -notmatch "st_type=digital50") { throw "Base SFO storage metadata readback failed." }
          }
          Copy-Item $basePkg "candidate-output/PS4-Neural-Engine-Installed-Original.pkg"
          $installedBaseHash = (Get-FileHash -Algorithm SHA256 $basePkg).Hash
          "INSTALLED_BASE_PKG_SHA256=$installedBaseHash" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append

          "=== RESTRUCTURE IMAGE0 + SC0 ===" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          dotnet "$tool" restructure "$extract" --verbose 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw "Base package restructure failed." }

          $image = Join-Path $extract "Image0"
          $sfo = Join-Path $image "sce_sys/param.sfo"
          $eboot = Join-Path $image "eboot.bin"
          $prx = Join-Path $image "ps4_neural_engine.prx"
          $patchPrx = Join-Path $env:GITHUB_WORKSPACE "current-prx-artifact/ps4/ps4_neural_engine.prx"
          if (-not (Test-Path $patchPrx)) { throw "Current PRX build payload missing: $patchPrx" }
          foreach ($p in @($sfo,$eboot,$prx)) {
            if (-not (Test-Path $p)) { throw "Required base payload missing: $p" }
          }

          $basePrxHash = (Get-FileHash -Algorithm SHA256 $prx).Hash
          $patchPrxHash = (Get-FileHash -Algorithm SHA256 $patchPrx).Hash
          "BASE_SOURCE_PRX_SHA256=$basePrxHash" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          "PATCH_SOURCE_PRX_SHA256=$patchPrxHash" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          "PATCH_SOURCE_PRX_BYTES=$((Get-Item $patchPrx).Length)" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($basePrxHash -eq $patchPrxHash) { throw "Current PRX payload is byte-identical to baseline PKG 002; no functional patch delta exists." }

          # Use the byte-exact installed app.pkg as the patch association target.
          # Rebuilding the base through orbis-pub-cmd fails on its original SFO
          # (FORMAT parsing); no base rebuild is necessary for an associated patch.
          $baseHash = (Get-FileHash -Algorithm SHA256 $basePkg).Hash
          "PATCH_ASSOCIATED_BASE_PKG=$basePkg" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          "PATCH_ASSOCIATED_BASE_PKG_SHA256=$baseHash" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          "PATCH_ASSOCIATED_BASE_CATEGORY=gd" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          "PATCH_ASSOCIATED_BASE_APP_VER=1.00" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          Copy-Item $basePkg "candidate-output/PS4-Neural-Engine-Installed-Original.pkg"

          "=== SET PATCH PARAM.SFO ===" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          dotnet "$tool" sfo set "$sfo" CATEGORY gp 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw "SFO CATEGORY update failed." }
          dotnet "$tool" sfo set "$sfo" APP_VER 01.01 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw "SFO APP_VER update failed." }
          dotnet "$tool" sfo set "$sfo" VERSION 01.00 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw "SFO VERSION update failed." }
          dotnet "$tool" sfo set "$sfo" ATTRIBUTE 8388610 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw "SFO ATTRIBUTE update failed." }
          dotnet "$tool" sfo set "$sfo" PUBTOOLINFO "c_date=20261120,img0_l0_size=7,img0_l1_size=0,img0_sc_ksize=512,img0_pc_ksize=832,st_type=digital25" 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw "SFO PUBTOOLINFO update failed." }
          dotnet "$tool" sfo set "$sfo" FORMAT obs --max-length 4 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw "Required patch SFO FORMAT=obs field creation failed." }
          dotnet "$tool" sfo read "$sfo" 2>&1 | Tee-Object -FilePath "candidate-output/patch-param-sfo.txt"
          if ($LASTEXITCODE -ne 0) { throw "Patch SFO readback failed." }
          $patchSfoText = Get-Content "candidate-output/patch-param-sfo.txt" -Raw
          if ($patchSfoText -notmatch "PUBTOOLINFO.*st_type=digital25") { throw "Patch SFO storage type must match GP4 patch storage_type=digital25." }
          if ($patchSfoText -match "(?m)^FORMAT\s*=") { throw "Patch SFO still contains the unsupported base-only FORMAT field." }

          $changeInfoDir = Join-Path $image "sce_sys/changeinfo"
          New-Item -ItemType Directory -Force -Path $changeInfoDir | Out-Null
          $changeInfo = Join-Path $changeInfoDir "changeinfo.xml"
          $changeXml = '<?xml version="1.0" encoding="UTF-8"?>' + "`n" +
            '<changeinfo><changes app_ver="01.01"><![CDATA[Neural Engine update 1.01]]></changes></changeinfo>'
          [IO.File]::WriteAllText($changeInfo, $changeXml, [Text.UTF8Encoding]::new($false))

          "=== CREATE ASSOCIATED PATCH GP4 ===" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          & $pubCmd gp4_proj_create --volume_type pkg_ps4_patch --content_id IV0000-PNEU00001_00-PS4NEURALENG0000 --passcode $zeroKey --entitlement_key $zeroKey --storage_type digital25 --app_path $basePkg $gp4 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $gp4)) { throw "Associated patch GP4 creation failed." }
          # Keep Sony's accepted patch storage_type (digital25), associated with the exact installed gd base.

          # Re-run the pair build against the normalized Windows-path QA check.
          "=== ADD PATCH PAYLOAD ===" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          "PATCH_SOURCE_EBOOT_SHA256=$((Get-FileHash -Algorithm SHA256 $eboot).Hash)" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          "PATCH_SOURCE_PRX_SHA256=$((Get-FileHash -Algorithm SHA256 $patchPrx).Hash)" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          # eboot.bin is byte-identical to the base application. Omit it from
          # the patch payload so the update contains only the changed PRX and metadata.
          "UNCHANGED_EBOOT_OMITTED_FROM_PATCH=True" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          & $pubCmd gp4_file_add --force --pfs_compression enable $patchPrx "ps4_neural_engine.prx" $gp4 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw "Adding PRX to GP4 failed." }
          & $pubCmd gp4_file_add --force --pfs_compression enable $sfo "sce_sys/param.sfo" $gp4 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw "Adding patch param.sfo to GP4 failed." }
          & $pubCmd gp4_file_add --force --pfs_compression disable $changeInfo "sce_sys/changeinfo/changeinfo.xml" $gp4 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw "Adding changeinfo.xml to GP4 failed." }

          [xml]$project = Get-Content $gp4
          $volumeType = $project.psproject.volume.volume_type
          $appPath = $project.psproject.volume.package.app_path
          if ($volumeType -ne "pkg_ps4_patch") { throw "GP4 volume_type is not pkg_ps4_patch." }
          if (-not $appPath) { throw "GP4 has no Application Package association." }
          if ([IO.Path]::GetFileName($appPath) -ne "installed-app.pkg") { throw "GP4 association does not point to the exact installed base app.pkg: $appPath" }
          if ($project.psproject.files.file.Count -lt 3) { throw "GP4 has fewer than 3 payload entries." }
          Copy-Item $gp4 "candidate-output/PS4-Neural-Engine-003.gp4"
          "GP4_VOLUME_TYPE=$volumeType" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          "GP4_APP_PATH=$appPath" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          "GP4_FILE_COUNT=$($project.psproject.files.file.Count)" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append

          "=== BUILD CANDIDATE PKG ===" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          & $pubCmd img_create --no_progress_bar $gp4 $pkg 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $pkg)) { throw "img_create failed." }

          "=== VALIDATE CANDIDATE PKG ===" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          dotnet "$tool" validate "$pkg" 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw "Independent PKG validation failed." }
          dotnet "$tool" info "$pkg" 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw "Candidate PKG info inspection failed." }

          dotnet "$tool" extract "$pkg" "$verify" --verbose 2>&1 | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if ($LASTEXITCODE -ne 0) { throw "Candidate PKG extraction failed." }
          $verifySfo = Get-ChildItem $verify -Recurse -File -Filter "param.sfo" | Select-Object -First 1
          if (-not $verifySfo) { throw "Candidate PKG param.sfo not found after extraction." }
          $sfoText = dotnet "$tool" sfo read "$($verifySfo.FullName)" 2>&1
          $sfoText | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          if (($sfoText -join "`n") -notmatch "CATEGORY = gp" -or ($sfoText -join "`n") -notmatch "APP_VER = 01.01") { throw "Candidate patch SFO metadata readback mismatch." }

          Copy-Item $pkg "candidate-output/PS4-Neural-Engine-003-CANDIDATE.pkg"
          $hash = (Get-FileHash -Algorithm SHA256 "candidate-output/PS4-Neural-Engine-003-CANDIDATE.pkg").Hash
          "CANDIDATE_PKG_SHA256=$hash" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          "CANDIDATE_PKG_BYTES=$((Get-Item 'candidate-output/PS4-Neural-Engine-003-CANDIDATE.pkg').Length)" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append
          "STATUS=PC_BUILD_AND_STRUCTURAL_VALIDATION_PASSED; ASSOCIATED_TO_EXACT_INSTALLED_BASE; NOT_HARDWARE_TESTED; DO_NOT_INSTALL_YET" | Tee-Object -FilePath "candidate-output/build-report.txt" -Append

      - name: Upload patch candidate and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Neural-Engine-003-patch-candidate
          path: |
            candidate-output/*
          if-no-files-found: warn
          retention-days: 7
