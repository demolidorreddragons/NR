name: Organize PS4 PKG archive
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ps4-organize-pkg-archive.yml"
permissions:
  contents: read
jobs:
  organize:
    runs-on: [self-hosted, Windows, X64, ps4-lan]
    steps:
      - name: Move only older Neural Engine PKGs into archive folder
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          PS4_IP: ${{ vars.PS4_IP }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:PS4_IP) { throw "PS4_IP variable missing." }

          $hostUrl = "ftp://$($env:PS4_IP):2121/"
          $creds = "anonymous:anonymous@example.com"
          $keep = "PS4-Neural-Engine-003-263D3207F1A6.pkg"
          $base = "/data/pkg/"
          $archive = "/data/pkg/old_versions/"

          function Get-FtpNames([string]$path) {
            $url = "ftp://$($env:PS4_IP):2121$path"
            $result = & curl.exe --fail --silent --show-error --ftp-pasv --list-only --user $creds $url 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Cannot list $path; refusing to change files. $result" }
            return @($result | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ })
          }

          $rootBefore = @(Get-FtpNames $base)
          if ($rootBefore -notcontains $keep) { throw "The exact current PKG 003 is missing from /data/pkg; no files moved." }

          # Only archive older Neural Engine packages. Preserve every other app/package.
          $neuralPackages = @($rootBefore | Where-Object { $_ -match '^PS4-Neural-Engine-.*[.]pkg$' })
          $old = @($neuralPackages | Where-Object { $_ -ne $keep })
          $preservedOther = @($rootBefore | Where-Object { $_ -notmatch '^PS4-Neural-Engine-.*[.]pkg$' })
          Write-Host "KEEP_AT_ROOT=$keep"
          Write-Host "OLD_NEURAL_PACKAGE_COUNT=$($old.Count)"
          Write-Host "PRESERVE_NON_NEURAL_COUNT=$($preservedOther.Count)"

          # Create archive folder if absent; if it exists, retain its contents.
          $archiveBefore = @()
          $archiveCheck = & curl.exe --fail --silent --ftp-pasv --list-only --user $creds "ftp://$($env:PS4_IP):2121$archive" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $archiveBefore = @($archiveCheck | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ })
          } else {
            $mkd = & curl.exe --fail --silent --show-error --ftp-pasv --user $creds --quote "CWD data" --quote "CWD pkg" --quote "MKD old_versions" $hostUrl 2>&1
            if ($LASTEXITCODE -ne 0) {
              $archiveRetry = & curl.exe --fail --silent --show-error --ftp-pasv --list-only --user $creds "ftp://$($env:PS4_IP):2121$archive" 2>&1
              if ($LASTEXITCODE -ne 0) { throw "Could not create or access archive directory. $mkd" }
              $archiveBefore = @($archiveRetry | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ })
            }
          }

          $collisions = @($old | Where-Object { $archiveBefore -contains $_ })
          if ($collisions.Count -gt 0) { throw "Archive name collision; no moves started: $($collisions -join ', ')" }

          foreach ($name in $old) {
            # GoldHEN FTP requires explicit CWD steps before RNFR/RNTO.
            $move = & curl.exe --fail --silent --show-error --ftp-pasv --user $creds --quote "CWD data" --quote "CWD pkg" --quote "RNFR $name" --quote "RNTO old_versions/$name" $hostUrl 2>&1
            if ($LASTEXITCODE -ne 0) { throw "FTP rename failed for $name. $move" }
            Write-Host "ARCHIVED=$name"
          }

          $rootAfter = @(Get-FtpNames $base)
          $archiveAfter = @(Get-FtpNames $archive)
          $neuralRemaining = @($rootAfter | Where-Object { $_ -match '^PS4-Neural-Engine-.*[.]pkg$' })
          if ($neuralRemaining.Count -ne 1 -or $neuralRemaining[0] -ne $keep) {
            throw "Neural Engine root verification failed: $($neuralRemaining -join ', ')"
          }
          foreach ($name in $preservedOther) {
            if ($rootAfter -notcontains $name) { throw "Non-Neural Engine package unexpectedly moved or removed: $name" }
          }
          foreach ($name in $old) {
            if ($archiveAfter -notcontains $name) { throw "Archive verification failed; missing $name" }
          }
          if ($archiveAfter.Count -ne ($archiveBefore.Count + $old.Count)) {
            throw "Archive count mismatch. Before=$($archiveBefore.Count) After=$($archiveAfter.Count) Moved=$($old.Count)"
          }

          Write-Host "ORGANIZATION_SUCCESS=true"
          Write-Host "ROOT_NEURAL_ENGINE_ONLY=$keep"
          Write-Host "ARCHIVE_PATH=/data/pkg/old_versions/"
          Write-Host "ARCHIVED_COUNT=$($old.Count)"
          Write-Host "PRESERVED_NON_NEURAL_COUNT=$($preservedOther.Count)"
          Write-Host "ARCHIVE_TOTAL=$($archiveAfter.Count)"
          Write-Host "FINAL_ROOT=$($rootAfter -join ', ')"
