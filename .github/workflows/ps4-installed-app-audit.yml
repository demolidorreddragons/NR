name: PS4 Read-Only Installed Neural Engine Metadata Audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ps4-installed-app-audit.yml"
permissions:
  contents: read
jobs:
  inspect-installed-app:
    runs-on: [self-hosted, Windows, X64, ps4-lan]
    steps:
      - name: Read installed app metadata without modifying console
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          PS4_IP: ${{ vars.PS4_IP }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:PS4_IP) { throw "PS4_IP variable missing." }
          $base = "ftp://$($env:PS4_IP):2121/"
          $creds = "anonymous:anonymous@example.com"
          $appPath = "user/app/PNEU00001/"
          $appUrl = $base + $appPath
          $listing = & curl.exe --fail --silent --show-error --ftp-pasv --user $creds $appUrl 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Cannot read installed TITLE_ID directory /$appPath. $listing" }
          $listing | ForEach-Object { Write-Host "INSTALLED_APP_ENTRY=$([string]$_)" }

          New-Item -ItemType Directory -Force -Path "audit-output" | Out-Null
          foreach ($name in @("app.json", "app.xml", "app.pkg")) {
            $destination = Join-Path (Resolve-Path "audit-output").Path $name
            $url = $appUrl + $name
            $download = & curl.exe --fail --silent --show-error --ftp-pasv --user $creds --output $destination $url 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Could not retrieve $name from /$appPath. $download" }
            $bytes = (Get-Item -LiteralPath $destination).Length
            $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "INSTALLED_FILE=$name BYTES=$bytes SHA256=$hash"
          }
          @(
            "READ_ONLY_AUDIT=PASS"
            "FTP_PATH=/$appPath"
            "FILES=app.json,app.xml,app.pkg"
            "NO_CONSOLE_FILES_WRITTEN=true"
          ) | Set-Content -LiteralPath "audit-output/audit-report.txt" -Encoding UTF8
      - name: Retain read-only metadata evidence
        uses: actions/upload-artifact@v4
        with:
          name: PS4-installed-Neural-Engine-metadata-audit
          path: audit-output/*
          if-no-files-found: error
          retention-days: 7
