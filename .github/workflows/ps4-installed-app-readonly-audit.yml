name: PS4 installed Neural Engine read-only audit
on:
  workflow_run:
    workflows: ["PS4 Control Plane Preflight"]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: read
concurrency:
  group: ps4-installed-app-readonly-audit
  cancel-in-progress: true
jobs:
  inspect:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64, ps4-lan]
    timeout-minutes: 15
    steps:
      - name: Read installed app metadata and executable identity over FTP
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          PS4_IP: ${{ vars.PS4_IP }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:PS4_IP) { throw "PS4_IP variable missing." }
          $base = "ftp://$($env:PS4_IP):2121/user/app/PNEU00001/"
          $creds = "anonymous:anonymous@example.com"
          $capture = Join-Path $env:RUNNER_TEMP "pne-installed-app-capture"
          New-Item -ItemType Directory -Force -Path $capture | Out-Null
          Write-Host "=== INSTALLED TITLE DIRECTORY ==="
          $listing = & curl.exe --fail --silent --show-error --ftp-pasv --user $creds $base 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Cannot list installed PNEU00001 directory." }
          $listing | ForEach-Object { Write-Host $_ }
          # Retrieve the exact installed base PKG using explicit FTP CWD steps.
          $installedPkg = Join-Path $capture "installed-app.pkg"
          $pkgLog = & curl.exe --fail --silent --show-error --ftp-pasv --user $creds --quote "CWD user" --quote "CWD app" --quote "CWD PNEU00001" --ftp-method nocwd --output $installedPkg "ftp://$($env:PS4_IP):2121/app.pkg" 2>&1
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $installedPkg)) {
            $pkgLog | ForEach-Object { Write-Host $_ }
            throw "Could not retrieve the exact installed app.pkg from /user/app/PNEU00001/."
          }
          $pkgItem = Get-Item -LiteralPath $installedPkg
          $pkgHash = (Get-FileHash -LiteralPath $installedPkg -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "INSTALLED_APP_PKG_BYTES=$($pkgItem.Length) SHA256=$pkgHash"
          foreach ($name in @("sce_sys/param.sfo","eboot.bin","ps4_neural_engine.prx")) {
            $local = Join-Path $env:RUNNER_TEMP ($name.Replace("/","_"))
            $url = $base + $name
            $out = & curl.exe --fail --silent --show-error --ftp-pasv --user $creds --output $local $url 2>&1
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $local)) {
              $item = Get-Item -LiteralPath $local
              $hash = (Get-FileHash -LiteralPath $local -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host "INSTALLED_FILE=$name BYTES=$($item.Length) SHA256=$hash"
              $destination = Join-Path $capture ($name.Replace("/","_"))
              Copy-Item -LiteralPath $local -Destination $destination -Force
              if ($name -eq "sce_sys/param.sfo") {
                $bytes = [IO.File]::ReadAllBytes($local)
                Write-Host "PARAM_SFO_HEX=$([BitConverter]::ToString($bytes))"
              }
            } else {
              Write-Host "INSTALLED_FILE_UNAVAILABLE=$name"
              $out | ForEach-Object { Write-Host $_ }
            }
          }
          Write-Host "READ_ONLY=true"
          Write-Host "NO_FILES_WRITTEN_OR_DELETED=true"

      - name: Preserve read-only installed-app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-app-files-readonly
          path: ${{ runner.temp }}/pne-installed-app-capture/*
          if-no-files-found: warn
          retention-days: 3
