name: PS4 RPI read-only readiness probe

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["PS4 Control Plane Preflight"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  rpi-readiness:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64, ps4-lan]
    timeout-minutes: 10
    steps:
      - name: Fetch exact reviewed RPI probe through GitHub API
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_SHA -notmatch '^[a-f0-9]{40}$') { throw "Invalid pinned source SHA." }
          $uri = "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/contents/tools/ps4-rpi-readiness-probe.ps1?ref=$($env:GITHUB_SHA)"
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $response = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
          if ($response.type -ne "file" -or $response.encoding -ne "base64" -or $response.sha -notmatch '^[a-f0-9]{40}$') { throw "GitHub API did not return a pinned file blob." }
          $bytes = [Convert]::FromBase64String(($response.content -replace '\s',''))
          $header = [Text.Encoding]::UTF8.GetBytes("blob " + $bytes.Length + [char]0)
          $blob = New-Object byte[] ($header.Length + $bytes.Length)
          [Array]::Copy($header,0,$blob,0,$header.Length)
          [Array]::Copy($bytes,0,$blob,$header.Length,$bytes.Length)
          $sha1 = [Security.Cryptography.SHA1]::Create()
          try { $actual = ([BitConverter]::ToString($sha1.ComputeHash($blob))).Replace("-","").ToLowerInvariant() } finally { $sha1.Dispose() }
          if ($actual -ne $response.sha) { throw "RPI probe Git blob SHA-1 mismatch." }
          $scriptPath = Join-Path $env:RUNNER_TEMP "ps4-rpi-readiness-probe.ps1"
          $stream = [IO.File]::Open($scriptPath,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
          try { $stream.Write($bytes,0,$bytes.Length); $stream.Flush($true) } finally { $stream.Dispose() }
          Write-Host "RPI_PROBE_SCRIPT_BLOB_SHA=$actual"

      - name: Collect read-only RPI readiness evidence
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          PS4_IP: ${{ vars.PS4_IP }}
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          & (Join-Path $env:RUNNER_TEMP "ps4-rpi-readiness-probe.ps1")

      - name: Preserve read-only RPI evidence
        uses: actions/upload-artifact@v4
        with:
          name: ps4-rpi-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}\nr-rpi-readiness-${{ github.run_id }}\*
          if-no-files-found: error
          retention-days: 7
