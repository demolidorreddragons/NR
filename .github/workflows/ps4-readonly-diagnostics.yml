name: PS4 Neural Engine PRX Deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ps4-readonly-diagnostics.yml"

permissions:
  actions: read
  contents: read

jobs:
  deploy-prx:
    runs-on: [self-hosted, Windows, X64, ps4-lan]
    steps:
      - name: Download the QA-validated build artifact
        uses: actions/download-artifact@v4
        with:
          name: ps4-neural-engine-build
          path: transfer
          repository: demolidorreddragons/NR
          run-id: 44623808730
          github-token: ${{ github.token }}

      - name: Deploy PRX with backup, registration and remote verification
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          PS4_IP: ${{ vars.PS4_IP }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:PS4_IP) { throw "PS4_IP variable is missing." }
          $credentials = New-Object System.Net.NetworkCredential("anonymous", "anonymous@example.com")
          $outer = Join-Path $env:GITHUB_WORKSPACE "transfer/goldhen/PS4-Neural-Engine-GoldHEN.zip"
          if (-not (Test-Path -LiteralPath $outer)) { throw "GoldHEN plugin archive missing from build artifact." }

          $extract = Join-Path $env:RUNNER_TEMP "pne-prx-deploy"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Expand-Archive -LiteralPath $outer -DestinationPath $extract -Force
          $prx = Join-Path $extract "ps4_neural_engine.prx"
          if (-not (Test-Path $prx)) { throw "PRX not found in validated archive." }
          $localSize = (Get-Item $prx).Length
          $localHash = (Get-FileHash $prx -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($localSize -ne 206528 -or $localHash -ne "531e41aa3f4535e6004d47900f636d6e2a4b1ce2b2709f165db77ebef7e0a3f0") {
            throw "PRX does not match the QA-reviewed build. Size=$localSize SHA256=$localHash"
          }

          function New-FtpRequest([string]$path, [string]$method) {
            $r = [System.Net.FtpWebRequest]::Create("ftp://$($env:PS4_IP):2121$path")
            $r.Method = $method
            $r.Credentials = $credentials
            $r.UsePassive = $true
            $r.UseBinary = $true
            $r.KeepAlive = $false
            $r.Timeout = 60000
            $r.ReadWriteTimeout = 60000
            return $r
          }
          function Test-FtpFile([string]$path) {
            try {
              $r = New-FtpRequest $path ([System.Net.WebRequestMethods+Ftp]::GetFileSize)
              $x = $r.GetResponse()
              try { return $true } finally { $x.Dispose() }
            } catch { return $false }
          }
          function Upload-Ftp([string]$local, [string]$remote) {
            $r = New-FtpRequest $remote ([System.Net.WebRequestMethods+Ftp]::UploadFile)
            $input = [System.IO.File]::OpenRead($local)
            $output = $null
            $response = $null
            try {
              $r.ContentLength = $input.Length
              $output = $r.GetRequestStream()
              $input.CopyTo($output)
              $output.Dispose(); $output = $null
              $response = $r.GetResponse()
            } finally {
              $input.Dispose()
              if ($output) { $output.Dispose() }
              if ($response) { $response.Dispose() }
            }
          }
          function Download-Ftp([string]$remote, [string]$local) {
            $r = New-FtpRequest $remote ([System.Net.WebRequestMethods+Ftp]::DownloadFile)
            $response = $r.GetResponse()
            $stream = $response.GetResponseStream()
            $output = [System.IO.File]::Create($local)
            try { $stream.CopyTo($output) } finally { $output.Dispose(); $stream.Dispose(); $response.Dispose() }
          }
          function Rename-Ftp([string]$from, [string]$to) {
            $r = New-FtpRequest $from ([System.Net.WebRequestMethods+Ftp]::Rename)
            $r.RenameTo = $to
            $x = $r.GetResponse()
            $x.Dispose()
          }

          $pluginPath = "/data/GoldHEN/plugins/ps4_neural_engine.prx"
          $stagedPath = "/data/GoldHEN/plugins/ps4_neural_engine.prx.new"
          $backupPath = "/data/GoldHEN/plugins/ps4_neural_engine.prx.predeploy.bak"
          $localVerify = Join-Path $env:RUNNER_TEMP "pne-prx-remote-verify.prx"
          Upload-Ftp $prx $stagedPath
          Download-Ftp $stagedPath $localVerify
          $stagedHash = (Get-FileHash $localVerify -Algorithm SHA256).Hash.ToLowerInvariant()
          $stagedSize = (Get-Item $localVerify).Length
          if ($stagedSize -ne $localSize -or $stagedHash -ne $localHash) { throw "Staged PRX failed remote hash verification." }

          if (Test-FtpFile $pluginPath) {
            if (Test-FtpFile $backupPath) { throw "A prior backup already exists; refusing to overwrite it." }
            Rename-Ftp $pluginPath $backupPath
            Write-Host "Existing PRX preserved as $backupPath"
          }
          Rename-Ftp $stagedPath $pluginPath
          Download-Ftp $pluginPath $localVerify
          $finalHash = (Get-FileHash $localVerify -Algorithm SHA256).Hash.ToLowerInvariant()
          $finalSize = (Get-Item $localVerify).Length
          if ($finalSize -ne $localSize -or $finalHash -ne $localHash) { throw "Final PRX verification failed." }
          Write-Host "PRX_DEPLOYED path=$pluginPath size=$finalSize sha256=$finalHash"

          $iniPath = "/data/GoldHEN/plugins.ini"
          $iniLocal = Join-Path $env:RUNNER_TEMP "plugins.ini"
          $iniNewLocal = Join-Path $env:RUNNER_TEMP "plugins.ini.new"
          $iniBackup = "/data/GoldHEN/plugins.ini.predeploy.bak"
          $entry = "/data/GoldHEN/plugins/ps4_neural_engine.prx"
          if (Test-FtpFile $iniPath) {
            Download-Ftp $iniPath $iniLocal
            $iniText = [System.IO.File]::ReadAllText($iniLocal)
            if ($iniText -match "(?m)^\s*\[PNEU00001\]\s*$") {
              if ($iniText -notmatch [regex]::Escape($entry)) {
                $iniText = $iniText.TrimEnd() + "`r`n" + $entry + "`r`n"
              }
            } else {
              $iniText = $iniText.TrimEnd() + "`r`n`r`n[PNEU00001]`r`n" + $entry + "`r`n"
            }
            [System.IO.File]::WriteAllText($iniNewLocal, $iniText, [System.Text.UTF8Encoding]::new($false))
            Upload-Ftp $iniNewLocal ($iniPath + ".new")
            $iniVerify = Join-Path $env:RUNNER_TEMP "plugins.ini.verify"
            Download-Ftp ($iniPath + ".new") $iniVerify
            if ((Get-FileHash $iniNewLocal -Algorithm SHA256).Hash -ne (Get-FileHash $iniVerify -Algorithm SHA256).Hash) {
              throw "Staged plugins.ini failed verification."
            }
            if (Test-FtpFile $iniBackup) { throw "A prior plugins.ini backup exists; refusing to overwrite it." }
            Rename-Ftp $iniPath $iniBackup
            Rename-Ftp ($iniPath + ".new") $iniPath
            Write-Host "Existing plugins.ini backed up to $iniBackup and updated."
          } else {
            $iniText = "; Neural Engine plugin registration`r`n[PNEU00001]`r`n$entry`r`n"
            [System.IO.File]::WriteAllText($iniNewLocal, $iniText, [System.Text.UTF8Encoding]::new($false))
            Upload-Ftp $iniNewLocal ($iniPath + ".new")
            $iniVerify = Join-Path $env:RUNNER_TEMP "plugins.ini.verify"
            Download-Ftp ($iniPath + ".new") $iniVerify
            if ((Get-FileHash $iniNewLocal -Algorithm SHA256).Hash -ne (Get-FileHash $iniVerify -Algorithm SHA256).Hash) {
              throw "New plugins.ini failed remote verification."
            }
            Rename-Ftp ($iniPath + ".new") $iniPath
            Write-Host "Created plugins.ini with a title-specific PNEU00001 registration."
          }

          Download-Ftp $iniPath $iniVerify
          $finalIni = [System.IO.File]::ReadAllText($iniVerify)
          if ($finalIni -notmatch "(?m)^\s*\[PNEU00001\]\s*$" -or $finalIni -notmatch [regex]::Escape($entry)) {
            throw "Final plugin registration is missing."
          }
          Write-Host "PLUGIN_REGISTRATION_VERIFIED title=PNEU00001"
          Write-Host "Deployment complete. No application data or savedata paths were accessed."
