name: PS4 post-launch read-only diagnostics

on:
  workflow_dispatch:
  push:
    branches: [feature/gcn8-numeric-kernels]
    paths:
      - ".github/workflows/ps4-postlaunch-readonly-diagnostics.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: [self-hosted, Windows, X64, ps4-lan]
    timeout-minutes: 10
    steps:
      - name: Collect current app, system logs and crash dumps without modifying PS4
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          PS4_IP: ${{ vars.PS4_IP }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:PS4_IP) { throw "PS4_IP Actions variable is missing." }
          $base = "ftp://$($env:PS4_IP):2121"
          $credentials = New-Object System.Net.NetworkCredential("anonymous", "anonymous@example.com")
          $out = Join-Path $env:RUNNER_TEMP "pne-postlaunch-diagnostics"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          function New-Request([string]$path, [string]$method) {
            $r = [System.Net.FtpWebRequest]::Create("$base$path")
            $r.Method = $method
            $r.Credentials = $credentials
            $r.UsePassive = $true
            $r.UseBinary = $true
            $r.KeepAlive = $false
            $r.Timeout = 60000
            $r.ReadWriteTimeout = 60000
            return $r
          }
          function Get-Names([string]$path) {
            $r = New-Request $path ([System.Net.WebRequestMethods+Ftp]::ListDirectory)
            $response = $r.GetResponse()
            try {
              $reader = New-Object System.IO.StreamReader($response.GetResponseStream())
              try {
                $items = @()
                while (-not $reader.EndOfStream) {
                  $line = $reader.ReadLine()
                  if ($line -and $line -notin @(".", "..")) { $items += $line.Trim() }
                }
                return $items
              } finally { $reader.Dispose() }
            } finally { $response.Dispose() }
          }
          function Save-Remote([string]$remote, [string]$local) {
            $r = New-Request $remote ([System.Net.WebRequestMethods+Ftp]::DownloadFile)
            $response = $r.GetResponse()
            try {
              $input = $response.GetResponseStream()
              $file = [System.IO.File]::Create($local)
              try { $input.CopyTo($file) } finally { $file.Dispose(); $input.Dispose() }
            } finally { $response.Dispose() }
            $item = Get-Item -LiteralPath $local
            $hash = (Get-FileHash -LiteralPath $local -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "DOWNLOADED path=$remote bytes=$($item.Length) sha256=$hash"
            if ([IO.Path]::GetExtension($local) -in @(".log",".txt",".ini",".json",".xml")) {
              Write-Host "===== BEGIN $remote ====="
              Get-Content -LiteralPath $local -Raw | Write-Host
              Write-Host "===== END $remote ====="
            }
          }
          function Save-Directory([string]$remoteDir, [string]$label, [int]$depth = 0) {
            $safe = $label -replace '[^A-Za-z0-9_.-]','_'
            $listingPath = Join-Path $out "$safe.listing.txt"
            try {
              $names = @(Get-Names $remoteDir)
              $names | Set-Content -LiteralPath $listingPath
              Write-Host "DIRECTORY_OK path=$remoteDir entries=$($names.Count)"
              foreach ($name in $names) { Write-Host "ENTRY=$remoteDir$name" }
              if ($depth -lt 2) {
                foreach ($name in $names) {
                  if ($name -match '[/\\]' -or [string]::IsNullOrWhiteSpace($name)) { continue }
                  $child = "$remoteDir$name"
                  $local = Join-Path $out (($safe + "_" + $name) -replace '[^A-Za-z0-9_.-]','_')
                  try { Save-Remote $child $local }
                  catch {
                    try { Save-Directory ($child.TrimEnd('/') + "/") ($safe + "_" + $name) ($depth + 1) }
                    catch { Write-Host "ENTRY_UNREADABLE path=$child detail=$($_.Exception.Message)" }
                  }
                }
              }
            } catch {
              "LIST_ERROR=$($_.Exception.Message)" | Set-Content -LiteralPath $listingPath
              Write-Host "DIRECTORY_UNAVAILABLE path=$remoteDir detail=$($_.Exception.Message)"
            }
          }

          Write-Host "DIAGNOSTIC_TIME_UTC=$([DateTime]::UtcNow.ToString('o'))"
          Write-Host "PS4_ENDPOINT=$($env:PS4_IP):2121"
          foreach ($dir in @(
            "/data/pkg/",
            "/data/GoldHEN/",
            "/data/GoldHEN/plugins/",
            "/data/sce_coredumps/",
            "/data/sce_logs/",
            "/user/app/PNEU00004/",
            "/user/data/"
          )) {
            $label = $dir.Trim('/') -replace '/', '_'
            Save-Directory $dir $label
          }
          foreach ($remote in @(
            "/data/pne_gcn8_compute_smoke_45040217180.log",
            "/data/pne_gcn8_compute_smoke_44876293567.log",
            "/data/GoldHEN/ps4_neural_engine_install.log",
            "/data/GoldHEN/plugins.ini",
            "/data/GoldHEN/config.ini",
            "/data/sce_logs/log.bin",
            "/data/install.log",
            "/data/pkg/install.log",
            "/user/app/PNEU00004/app.json",
            "/user/app/PNEU00004/app.xml",
            "/user/app/PNEU00004/param.sfo",
            "/user/app/PNEU00004/sce_sys/param.sfo"
          )) {
            $name = ($remote.Trim('/') -replace '[\\/]','_')
            $local = Join-Path $out $name
            if (-not (Test-Path -LiteralPath $local)) {
              try { Save-Remote $remote $local }
              catch { Write-Host "FILE_UNAVAILABLE path=$remote detail=$($_.Exception.Message)" }
            }
          }
          $manifest = Get-ChildItem -LiteralPath $out -File | ForEach-Object {
            "$($_.Name)|$($_.Length)|$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
          }
          $manifest | Set-Content -LiteralPath (Join-Path $out "SHA256SUMS.txt")
          Write-Host "READ_ONLY_COLLECTION_COMPLETE files=$((Get-ChildItem -LiteralPath $out -File).Count)"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps4-postlaunch-readonly-diagnostics
          path: ${{ runner.temp }}/pne-postlaunch-diagnostics/
          if-no-files-found: warn
          retention-days: 14
