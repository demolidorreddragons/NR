name: Stage validated Neural Rendering Full Base PKG on PS4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-neural-rendering-hybrid.yml

permissions:
  actions: read
  contents: read

jobs:
  stage-full:
    runs-on: [self-hosted, Windows, X64, ps4-lan]
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ps4-neural-engine-build
          path: transfer
          repository: demolidorreddragons/NR
          run-id: 44859652486
          github-token: ${{ github.token }}

      - name: Download independent QA report
        uses: actions/download-artifact@v4
        with:
          name: PS4-Neural-Engine-independent-QA
          path: qa
          repository: demolidorreddragons/NR
          run-id: 44859652486
          github-token: ${{ github.token }}

      - name: Validate and stage Full Base PKG
        shell: powershell
        env:
          PS4_IP: ${{ vars.PS4_IP }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PS4_IP)) { throw 'PS4_IP is missing.' }

          $report = Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\qa" -Recurse -File -Filter 'qa-report.txt' | Select-Object -First 1
          if (-not $report) { throw 'QA report not found.' }
          $qa = Get-Content -LiteralPath $report.FullName -Raw
          foreach ($entry in @('PKG_KIND=FULL_BASE_APPLICATION_NOT_PATCH','PARAM_SFO_SEMANTIC_FIELDS=PASS','CATEGORY=gde','QA_STATUS=PASS_PC_ONLY_NOT_HARDWARE_TESTED')) {
            if (-not $qa.Contains($entry)) { throw "QA evidence missing: $entry" }
          }
          $sm = [regex]::Match($qa, '(?m)^PKG_BYTES=([0-9]+)\r?$')
          $hm = [regex]::Match($qa, '(?m)^PKG_SHA256=([0-9a-f]{64})\r?$')
          if (-not $sm.Success -or -not $hm.Success) { throw 'Invalid QA size/hash.' }
          $expectedBytes = [long]$sm.Groups[1].Value
          $expectedHash = $hm.Groups[1].Value

          $pkgs = @(Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\transfer" -Recurse -File | Where-Object { $_.Name -match '^PS4-Neural-Engine-[0-9]+\.pkg$' })
          if ($pkgs.Count -ne 1) { throw "Expected one Full/Base PKG; found $($pkgs.Count)." }
          $pkg = $pkgs[0].FullName
          $localBytes = (Get-Item -LiteralPath $pkg).Length
          $localHash = (Get-FileHash -LiteralPath $pkg -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($localBytes -ne $expectedBytes -or $localHash -ne $expectedHash) { throw 'PKG does not match independent QA.' }

          $release = [regex]::Match((Split-Path $pkg -Leaf), '^PS4-Neural-Engine-([0-9]+)\.pkg$').Groups[1].Value
          $remoteName = "PS4-Neural-Engine-$release-HYBRID.pkg"
          $credential = New-Object System.Net.NetworkCredential('anonymous','anonymous@example.com')
          function Ftp([string]$path,[string]$method,[string]$renameTo = '') {
            $r = [System.Net.FtpWebRequest]::Create("ftp://$($env:PS4_IP):2121$path")
            $r.Method = $method
            $r.Credentials = $credential
            $r.UsePassive = $true
            $r.UseBinary = $true
            $r.KeepAlive = $false
            $r.Timeout = 120000
            $r.ReadWriteTimeout = 120000
            if ($renameTo) { $r.RenameTo = $renameTo }
            return $r
          }
          function Names([string]$path) {
            $r = Ftp $path ([System.Net.WebRequestMethods+Ftp]::ListDirectory)
            $s = $r.GetResponse()
            $reader = New-Object IO.StreamReader($s.GetResponseStream())
            try { return @($reader.ReadToEnd() -split "\r?\n" | Where-Object { $_ }) }
            finally { $reader.Dispose(); $s.Dispose() }
          }
          function Move([string]$from,[string]$to) {
            $r = Ftp $from ([System.Net.WebRequestMethods+Ftp]::Rename) $to
            $s = $r.GetResponse()
            $s.Dispose()
          }

          # Upload and verify outside /data/pkg before moving any existing package.
          $staging = "/data/$remoteName.uploading"
          $up = Ftp $staging ([System.Net.WebRequestMethods+Ftp]::UploadFile)
          $up.ContentLength = $localBytes
          $out = $up.GetRequestStream()
          $src = [IO.File]::OpenRead($pkg)
          try { $src.CopyTo($out) } finally { $src.Dispose(); $out.Dispose() }
          $s = $up.GetResponse()
          $s.Dispose()

          $readback = Join-Path $env:RUNNER_TEMP 'pne-stage-readback.pkg'
          $get = Ftp $staging ([System.Net.WebRequestMethods+Ftp]::DownloadFile)
          $s = $get.GetResponse()
          $net = $s.GetResponseStream()
          $file = [IO.File]::Create($readback)
          try { $net.CopyTo($file) } finally { $file.Dispose(); $net.Dispose(); $s.Dispose() }
          $remoteBytes = (Get-Item -LiteralPath $readback).Length
          $remoteHash = (Get-FileHash -LiteralPath $readback -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($remoteBytes -ne $expectedBytes -or $remoteHash -ne $expectedHash) { throw 'Staging read-back does not match QA.' }

          # Archive only NR PKGs in the root; preserve everything else and existing archive contents.
          $old = @(Names '/data/pkg' | Where-Object { $_ -match '(?i)^PS4-Neural-Engine.*\.pkg$' })
          foreach ($name in $old) {
            $dest = $name
            if ((Names '/data/pkg/old') -contains $dest) {
              $base = [IO.Path]::GetFileNameWithoutExtension($name)
              $ext = [IO.Path]::GetExtension($name)
              $dest = "$base-archived-$([DateTime]::UtcNow.ToString('yyyyMMddHHmmssfff'))$ext"
            }
            Move "/data/pkg/$name" "old/$dest"
            Write-Host "ARCHIVED=$name -> old/$dest"
          }
          Move $staging "pkg/$remoteName"

          $final = @(Names '/data/pkg')
          $nr = @($final | Where-Object { $_ -match '(?i)^PS4-Neural-Engine.*\.pkg$' })
          if ($nr.Count -ne 1 -or $nr[0] -ne $remoteName) { throw 'Unexpected Neural Rendering PKG set at PS4 root.' }

          $finalReadback = Join-Path $env:RUNNER_TEMP 'pne-final-readback.pkg'
          $get = Ftp "/data/pkg/$remoteName" ([System.Net.WebRequestMethods+Ftp]::DownloadFile)
          $s = $get.GetResponse()
          $net = $s.GetResponseStream()
          $file = [IO.File]::Create($finalReadback)
          try { $net.CopyTo($file) } finally { $file.Dispose(); $net.Dispose(); $s.Dispose() }
          $finalBytes = (Get-Item -LiteralPath $finalReadback).Length
          $finalHash = (Get-FileHash -LiteralPath $finalReadback -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($finalBytes -ne $expectedBytes -or $finalHash -ne $expectedHash) { throw 'Final PS4 read-back does not match QA.' }

          Write-Host 'PS4_FULL_STAGING=SUCCESS'
          Write-Host "PS4_PATH=/data/pkg/$remoteName"
          Write-Host "BYTES=$finalBytes"
          Write-Host "SHA256=$finalHash"
          Write-Host 'PACKAGE_TYPE=FULL_BASE_APPLICATION_CATEGORY_GDE'
          Write-Host 'INSTALLATION=NOT_PERFORMED'
