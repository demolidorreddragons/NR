name: PS4 Control Plane Bootstrap Snapshot

on:
  push:
    branches: [main]
    paths: [".github/workflows/ps4-control-plane-bootstrap-snapshot.yml"]

permissions:
  contents: read
  actions: read

jobs:
  bootstrap-snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, ps4-lan]
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed default-branch collector
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Collect initial read-only PS4 control-plane inventory
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          PS4_IP: ${{ vars.PS4_IP }}
          BUILD_RUN_ID: bootstrap
          BUILD_HEAD_SHA: ${{ github.sha }}
          BUILD_BRANCH: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          & "$env:GITHUB_WORKSPACE\tools\ps4-control-plane-preflight.ps1"

      - name: Preserve bootstrap evidence
        uses: actions/upload-artifact@v4
        with:
          name: ps4-control-plane-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/nr-control-plane-preflight-${{ github.run_id }}/*
          if-no-files-found: error
          retention-days: 30
