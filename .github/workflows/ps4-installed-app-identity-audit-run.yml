name: PS4 Installed App Identity Audit Run

on:
  push:
    branches: [automation/installed-app-identity-audit-run]
    paths: [".github/workflows/ps4-installed-app-identity-audit-run.yml"]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: [self-hosted, Windows, X64, ps4-lan]
    timeout-minutes: 10
    steps:
      - name: Read installed app and package identity over FTP without mutation
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          PS4_IP: ${{ vars.PS4_IP }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:PS4_IP) { throw "PS4_IP variable missing." }
          $base = "ftp://$($env:PS4_IP):2121"
          $creds = "anonymous:anonymous@example.com"
          $capture = Join-Path $env:RUNNER_TEMP "pne-installed-app-capture-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $capture -ErrorAction Stop | Out-Null

          function Get-RemoteFile([string]$remotePath, [string]$localName, [bool]$required = $false) {
            $local = Join-Path $capture $localName
            $url = $base + $remotePath
            $previousPreference = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            try {
              $out = & curl.exe --fail --silent --show-error --ftp-pasv --ftp-method nocwd --user $creds --output $local $url 2>&1
              $code = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $previousPreference
            }
            if ($code -ne 0 -or -not (Test-Path -LiteralPath $local)) {
              if (Test-Path -LiteralPath $local) { Remove-Item -LiteralPath $local -Force }
              Write-Host "REMOTE_FILE_UNAVAILABLE path=$remotePath exit=$code"
              $out | ForEach-Object { Write-Host $_ }
              if ($required) { throw "Required read-only file unavailable: $remotePath" }
              return $null
            }
            $item = Get-Item -LiteralPath $local
            $hash = (Get-FileHash -LiteralPath $local -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "REMOTE_FILE_READBACK path=$remotePath bytes=$($item.Length) sha256=$hash"
            return $local
          }

          $previousPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          try {
            $listing = & curl.exe --fail --silent --show-error --ftp-pasv --ftp-method nocwd --user $creds ($base + "/user/app/PNEU00001/") 2>&1
            $listingExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousPreference
          }
          if ($listingExit -ne 0) { throw "Cannot list installed PNEU00001 directory." }
          $listing | ForEach-Object { Write-Host $_ }

          $installedPkg = Get-RemoteFile "/user/app/PNEU00001/app.pkg" "installed-app.pkg" $true
          $appJsonPath = Get-RemoteFile "/user/app/PNEU00001/app.json" "installed-app.json" $true
          $appXmlPath = Get-RemoteFile "/user/app/PNEU00001/app.xml" "installed-app.xml"
          $ebootPath = Get-RemoteFile "/user/app/PNEU00001/eboot.bin" "installed-eboot.bin"
          $prxPath = Get-RemoteFile "/user/app/PNEU00001/ps4_neural_engine.prx" "installed-app-prx.bin"
          $sourcePkg = Get-RemoteFile "/user/data/pkg/PS4-Neural-Engine-015.pkg" "user-data-source-pkg015.pkg"
          $stagedPkg = Get-RemoteFile "/data/pkg/PS4-Neural-Engine-015-7609b5d2b536.pkg" "staged-pkg015.pkg"

          $installedHash = (Get-FileHash -LiteralPath $installedPkg -Algorithm SHA256).Hash.ToLowerInvariant()
          $installedBytes = (Get-Item -LiteralPath $installedPkg).Length
          $appJson = Get-Content -LiteralPath $appJsonPath -Raw | ConvertFrom-Json
          $packageDigest = [string]$appJson.packageDigest
          $piecesUrl = [string]$appJson.pieces[0].url
          $digestMatch = $packageDigest -and ($packageDigest.ToLowerInvariant() -eq $installedHash)
          $report = Join-Path $capture "installed-app-identity-report.txt"
          @(
            "TITLE_ID=PNEU00001"
            "INSTALLED_APP_PKG_BYTES=$installedBytes"
            "INSTALLED_APP_PKG_SHA256=$installedHash"
            "APP_JSON_PACKAGE_DIGEST=$packageDigest"
            "APP_JSON_PACKAGE_DIGEST_EQUALS_APP_PKG_SHA256=$digestMatch"
            "APP_JSON_SOURCE_PKG_PATH=$piecesUrl"
          ) | Out-File -LiteralPath $report -Encoding utf8

          if ($sourcePkg) {
            $sourceHash = (Get-FileHash -LiteralPath $sourcePkg -Algorithm SHA256).Hash.ToLowerInvariant()
            $sourceBytes = (Get-Item -LiteralPath $sourcePkg).Length
            "USER_DATA_SOURCE_PKG015_BYTES=$sourceBytes" | Out-File -LiteralPath $report -Append -Encoding utf8
            "USER_DATA_SOURCE_PKG015_SHA256=$sourceHash" | Out-File -LiteralPath $report -Append -Encoding utf8
            "INSTALLED_MATCHES_USER_DATA_SOURCE=$($sourceHash -eq $installedHash)" | Out-File -LiteralPath $report -Append -Encoding utf8
          }
          if ($stagedPkg) {
            $stagedHash = (Get-FileHash -LiteralPath $stagedPkg -Algorithm SHA256).Hash.ToLowerInvariant()
            $stagedBytes = (Get-Item -LiteralPath $stagedPkg).Length
            "STAGED_PKG015_BYTES=$stagedBytes" | Out-File -LiteralPath $report -Append -Encoding utf8
            "STAGED_PKG015_SHA256=$stagedHash" | Out-File -LiteralPath $report -Append -Encoding utf8
            "INSTALLED_MATCHES_STAGED_PKG015=$($stagedHash -eq $installedHash)" | Out-File -LiteralPath $report -Append -Encoding utf8
          }
          Get-Content -LiteralPath $report | ForEach-Object { Write-Host $_ }
          Write-Host "READ_ONLY=true"
          Write-Host "NO_FILES_WRITTEN_OR_DELETED_ON_PS4=true"

      - name: Preserve read-only installed-app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-app-files-readonly
          path: ${{ runner.temp }}/pne-installed-app-capture-${{ github.run_id }}/*
          if-no-files-found: warn
          retention-days: 30

  inspect:
    needs: audit
    runs-on: windows-latest
    steps:
      - name: Checkout pinned independent package inspector
        uses: actions/checkout@v4
        with:
          repository: pearlxcore/OrbisPkgTool
          ref: 3de6da849b64a8ad0d5ba00dd4e8919934b868b0
          path: OrbisPkgTool-src
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download read-only installed-app evidence from this run
        uses: actions/download-artifact@v4
        with:
          name: installed-app-files-readonly
          path: installed-audit

      - name: Build independent inspector
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet build OrbisPkgTool-src/OrbisPkgTool/OrbisPkgTool.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Independent inspector build failed." }
          $tool = "OrbisPkgTool-src/OrbisPkgTool/bin/Release/net10.0-windows/OrbisPkgTool.dll"
          if (-not (Test-Path $tool)) { throw "Independent inspector DLL missing." }
          "TOOL=$tool" | Out-File "$env:RUNNER_TEMP\installed-pkg-tool.txt"

      - name: Validate and extract installed and candidate packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tool = (Get-Content "$env:RUNNER_TEMP\installed-pkg-tool.txt" | Select-Object -First 1).Substring(5)
          New-Item -ItemType Directory -Force -Path audit-output | Out-Null
          $identity = Join-Path $env:GITHUB_WORKSPACE "installed-audit/installed-app-identity-report.txt"
          if (Test-Path -LiteralPath $identity) { Copy-Item -LiteralPath $identity -Destination "audit-output/installed-app-identity-report.txt" }

          foreach ($name in @("installed-app.pkg","user-data-source-pkg015.pkg","staged-pkg015.pkg")) {
            $pkg = Join-Path $env:GITHUB_WORKSPACE ("installed-audit/" + $name)
            if (-not (Test-Path -LiteralPath $pkg)) {
              "PACKAGE_UNAVAILABLE=$name" | Out-File "audit-output/package-inspection-report.txt" -Append -Encoding utf8
              continue
            }
            $size = (Get-Item -LiteralPath $pkg).Length
            $hash = (Get-FileHash -LiteralPath $pkg -Algorithm SHA256).Hash.ToLowerInvariant()
            "PACKAGE=$name BYTES=$size SHA256=$hash" | Out-File "audit-output/package-inspection-report.txt" -Append -Encoding utf8

            $validation = dotnet "$tool" validate "$pkg" 2>&1
            $validation | Out-File ("audit-output/" + $name + ".validation.txt") -Encoding utf8
            if ($LASTEXITCODE -ne 0) {
              "PACKAGE_VALIDATION=FAIL name=$name" | Out-File "audit-output/package-inspection-report.txt" -Append -Encoding utf8
              if ($name -eq "installed-app.pkg") { throw "Installed app.pkg failed independent validation." }
              continue
            }
            "PACKAGE_VALIDATION=PASS name=$name" | Out-File "audit-output/package-inspection-report.txt" -Append -Encoding utf8

            $out = Join-Path $env:RUNNER_TEMP ("installed-pkg-extract-" + [IO.Path]::GetFileNameWithoutExtension($name))
            dotnet "$tool" extract "$pkg" "$out" --verbose 2>&1 | Tee-Object ("audit-output/" + $name + ".extract.txt")
            if ($LASTEXITCODE -ne 0) {
              "PACKAGE_EXTRACTION=FAIL name=$name" | Out-File "audit-output/package-inspection-report.txt" -Append -Encoding utf8
              if ($name -eq "installed-app.pkg") { throw "Installed app.pkg extraction failed." }
              continue
            }
            $sfo = Get-ChildItem $out -Recurse -File -Filter param.sfo | Select-Object -First 1
            if (-not $sfo) {
              "PACKAGE_SFO=UNAVAILABLE name=$name" | Out-File "audit-output/package-inspection-report.txt" -Append -Encoding utf8
              continue
            }
            dotnet "$tool" sfo read "$($sfo.FullName)" 2>&1 | Tee-Object ("audit-output/" + $name + ".sfo.txt")
            if ($LASTEXITCODE -ne 0) { throw "SFO parsing failed for $name." }
            "PACKAGE_SFO=PASS name=$name" | Out-File "audit-output/package-inspection-report.txt" -Append -Encoding utf8
          }

          Get-Content "audit-output/package-inspection-report.txt" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Preserve independent package inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PS4-installed-Neural-Engine-package-inspection
          path: audit-output/*
          if-no-files-found: warn
          retention-days: 30
