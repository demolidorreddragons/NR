name: PS4 Stage QA-Approved Neural Engine Patch 003

on:
  workflow_run:
    workflows: ["PS4 Patch QA 003"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  stage-package:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64, ps4-lan]
    timeout-minutes: 15
    steps:
      - name: Download only the independently QA-approved package
        uses: actions/download-artifact@v4
        with:
          name: PS4-Neural-Engine-003-QA-APPROVED
          path: approved
          repository: demolidorreddragons/NR
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify QA report and exact package identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = Join-Path $env:GITHUB_WORKSPACE "approved/PS4-Neural-Engine-003-QA-APPROVED.pkg"
          $report = Join-Path $env:GITHUB_WORKSPACE "approved/qa-report.txt"
          if (-not (Test-Path -LiteralPath $pkg)) { throw "QA-approved PKG is missing." }
          if (-not (Test-Path -LiteralPath $report)) { throw "Independent QA report is missing." }
          $reportText = Get-Content -LiteralPath $report -Raw
          if ($reportText -notmatch "QA_STATUS=PASS_PC_ONLY_NOT_HARDWARE_TESTED") { throw "QA report does not contain the required independent PASS." }
          $expected = [regex]::Match($reportText, "CANDIDATE_PKG_SHA256=([A-Fa-f0-9]{64})").Groups[1].Value
          if (-not $expected) { throw "Candidate SHA-256 is missing from QA report." }
          $actual = (Get-FileHash -LiteralPath $pkg -Algorithm SHA256).Hash
          $size = (Get-Item -LiteralPath $pkg).Length
          if ($actual -ne $expected) { throw "QA-approved package hash mismatch: expected=$expected actual=$actual" }
          $name = "PS4-Neural-Engine-003-$($actual.Substring(0,12)).pkg"
          "PKG_PATH=$pkg" | Out-File "$env:RUNNER_TEMP\pne-stage-003.env"
          "PKG_NAME=$name" | Out-File "$env:RUNNER_TEMP\pne-stage-003.env" -Append
          "PKG_SIZE=$size" | Out-File "$env:RUNNER_TEMP\pne-stage-003.env" -Append
          "PKG_SHA256=$actual" | Out-File "$env:RUNNER_TEMP\pne-stage-003.env" -Append
          Write-Host "QA_APPROVED_IDENTITY_VERIFIED bytes=$size sha256=$actual"

      - name: Upload, read back, and archive only older Neural Engine PKGs
        shell: pwsh
        env:
          PS4_IP: ${{ vars.PS4_IP }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:PS4_IP) { throw "PS4_IP repository variable is missing." }
          $envLines = Get-Content "$env:RUNNER_TEMP\pne-stage-003.env"
          $pkg = ($envLines | Where-Object { $_ -like "PKG_PATH=*" } | Select-Object -First 1).Substring(9)
          $name = ($envLines | Where-Object { $_ -like "PKG_NAME=*" } | Select-Object -First 1).Substring(9)
          $size = [long](($envLines | Where-Object { $_ -like "PKG_SIZE=*" } | Select-Object -First 1).Substring(9))
          $hash = ($envLines | Where-Object { $_ -like "PKG_SHA256=*" } | Select-Object -First 1).Substring(11).ToLowerInvariant()
          $creds = "anonymous:anonymous@example.com"
          $hostUrl = "ftp://$($env:PS4_IP):2121/"
          $root = "/data/pkg/"
          $archive = "/data/pkg/old_versions/"
          $target = "ftp://$($env:PS4_IP):2121$root$name"

          function Get-FtpNames([string]$path) {
            $url = "ftp://$($env:PS4_IP):2121$path"
            $result = & curl.exe --fail --silent --show-error --ftp-pasv --list-only --user $creds $url 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Cannot list $path; refusing to change files. $result" }
            return @($result | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ })
          }

          $rootBefore = @(Get-FtpNames $root)
          if ($rootBefore -contains $name) { throw "Target already exists; refusing to overwrite: $name" }

          # Determine exactly which older Neural Engine packages would move.
          $oldNeural = @($rootBefore | Where-Object { $_ -match '^PS4-Neural-Engine-.*[.]pkg$' })
          $preservedOther = @($rootBefore | Where-Object { $_ -notmatch '^PS4-Neural-Engine-.*[.]pkg$' })

          # Prepare the archive and check every collision BEFORE uploading anything.
          $archiveBefore = @()
          $archiveUrl = "ftp://$($env:PS4_IP):2121$archive"
          $archiveListing = & curl.exe --fail --silent --show-error --ftp-pasv --list-only --user $creds $archiveUrl 2>&1
          if ($LASTEXITCODE -eq 0) {
            $archiveBefore = @($archiveListing | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ })
          } else {
            $mkd = & curl.exe --fail --silent --show-error --ftp-pasv --user $creds --quote "CWD data" --quote "CWD pkg" --quote "MKD old_versions" $hostUrl 2>&1
            if ($LASTEXITCODE -ne 0) {
              $retry = & curl.exe --fail --silent --show-error --ftp-pasv --list-only --user $creds $archiveUrl 2>&1
              if ($LASTEXITCODE -ne 0) { throw "Could not create or access /data/pkg/old_versions/. $mkd" }
              $archiveBefore = @($retry | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ })
            }
          }
          $collisions = @($oldNeural | Where-Object { $archiveBefore -contains $_ })
          if ($collisions.Count -gt 0) { throw "Archive name collision; no upload or old package moves started: $($collisions -join ', ')" }

          # Upload and verify byte-for-byte readback before moving any old packages.
          $upload = & curl.exe --fail --silent --show-error --ftp-pasv --user $creds --upload-file $pkg $target 2>&1
          if ($LASTEXITCODE -ne 0) { throw "FTP upload failed: $upload" }

          $readback = Join-Path $env:RUNNER_TEMP $name
          $download = & curl.exe --fail --silent --show-error --ftp-pasv --user $creds --output $readback $target 2>&1
          if ($LASTEXITCODE -ne 0) { throw "FTP readback failed: $download" }
          $remoteSize = (Get-Item -LiteralPath $readback).Length
          $remoteHash = (Get-FileHash -LiteralPath $readback -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($remoteSize -ne $size -or $remoteHash -ne $hash) {
            throw "Remote readback mismatch: expected_bytes=$size actual_bytes=$remoteSize expected_sha=$hash actual_sha=$remoteHash"
          }
          Write-Host "NEW_PKG_UPLOAD_AND_READBACK_VERIFIED path=$root$name bytes=$remoteSize sha256=$remoteHash"

          $rootAfterUpload = @(Get-FtpNames $root)
          if ($rootAfterUpload -notcontains $name) { throw "Uploaded package is not visible in /data/pkg/." }

          foreach ($oldName in $oldNeural) {
            $move = & curl.exe --fail --silent --show-error --ftp-pasv --user $creds --quote "CWD data" --quote "CWD pkg" --quote "RNFR $oldName" --quote "RNTO old_versions/$oldName" $hostUrl 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Could not archive older Neural Engine package $oldName. $move" }
            Write-Host "ARCHIVED_OLD_NEURAL_PKG=$oldName"
          }

          $rootFinal = @(Get-FtpNames $root)
          $archiveFinal = @(Get-FtpNames $archive)
          $neuralFinal = @($rootFinal | Where-Object { $_ -match '^PS4-Neural-Engine-.*[.]pkg$' })
          if ($neuralFinal.Count -ne 1 -or $neuralFinal[0] -ne $name) {
            throw "Root must contain exactly the new Neural Engine PKG; found: $($neuralFinal -join ', ')"
          }
          foreach ($other in $preservedOther) {
            if ($rootFinal -notcontains $other) { throw "Third-party package was unexpectedly moved or removed: $other" }
          }
          foreach ($oldName in $oldNeural) {
            if ($archiveFinal -notcontains $oldName) { throw "Archived package is missing from old_versions: $oldName" }
          }
          if ($archiveFinal.Count -ne ($archiveBefore.Count + $oldNeural.Count)) {
            throw "Archive count mismatch: before=$($archiveBefore.Count) after=$($archiveFinal.Count) moved=$($oldNeural.Count)"
          }

          Write-Host "STAGING_AND_READBACK_SUCCESS=true"
          Write-Host "NEW_PKG=/data/pkg/$name"
          Write-Host "NEW_PKG_BYTES=$remoteSize"
          Write-Host "NEW_PKG_SHA256=$remoteHash"
          Write-Host "ARCHIVE_PATH=/data/pkg/old_versions/"
          Write-Host "ARCHIVED_OLD_NEURAL_COUNT=$($oldNeural.Count)"
          Write-Host "PRESERVED_THIRD_PARTY_COUNT=$($preservedOther.Count)"
