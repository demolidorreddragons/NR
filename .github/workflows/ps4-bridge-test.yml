name: PS4 Windows Bridge Test

on:
  workflow_run:
    workflows: ["PS4 PRX and PKG build"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  ps4-connectivity:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, ps4-lan]

    steps:
      - name: Identify Windows runner
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          Write-Host "Runner: $env:COMPUTERNAME"
          whoami

      - name: Check PS4 FTP connection
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          PS4_IP: ${{ vars.PS4_IP }}
        run: |
          if (-not $env:PS4_IP) {
            throw "PS4_IP variable is missing."
          }

          Write-Host "Testing $env:PS4_IP on TCP port 2121"

          $connected = Test-NetConnection `
            -ComputerName $env:PS4_IP `
            -Port 2121 `
            -InformationLevel Quiet

          if (-not $connected) {
            throw "PS4 FTP port 2121 is unreachable."
          }

          Write-Host "SUCCESS: PS4 FTP port 2121 is reachable."

      - name: Authenticate and list PS4 FTP root
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          PS4_IP: ${{ vars.PS4_IP }}
        run: |
          $uri = "ftp://$($env:PS4_IP):2121/"
          $request = [System.Net.FtpWebRequest]::Create($uri)
          $request.Method = [System.Net.WebRequestMethods+Ftp]::ListDirectory
          $request.Credentials = New-Object System.Net.NetworkCredential("anonymous", "anonymous@example.com")
          $request.UsePassive = $true
          $request.UseBinary = $false
          $request.KeepAlive = $false
          $request.Timeout = 15000
          $request.ReadWriteTimeout = 15000

          $response = $null
          $reader = $null
          try {
            $response = [System.Net.FtpWebResponse]$request.GetResponse()
            $reader = New-Object System.IO.StreamReader($response.GetResponseStream())
            $entries = @()
            while (-not $reader.EndOfStream) {
              $line = $reader.ReadLine()
              if ($line) { $entries += $line }
            }

            Write-Host "FTP login and directory listing succeeded."
            Write-Host "Directory entries returned: $($entries.Count)"
            $entries | Select-Object -First 10 | ForEach-Object { Write-Host " - $_" }
            Write-Host "SUCCESS: PS4 FTP authentication and listing completed."
          }
          catch {
            Write-Host "FTP root listing failed: $($_.Exception.Message)"
            throw
          }
          finally {
            if ($reader) { $reader.Dispose() }
            if ($response) { $response.Dispose() }
          }

      - name: Inspect GoldHEN installation directory
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          PS4_IP: ${{ vars.PS4_IP }}
        run: |
          $uri = "ftp://$($env:PS4_IP):2121/data/GoldHEN/"
          $request = [System.Net.FtpWebRequest]::Create($uri)
          $request.Method = [System.Net.WebRequestMethods+Ftp]::ListDirectory
          $request.Credentials = New-Object System.Net.NetworkCredential("anonymous", "anonymous@example.com")
          $request.UsePassive = $true
          $request.UseBinary = $false
          $request.KeepAlive = $false
          $request.Timeout = 15000
          $request.ReadWriteTimeout = 15000

          $response = $null
          $reader = $null
          try {
            $response = [System.Net.FtpWebResponse]$request.GetResponse()
            $reader = New-Object System.IO.StreamReader($response.GetResponseStream())
            $entries = @()
            while (-not $reader.EndOfStream) {
              $line = $reader.ReadLine()
              if ($line) { $entries += $line }
            }

            Write-Host "GoldHEN directory is accessible."
            Write-Host "Entries returned: $($entries.Count)"
            $entries | Select-Object -First 30 | ForEach-Object { Write-Host " - $_" }
            Write-Host "SUCCESS: GoldHEN directory inspection completed."
          }
          catch {
            Write-Host "Could not list /data/GoldHEN/: $($_.Exception.Message)"
            throw
          }
          finally {
            if ($reader) { $reader.Dispose() }
            if ($response) { $response.Dispose() }
          }

      - name: Inspect existing plugin registration and files
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          PS4_IP: ${{ vars.PS4_IP }}
        run: |
          function Invoke-FtpRead($path, $method) {
            $uri = "ftp://$($env:PS4_IP):2121$path"
            $request = [System.Net.FtpWebRequest]::Create($uri)
            $request.Method = $method
            $request.Credentials = New-Object System.Net.NetworkCredential("anonymous", "anonymous@example.com")
            $request.UsePassive = $true
            $request.UseBinary = $false
            $request.KeepAlive = $false
            $request.Timeout = 15000
            $request.ReadWriteTimeout = 15000
            return $request
          }

          $response = $null
          $reader = $null
          try {
            $request = Invoke-FtpRead "/data/GoldHEN/plugins/" ([System.Net.WebRequestMethods+Ftp]::ListDirectory)
            $response = [System.Net.FtpWebResponse]$request.GetResponse()
            $reader = New-Object System.IO.StreamReader($response.GetResponseStream())
            $files = @()
            while (-not $reader.EndOfStream) {
              $line = $reader.ReadLine()
              if ($line) { $files += $line }
            }
            Write-Host "GoldHEN plugins directory is accessible."
            Write-Host "Plugin entries returned: $($files.Count)"
            $files | Select-Object -First 40 | ForEach-Object { Write-Host " - $_" }
            if ($files -contains "ps4_neural_engine.prx") {
              Write-Host "PNE PRX is already present."
            } else {
              Write-Host "PNE PRX is not present yet."
            }
          }
          catch {
            Write-Host "Plugin directory inspection failed: $($_.Exception.Message)"
            throw
          }
          finally {
            if ($reader) { $reader.Dispose() }
            if ($response) { $response.Dispose() }
          }

          $response = $null
          try {
            $request = Invoke-FtpRead "/data/GoldHEN/plugins.ini" ([System.Net.WebRequestMethods+Ftp]::GetFileSize)
            $response = [System.Net.FtpWebResponse]$request.GetResponse()
            Write-Host "plugins.ini exists; size: $($response.ContentLength) bytes."
          }
          catch {
            Write-Host "plugins.ini size check: file not readable or absent ($($_.Exception.Message))."
          }
          finally {
            if ($response) { $response.Dispose() }
          }

          Write-Host "SUCCESS: plugin registration inspection completed (read-only)."

      - name: Collect installer and plugin diagnostics (read-only)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          PS4_IP: ${{ vars.PS4_IP }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
          BUILD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "DIAGNOSTIC_CONTEXT=pre-stage; BUILD_RUN_ID=$env:BUILD_RUN_ID; BUILD_COMMIT=$env:BUILD_COMMIT; BUILD_BRANCH=$env:BUILD_BRANCH"
          $credentials = New-Object System.Net.NetworkCredential("anonymous", "anonymous@example.com")
          function FtpRead([string]$path, [string]$method) {
            $request = [System.Net.FtpWebRequest]::Create("ftp://$($env:PS4_IP):2121$path")
            $request.Method = $method
            $request.Credentials = $credentials
            $request.UsePassive = $true
            $request.UseBinary = $true
            $request.KeepAlive = $false
            $request.Timeout = 20000
            $request.ReadWriteTimeout = 20000
            $response = $request.GetResponse()
            try {
              $reader = New-Object System.IO.StreamReader($response.GetResponseStream())
              try { return $reader.ReadToEnd() } finally { $reader.Dispose() }
            } finally { $response.Dispose() }
          }
          Write-Host "=== GoldHEN plugin directory ==="
          try {
            FtpRead "/data/GoldHEN/plugins/" ([System.Net.WebRequestMethods+Ftp]::ListDirectory) |
              ForEach-Object { Write-Host $_ }
          } catch { Write-Host "PLUGIN_DIR_UNAVAILABLE: $($_.Exception.Message)" }
          Write-Host "=== installer status ==="
          try {
            Write-Host (FtpRead "/data/GoldHEN/ps4_neural_engine_install.log" ([System.Net.WebRequestMethods+Ftp]::DownloadFile))
          } catch { Write-Host "INSTALL_STATUS_UNAVAILABLE: $($_.Exception.Message)" }
          Write-Host "=== PNE registration lines in plugins.ini ==="
          try {
            $config = FtpRead "/data/GoldHEN/plugins.ini" ([System.Net.WebRequestMethods+Ftp]::DownloadFile)
            $lines = @($config -split "`r?`n" | Where-Object { $_.Contains("[default]") -or $_.Contains("ps4_neural_engine.prx") })
            if ($lines.Count -gt 0) { $lines | ForEach-Object { Write-Host $_ } }
            else { Write-Host "No PNE registration line found." }
          } catch { Write-Host "PLUGINS_INI_UNAVAILABLE: $($_.Exception.Message)" }
          Write-Host "DIAGNOSTICS_READ_ONLY_COMPLETE"

      - name: Clean stale artifact workspace on persistent runner
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $transfer = Join-Path $env:GITHUB_WORKSPACE "transfer"
          if (Test-Path -LiteralPath $transfer) {
            Remove-Item -LiteralPath $transfer -Recurse -Force
          }
          New-Item -ItemType Directory -Path $transfer -Force | Out-Null

      - name: Download validated PKG artifact from build run
        uses: actions/download-artifact@v4
        with:
          name: ps4-neural-engine-build
          path: transfer
          repository: demolidorreddragons/NR
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Transfer PKG to PS4 storage and verify remote copy
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          PS4_IP: ${{ vars.PS4_IP }}
        run: |
          $ErrorActionPreference = "Stop"
          $pkgFiles = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "transfer/pkg") -Filter "PS4-Neural-Engine-*.pkg" -File | Where-Object { $_.BaseName -match "^PS4-Neural-Engine-\d{3,}$" })
          if ($pkgFiles.Count -ne 1) {
            throw "Expected exactly one strictly numbered PKG, found $($pkgFiles.Count)."
          }
          $pkg = $pkgFiles[0].FullName
          $pkgNumber = [regex]::Match($pkgFiles[0].BaseName, "^PS4-Neural-Engine-(\d{3,})$").Groups[1].Value
          if (-not $pkgNumber) { throw "PKG release number could not be parsed." }
          $localHash = (Get-FileHash -LiteralPath $pkg -Algorithm SHA256).Hash.ToLowerInvariant()
          $localSize = (Get-Item -LiteralPath $pkg).Length
          $remotePath = "/data/PS4-Neural-Engine-$pkgNumber-$($localHash.Substring(0,12)).pkg"
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_NUMBER=$pkgNumber"
          $uri = "ftp://$($env:PS4_IP):2121$remotePath"
          $credentials = New-Object System.Net.NetworkCredential("anonymous", "anonymous@example.com")

          $upload = [System.Net.FtpWebRequest]::Create($uri)
          $upload.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
          $upload.Credentials = $credentials
          $upload.UsePassive = $true
          $upload.UseBinary = $true
          $upload.KeepAlive = $false
          $upload.Timeout = 120000
          $upload.ReadWriteTimeout = 120000
          $upload.ContentLength = $localSize
          $requestStream = $null
          $response = $null
          try {
            $requestStream = $upload.GetRequestStream()
            $input = [System.IO.File]::OpenRead($pkg)
            try { $input.CopyTo($requestStream) } finally { $input.Dispose() }
            $requestStream.Dispose()
            $requestStream = $null
            $response = [System.Net.FtpWebResponse]$upload.GetResponse()
            Write-Host "FTP upload response: $($response.StatusDescription.Trim())"
          }
          finally {
            if ($requestStream) { $requestStream.Dispose() }
            if ($response) { $response.Dispose() }
          }

          $download = [System.Net.FtpWebRequest]::Create($uri)
          $download.Method = [System.Net.WebRequestMethods+Ftp]::DownloadFile
          $download.Credentials = $credentials
          $download.UsePassive = $true
          $download.UseBinary = $true
          $download.KeepAlive = $false
          $download.Timeout = 120000
          $download.ReadWriteTimeout = 120000
          $response = $null
          $stream = $null
          $output = $null
          $verifyPath = Join-Path $env:RUNNER_TEMP "ps4-pkg-remote-verify.pkg"
          try {
            $response = [System.Net.FtpWebResponse]$download.GetResponse()
            $stream = $response.GetResponseStream()
            $output = [System.IO.File]::Create($verifyPath)
            $stream.CopyTo($output)
            $output.Dispose()
            $output = $null
            $remoteSize = (Get-Item -LiteralPath $verifyPath).Length
            $remoteHash = (Get-FileHash -LiteralPath $verifyPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($remoteSize -ne $localSize -or $remoteHash -ne $localHash) {
              throw "Remote PKG verification failed. Local=$localSize/$localHash Remote=$remoteSize/$remoteHash"
            }
            Write-Host "SUCCESS: PKG transferred to PS4 and SHA256 verified."
            Write-Host "Remote path: $remotePath"
            Write-Host "Size: $remoteSize bytes"
            Write-Host "SHA256: $remoteHash"
            Add-Content -Path $env:GITHUB_ENV -Value "PKG_SHA256=$localHash"
            Add-Content -Path $env:GITHUB_ENV -Value "PKG_SIZE=$localSize"
          }
          finally {
            if ($output) { $output.Dispose() }
            if ($stream) { $stream.Dispose() }
            if ($response) { $response.Dispose() }
            Remove-Item -LiteralPath $verifyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Move verified PKG into /data/pkg and verify destination
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          PS4_IP: ${{ vars.PS4_IP }}
        run: |
          $ErrorActionPreference = "Stop"
          $credentials = New-Object System.Net.NetworkCredential("anonymous", "anonymous@example.com")
          $fileName = "PS4-Neural-Engine-$($env:PKG_NUMBER)-$($env:PKG_SHA256.Substring(0,12)).pkg"
          $sourcePath = "/data/$fileName"
          $targetDir = "/data/pkg"
          $targetPath = "$targetDir/$fileName"

          function Invoke-FtpRequest($path, $method, $renameTo = $null) {
            $uri = "ftp://$($env:PS4_IP):2121$path"
            $request = [System.Net.FtpWebRequest]::Create($uri)
            $request.Method = $method
            $request.Credentials = $credentials
            $request.UsePassive = $true
            $request.UseBinary = $true
            $request.KeepAlive = $false
            $request.Timeout = 30000
            $request.ReadWriteTimeout = 30000
            if ($renameTo) { $request.RenameTo = $renameTo }
            return $request
          }

          # Create /data/pkg if it does not already exist.
          try {
            $r = Invoke-FtpRequest "$targetDir/" ([System.Net.WebRequestMethods+Ftp]::MakeDirectory)
            $response = $r.GetResponse()
            $response.Dispose()
            Write-Host "Created $targetDir"
          } catch {
            # Confirm the directory exists; do not hide unrelated failures.
            $r = Invoke-FtpRequest "$targetDir/" ([System.Net.WebRequestMethods+Ftp]::ListDirectory)
            $response = $r.GetResponse()
            $response.Dispose()
            Write-Host "$targetDir already exists."
          }

          # If the destination already exists, verify it before removing the duplicate source.
          $targetExists = $false
          try {
            $r = Invoke-FtpRequest $targetPath ([System.Net.WebRequestMethods+Ftp]::GetFileSize)
            $response = $r.GetResponse()
            $targetSize = $response.ContentLength
            $response.Dispose()
            $targetExists = $true
          } catch {
            Write-Host "Destination does not exist yet."
          }

          if ($targetExists) {
            if ($targetSize -ne [long]$env:PKG_SIZE) { throw "Existing destination has unexpected size $targetSize; refusing to overwrite." }
            $r = Invoke-FtpRequest $targetPath ([System.Net.WebRequestMethods+Ftp]::DownloadFile)
            $response = $r.GetResponse()
            $stream = $response.GetResponseStream()
            $checkPath = Join-Path $env:RUNNER_TEMP "ps4-pkg-existing-check.pkg"
            $output = [System.IO.File]::Create($checkPath)
            $stream.CopyTo($output)
            $output.Dispose(); $stream.Dispose(); $response.Dispose()
            $existingHash = (Get-FileHash -LiteralPath $checkPath -Algorithm SHA256).Hash.ToLowerInvariant()
            Remove-Item -LiteralPath $checkPath -Force
            if ($existingHash -ne $env:PKG_SHA256) {
              throw "Existing destination hash differs; refusing to overwrite."
            }
            $r = Invoke-FtpRequest $sourcePath ([System.Net.WebRequestMethods+Ftp]::DeleteFile)
            $response = $r.GetResponse(); $response.Dispose()
            Write-Host "Verified existing destination; removed duplicate from /data."
          } else {
            # Rename the verified source file into /data/pkg.
            $r = Invoke-FtpRequest $sourcePath ([System.Net.WebRequestMethods+Ftp]::Rename) "$targetDir/$fileName"
            $response = $r.GetResponse()
            Write-Host "FTP move response: $($response.StatusDescription.Trim())"
            $response.Dispose()
          }

          # Verify destination size and SHA-256 by downloading it back.
          $verifyPath = Join-Path $env:RUNNER_TEMP "ps4-pkg-moved-verify.pkg"
          $r = Invoke-FtpRequest $targetPath ([System.Net.WebRequestMethods+Ftp]::DownloadFile)
          $response = $null
          $stream = $null
          $output = $null
          try {
            $response = $r.GetResponse()
            $stream = $response.GetResponseStream()
            $output = [System.IO.File]::Create($verifyPath)
            $stream.CopyTo($output)
            $output.Dispose()
            $output = $null
            $size = (Get-Item -LiteralPath $verifyPath).Length
            $hash = (Get-FileHash -LiteralPath $verifyPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($size -ne [long]$env:PKG_SIZE -or $hash -ne $env:PKG_SHA256) {
              throw "Destination verification failed: $size bytes, SHA256 $hash"
            }
            Write-Host "SUCCESS: PKG moved and verified at $targetPath"
            Write-Host "Size: $size bytes"
            Write-Host "SHA256: $hash"
          } finally {
            if ($output) { $output.Dispose() }
            if ($stream) { $stream.Dispose() }
            if ($response) { $response.Dispose() }
            Remove-Item -LiteralPath $verifyPath -Force -ErrorAction SilentlyContinue
          }


  archive-neural-rendering-pkgs:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'feature/gcn8-numeric-kernels' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, ps4-lan]
    steps:
      - name: Move every Neural Rendering PKG from /data/pkg into /data/pkg/old
        shell: powershell
        env:
          PS4_IP: ${{ vars.PS4_IP }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:PS4_IP) { throw "PS4_IP repository variable is missing." }
          $credentials = New-Object System.Net.NetworkCredential("anonymous", "anonymous@example.com")

          function New-FtpRequest([string]$path, [string]$method, [string]$renameTo = $null) {
            $request = [System.Net.FtpWebRequest]::Create("ftp://$($env:PS4_IP):2121$path")
            $request.Method = $method
            $request.Credentials = $credentials
            $request.UsePassive = $true
            $request.UseBinary = $true
            $request.KeepAlive = $false
            $request.Timeout = 120000
            $request.ReadWriteTimeout = 120000
            if ($renameTo) { $request.RenameTo = $renameTo }
            return $request
          }

          function Get-FtpListing([string]$path) {
            $request = New-FtpRequest $path ([System.Net.WebRequestMethods+Ftp]::ListDirectory)
            $response = $request.GetResponse()
            try {
              $reader = New-Object System.IO.StreamReader($response.GetResponseStream())
              try {
                $items = @()
                while (-not $reader.EndOfStream) {
                  $line = $reader.ReadLine()
                  if ($line) { $items += $line.Trim() }
                }
                return $items
              } finally { $reader.Dispose() }
            } finally { $response.Dispose() }
          }

          # Ensure the archive directory exists; if mkdir fails, verify it is already present.
          try {
            $request = New-FtpRequest "/data/pkg/old/" ([System.Net.WebRequestMethods+Ftp]::MakeDirectory)
            $response = $request.GetResponse()
            $response.Dispose()
            Write-Host "CREATED=/data/pkg/old"
          } catch {
            $null = Get-FtpListing "/data/pkg/old/"
            Write-Host "EXISTS=/data/pkg/old"
          }

          $entries = @(Get-FtpListing "/data/pkg/")
          $targets = @($entries | Where-Object {
            $_ -match '(?i)(neural[-_ ]?rendering|neural[-_ ]?engine|pne).*\.pkg$'
          })
          Write-Host "MATCHING_PKGS=$($targets.Count)"
          if ($targets.Count -eq 0) {
            Write-Host "ARCHIVE_RESULT=NO_MATCHING_FILES"
            exit 0
          }

          $moved = 0
          foreach ($name in $targets) {
            if ($name -match '[/\\]') { throw "Unexpected non-basename FTP listing entry: $name" }
            $source = "/data/pkg/$name"
            $sizeRequest = New-FtpRequest $source ([System.Net.WebRequestMethods+Ftp]::GetFileSize)
            $sizeResponse = $sizeRequest.GetResponse()
            $sourceSize = [long]$sizeResponse.ContentLength
            $sizeResponse.Dispose()

            $destinationName = $name
            $destination = "/data/pkg/old/$destinationName"
            try {
              $check = New-FtpRequest $destination ([System.Net.WebRequestMethods+Ftp]::GetFileSize)
              $checkResponse = $check.GetResponse()
              $existingSize = [long]$checkResponse.ContentLength
              $checkResponse.Dispose()
              if ($existingSize -ne $sourceSize) {
                $stem = [System.IO.Path]::GetFileNameWithoutExtension($name)
                $ext = [System.IO.Path]::GetExtension($name)
                $destinationName = "$stem-archived-$($sourceSize)$ext"
                $destination = "/data/pkg/old/$destinationName"
                $check2 = New-FtpRequest $destination ([System.Net.WebRequestMethods+Ftp]::GetFileSize)
                try {
                  $r2 = $check2.GetResponse()
                  $r2.Dispose()
                  throw "Archive collision at $destination; refusing to overwrite."
                } catch {
                  if ($_.Exception.Message -like "*refusing to overwrite*") { throw }
                }
              } else {
                # Same-size existing archive entry: verify source and archive are byte-identical before deleting source.
                $sourceTemp = Join-Path $env:RUNNER_TEMP "pne-source-archive-check.pkg"
                $archiveTemp = Join-Path $env:RUNNER_TEMP "pne-old-archive-check.pkg"
                foreach ($pair in @(@($source,$sourceTemp),@($destination,$archiveTemp))) {
                  $download = New-FtpRequest $pair[0] ([System.Net.WebRequestMethods+Ftp]::DownloadFile)
                  $response = $download.GetResponse()
                  $stream = $response.GetResponseStream()
                  $output = [System.IO.File]::Create($pair[1])
                  try { $stream.CopyTo($output) } finally { $output.Dispose(); $stream.Dispose(); $response.Dispose() }
                }
                $h1 = (Get-FileHash -LiteralPath $sourceTemp -Algorithm SHA256).Hash
                $h2 = (Get-FileHash -LiteralPath $archiveTemp -Algorithm SHA256).Hash
                Remove-Item -LiteralPath $sourceTemp,$archiveTemp -Force
                if ($h1 -ne $h2) { throw "Archive collision has same size but different content: $destination" }
                $delete = New-FtpRequest $source ([System.Net.WebRequestMethods+Ftp]::DeleteFile)
                $response = $delete.GetResponse()
                $response.Dispose()
                Write-Host "ALREADY_ARCHIVED_IDENTICAL=$name"
                $moved++
                continue
              }
            } catch {
              if ($_.Exception.Message -like "*refusing to overwrite*") { throw }
              # A missing destination is the expected path for a new archive entry.
            }

            $rename = New-FtpRequest $source ([System.Net.WebRequestMethods+Ftp]::Rename) "old/$destinationName"
            $response = $rename.GetResponse()
            $response.Dispose()

            $verify = New-FtpRequest $destination ([System.Net.WebRequestMethods+Ftp]::GetFileSize)
            $verifyResponse = $verify.GetResponse()
            $destinationSize = [long]$verifyResponse.ContentLength
            $verifyResponse.Dispose()
            if ($destinationSize -ne $sourceSize) { throw "Post-move size mismatch for $destination" }

            try {
              $sourceCheck = New-FtpRequest $source ([System.Net.WebRequestMethods+Ftp]::GetFileSize)
              $sourceResponse = $sourceCheck.GetResponse()
              $sourceResponse.Dispose()
              throw "Source still exists after move: $source"
            } catch {
              if ($_.Exception.Message -like "*Source still exists*") { throw }
            }
            Write-Host "ARCHIVED=$name"
            Write-Host "ARCHIVE_SIZE=$destinationSize"
            $moved++
          }

          Write-Host "ARCHIVED_COUNT=$moved"
          Write-Host "ARCHIVE_RESULT=SUCCESS"
