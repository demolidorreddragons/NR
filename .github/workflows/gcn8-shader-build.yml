name: GCN8 shader compiler and GEMM binary

concurrency:
  # Push and pull_request events for the same commit must not cancel each other.
  group: gcn8-shader-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [feature/gcn8-numeric-kernels]
    paths:
      - "platform/ps4/gcn8/shaders/**"
      - ".github/workflows/gcn8-shader-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "platform/ps4/gcn8/shaders/**"
      - ".github/workflows/gcn8-shader-build.yml"

permissions:
  contents: read

jobs:
  build-gfx8-compute:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host compiler and shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-mako glslang-tools
      - name: Checkout pinned shader compiler and header dependencies
        run: |
          git clone https://github.com/PS4-OpenGNM/opengnm-psbc.git .deps/opengnm-psbc
          git -C .deps/opengnm-psbc checkout 28697f007862427ebec54388ec972ce6e3545912
          git clone https://github.com/PS4-OpenGNM/opengnm.git .deps/opengnm
          git -C .deps/opengnm checkout 4b295ca54c82c83acf308d1c646a2dfa9ae57350
          git clone https://github.com/KhronosGroup/SPIRV-Headers.git .deps/SPIRV-Headers
          git -C .deps/SPIRV-Headers checkout 09913f088a1197aba4aefd300a876b2ebbaa3391
          git clone https://github.com/KhronosGroup/Vulkan-Headers.git .deps/Vulkan-Headers
          git -C .deps/Vulkan-Headers checkout v1.3.296
      - name: Configure reproducible host compiler build
        working-directory: .deps/opengnm-psbc
        run: |
          cat > config.mak <<'EOF'
          CC=gcc
          CXX=g++
          LD=g++
          AR=ar
          PYTHON=python3
          DESTDIR=/usr/local
          BINDIR=/usr/local/bin
          SHARED_FLAGS=-Iinclude/mesa -Iinclude/ -Ilibpsbc/ -I../opengnm/include -I../SPIRV-Headers/include -I../Vulkan-Headers/include -Isrc/ -Isrc/amd -Isrc/amd/common -Isrc/amd/common/nir -Isrc/amd/compiler -Isrc/amd/vulkan -Isrc/amd/vulkan/nir -Isrc/vulkan/runtime -Isrc/vulkan/runtime/bvh -Isrc/vulkan/util -Isrc/compiler -Isrc/compiler/nir -Isrc/compiler/spirv -Isrc/gallium/include -Isrc/mesa -Isrc/mesa/main -Isrc/util -Icmd/psbc -Iinclude/mesa -D_GNU_SOURCE -D_XOPEN_SOURCE=700 -DUTIL_ARCH_LITTLE_ENDIAN=1 -DUTIL_ARCH_BIG_ENDIAN=0 -DHAVE_STRUCT_TIMESPEC=1 -DHAVE_PTHREAD=1
          CFLAGS=-std=gnu11 -O2 -g -Wall -Wno-unused-function -Wno-unused-variable $(SHARED_FLAGS)
          CXXFLAGS=-std=c++17 -O2 -g -Wall -Wno-unused-function -Wno-unused-variable $(SHARED_FLAGS)
          LDFLAGS=-lm -pthread -ldl
          EOF
          test -f ../SPIRV-Headers/include/spirv/spir-v.xml
          test -f ../Vulkan-Headers/include/vulkan/vulkan.h
      - name: Generate Mesa headers required by PSBC
        working-directory: .deps/opengnm-psbc
        run: |
          # Reproduce the generated headers declared by Mesa's pinned meson.build files.
          python3 src/util/process_shader_stats.py src/util/shader_stats.rnc src/util/shader_stats.xml > src/util/shader_stats.h
          test -s src/util/shader_stats.h
          python3 src/util/format/u_format_table.py src/util/format/u_format.yaml --enums > src/util/format/u_format_gen.h
          test -s src/util/format/u_format_gen.h
          python3 src/util/format/u_format_table.py src/util/format/u_format.yaml --header > src/util/format/u_format_pack.h
          test -s src/util/format/u_format_pack.h
          python3 src/util/format/u_format_table.py src/util/format/u_format.yaml > src/util/format/u_format_table.c
          test -s src/util/format/u_format_table.c
          python3 src/compiler/builtin_types_h.py src/compiler/builtin_types.h
          test -s src/compiler/builtin_types.h
          python3 src/compiler/builtin_types_c.py src/compiler/builtin_types.c
          test -s src/compiler/builtin_types.c
          python3 src/vulkan/util/vk_struct_type_cast_gen.py --xml src/vulkan/registry/vk.xml --out src/vulkan/util/vk_struct_type_cast.h --beta false
          test -s src/vulkan/util/vk_struct_type_cast.h
      - name: Build pinned opengnm-psbc host compiler
        working-directory: .deps/opengnm-psbc
        run: |
          make -j2
          test -x opengnm-psbc
      - name: Compile NR compute shaders to SPIR-V
        run: |
          mkdir -p dist/ps4/gcn8
          for shader in gemm_fp32_wave64_tiled gemm_fp32 gemm_fp16_accum e4m3_decode e4m3_encode; do
            glslangValidator -V --target-env vulkan1.1 "platform/ps4/gcn8/shaders/${shader}.comp" -o "dist/ps4/gcn8/${shader}.spv"
            test -s "dist/ps4/gcn8/${shader}.spv"
          done
      - name: Compile SPIR-V to PS4 Pro GFX8 GNM shader binaries
        run: |
          for shader in gemm_fp32_wave64_tiled gemm_fp32 gemm_fp16_accum e4m3_decode e4m3_encode; do
            .deps/opengnm-psbc/opengnm-psbc -s compute -f "dist/ps4/gcn8/${shader}.spv" -o "dist/ps4/gcn8/${shader}.sb" -n
            test -s "dist/ps4/gcn8/${shader}.sb"
          done
      - name: Validate GNM compute containers and record raw metadata (not register decode)
        run: |
          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          import struct
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("verify_sb", ".deps/opengnm-psbc/tests/verify_sb.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          shaders = ("gemm_fp32_wave64_tiled", "gemm_fp32", "gemm_fp16_accum", "e4m3_decode", "e4m3_encode")
          report = []
          for shader in shaders:
              path = Path("dist/ps4/gcn8") / f"{shader}.sb"
              if not module.verify_shader(str(path), module.GNM_SHADER_COMPUTE):
                  raise SystemExit(f"GFX8 compute shader container validation failed: {shader}")
              data = path.read_bytes()
              orb = data.find(b"OrbShdr")
              if orb < 0 or orb + module.GNM_BINARY_INFO_SIZE > len(data):
                  raise SystemExit(f"GNM binary info is truncated: {shader}")
              u32 = lambda off: struct.unpack_from("<I", data, off)[0]
              length_field = u32(orb + 8)
              chunk_offset = data[orb + 12]
              num_slots = data[orb + 13]
              first_slot_type = None
              if num_slots:
                  slot_offset = orb - chunk_offset * 4
                  if slot_offset < module.PSSL_HEADER_SIZE + module.GNM_FILE_HEADER_SIZE or slot_offset >= len(data):
                      raise SystemExit(f"Input usage slot offset is out of range: {shader}")
                  first_slot_type = data[slot_offset]
              report.append({
                  "shader": shader,
                  "file": str(path),
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "pssl_shader_type": data[12],
                  "pssl_code_type": data[13],
                  "pssl_code_size": u32(16),
                  "gnm_stage": data[module.PSSL_HEADER_SIZE + 8],
                  "gnm_target_gpu_mode": data[module.PSSL_HEADER_SIZE + 11],
                  "orbshdr_offset": orb,
                  "chunk_usage_base_offset_dwords": chunk_offset,
                  "input_usage_slots": num_slots,
                  "first_input_usage_type": first_slot_type,
                  "shader_hash": f"{u32(orb + 20):08x}{u32(orb + 16):08x}",
                  "gcn_code_size": (length_field >> 8) & 0xffffff,
                  "crc32": f"{u32(orb + 24):08x}"
              })
              print(f"VERIFIED {shader}: compute container/CRC valid; register metadata still requires ISA decoding")
          Path("dist/ps4/gcn8/gnm-container-report.json").write_text(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nr-gcn8-compute-shaders-gfx8
          path: |
            dist/ps4/gcn8/*.spv
            dist/ps4/gcn8/*.sb
          if-no-files-found: error
